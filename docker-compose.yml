services:
  workouts:
    build: .
    image: workouts-cli
    container_name: workouts
    entrypoint: ["bundle", "exec", "git", "fit"]
    volumes:
      - ./data:/app/data
    environment:
      - GIT_FIT_DATABASE_PATH
      - GIT_FIT_STRAVA_CLIENT_ID
      - GIT_FIT_STRAVA_CLIENT_SECRET
      - GIT_FIT_STRAVA_REFRESH_TOKEN
      - GIT_FIT_GARMIN_EMAIL
      - GIT_FIT_GARMIN_PASSWORD
      - GIT_FIT_GARMIN_TOKEN_PATH
      - GIT_FIT_KEEP_PHONE
      - GIT_FIT_KEEP_PASSWORD
      - GIT_FIT_IGPSPORT_PHONE
      - GIT_FIT_IGPSPORT_PASSWORD
      - GIT_FIT_XOSS_EMAIL
      - GIT_FIT_XOSS_PASSWORD
      - GIT_FIT_XOSS_TOKEN_PATH
      - GIT_FIT_XINGZHE_EMAIL
      - GIT_FIT_XINGZHE_PASSWORD
      - GIT_FIT_XINGZHE_SESSION_PATH
    tmpfs:
      - /tmp
