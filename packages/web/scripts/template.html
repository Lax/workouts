<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="app-theme" content="{{THEME}}" />
  <title>Workouts</title>
  <script>

  </script>

  <link rel="stylesheet" href="/src/app.css" />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="{{ENTRY}}"></script>
</body>
</html>
