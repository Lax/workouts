name: Build frontend UI
description: Build the frontend from vendored source (frontend/) with site config injection, copy dist into out-dir.

inputs:
  config:
    description: Path to the frontend site config (JSON)
    required: false
    default: config.json
  out-dir:
    description: Directory to copy built UI into
    required: false
    default: site

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      working-directory: frontend
      shell: bash
      run: npm ci

    - name: Inject site config
      shell: bash
      run: cp "${{ inputs.config }}" frontend/packages/web/config.json

    - name: Build frontend
      working-directory: frontend
      shell: bash
      run: npm run build

    - name: Verify build output
      working-directory: frontend/packages/web
      shell: bash
      run: npm run verify-build-output

    - name: Copy dist into out-dir
      shell: bash
      run: mkdir -p "${{ inputs.out-dir }}" && cp -r frontend/packages/web/dist/. "${{ inputs.out-dir }}"
