name: "[DB] Dangerous fix schema version 72"

on:
  workflow_dispatch:

jobs:
  fix-schema-version-72:
    concurrency:
      group: workouts-db
      cancel-in-progress: false
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      contents: write
    env:
      GIT_FIT_DATABASE_PATH: ${{ vars.GIT_FIT_DATABASE_PATH || 'data/db/workouts.db' }}
    steps:
      - id: run
        uses: ./.github/actions/danger-db-run
        with:
          operation: |
            if [ ! -f "$DB_PATH" ]; then
              echo "DB not found: $DB_PATH — nothing to fix"
              echo "updated=" >> $GITHUB_OUTPUT
              echo "result={\"before\":\"\",\"after\":\"\"}" >> $GITHUB_OUTPUT
              exit 0
            fi
            BEFORE=$(sqlite3 "$DB_PATH" "SELECT version FROM schema_info" 2>/dev/null || echo "")
            echo "schema_info.version before: ${BEFORE:-<no table/row>}"
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "1" ]; then
              sqlite3 "$DB_PATH" "UPDATE schema_info SET version=1"
              echo "updated version $BEFORE → 1"
              echo "mutated=true" >> $GITHUB_OUTPUT
            else
              echo "no change needed"
              echo "mutated=false" >> $GITHUB_OUTPUT
            fi
            AFTER=$(sqlite3 "$DB_PATH" "SELECT version FROM schema_info" 2>/dev/null || echo "")
            echo "schema_info.version after: ${AFTER:-<no table/row>}"
            echo "updated=$AFTER" >> $GITHUB_OUTPUT
            echo "result={\"before\":\"${BEFORE:-}\",\"after\":\"${AFTER:-}\"}" >> $GITHUB_OUTPUT

      - name: Summary
        if: always()
        run: |
          echo "### Fix schema version 72" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Before | \`${{ fromJSON(steps.run.outputs.result || '{}').before || '<none>' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| After | \`${{ fromJSON(steps.run.outputs.result || '{}').after || '<none>' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "One-time migration for git-fit 0.21.5 squash (001-004 → 001). Disable this workflow after first success." >> $GITHUB_STEP_SUMMARY
