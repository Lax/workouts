name: "[Backfill] datetime format"

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Source to backfill (all|keep|strava|igpsport)'
        required: false
        type: choice
        default: all
        options:
          - all
          - keep
          - strava
          - igpsport
  schedule:
    # Weekly safety net — idempotent, no side effects when nothing to fix.
    - cron: '0 4 * * 0'

jobs:
  backfill:
    concurrency:
      group: workouts-db
      cancel-in-progress: false
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      contents: write
      actions: write
    env:
      GIT_FIT_DATABASE_PATH: ${{ vars.GIT_FIT_DATABASE_PATH || 'data/db/workouts.db' }}
    steps:
      - uses: actions/checkout@v6

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      # ── DB paths ──
      - name: '[db] Derive database paths'
        id: db-paths
        uses: git-fit-actions/db-store/paths@v1
        with:
          database-path: ${{ env.GIT_FIT_DATABASE_PATH }}

      # ── DB restore ──
      - name: '[db] Restore cache'
        id: db-restore
        uses: git-fit-actions/db-store/cache/restore@v1
        with:
          db-dir: ${{ steps.db-paths.outputs.dir }}
          db-name: ${{ steps.db-paths.outputs.name }}
          git-restore-mode: fallback
          git-branch: GitFit/db

      # ── Keep raw data restore ──
      - name: Restore keep data cache
        uses: git-fit-actions/data-store/cache/restore@v2
        with:
          sources: keep

      # ── Backfill Keep (from raw files + GPS/region TZ) ──
      - name: Backfill Keep
        id: backfill-keep
        if: inputs.source == 'all' || inputs.source == 'keep'
        shell: bash
        env:
          GIT_FIT_SYSTEM_TIMEZONE: ${{ vars.GIT_FIT_SYSTEM_TIMEZONE || 'Asia/Shanghai' }}
        run: |
          bundle exec ruby scripts/backfill_keep_time.rb \
            --db-path "${{ steps.db-paths.outputs.db-path }}" \
            --source keep

      # ── Backfill Strava (offset inference from start_date/start_date_local) ──
      - name: Backfill Strava
        id: backfill-strava
        if: inputs.source == 'all' || inputs.source == 'strava'
        shell: bash
        run: |
          bundle exec ruby scripts/backfill_keep_time.rb \
            --db-path "${{ steps.db-paths.outputs.db-path }}" \
            --source strava

      # ── Backfill iGPSPORT (offset inference from start_date/start_date_local) ──
      - name: Backfill iGPSPORT
        id: backfill-igpsport
        if: inputs.source == 'all' || inputs.source == 'igpsport'
        shell: bash
        run: |
          bundle exec ruby scripts/backfill_keep_time.rb \
            --db-path "${{ steps.db-paths.outputs.db-path }}" \
            --source igpsport

      # ── Compute total updates ──
      - name: Compute total updates
        id: total
        shell: bash
        run: |
          keep=${{ steps.backfill-keep.outputs.updated || '0' }}
          strava=${{ steps.backfill-strava.outputs.updated || '0' }}
          igpsport=${{ steps.backfill-igpsport.outputs.updated || '0' }}
          total=$((keep + strava + igpsport))
          echo "updated=$total" >> "$GITHUB_OUTPUT"
          echo "backfill: keep=$keep strava=$strava igpsport=$igpsport total=$total"

      # ── WAL checkpoint (only if changes were made) ──
      - name: '[db] Checkpoint SQLite WAL'
        if: steps.total.outputs.updated > 0
        shell: bash
        env:
          DB_PATH: ${{ steps.db-paths.outputs.db-path }}
        run: |
          bundle exec ruby -e '
            require "sequel"
            db = Sequel.sqlite(ENV.fetch("DB_PATH"))
            db.run("PRAGMA wal_checkpoint(TRUNCATE)")
            print File.size(ENV.fetch("DB_PATH"))
          '

      # ── DB save ──
      - name: '[db] Gate git save on job success'
        id: git-save-gate
        if: success() && steps.total.outputs.updated > 0
        shell: bash
        run: echo "save-to-git-branch=${{ steps.db-restore.outputs.save-to-git-branch }}" >> "$GITHUB_OUTPUT"

      - name: '[db] Save cache'
        if: always()
        uses: git-fit-actions/db-store/cache/save@v1
        with:
          db-dir: ${{ steps.db-paths.outputs.dir }}
          db-name: ${{ steps.db-paths.outputs.name }}
          save-to-git-branch: ${{ steps.git-save-gate.outputs.save-to-git-branch || 'false' }}

      # ── Deploy (only if DB changed) ──
      - name: Trigger gh-pages deploy
        if: steps.total.outputs.updated > 0
        run: |
          gh workflow run gh-pages.yml --ref master
        env:
          GH_TOKEN: ${{ github.token }}
