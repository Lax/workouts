name: "[DB] Dangerous backfill device/app/lineage"

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Source to backfill"
        type: choice
        default: "all"
        options:
          - all
          - igpsport
          - keep
          - xoss
          - strava
          - garmin
          - garmin_cn
          - xingzhe
          - codoon
          - 2bulu
          - apple_health
      force:
        description: "Re-run already backfilled rows (requires single source)"
        type: boolean
        default: false
      dry_run:
        description: "Report only, do not write"
        type: boolean
        default: false

jobs:
  backfill-device:
    name: "Backfill device/app/lineage"
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    env:
      GIT_FIT_DATABASE_PATH: ${{ vars.GIT_FIT_DATABASE_PATH || 'data/db/workouts.db' }}
    concurrency:
      group: workouts-db
      cancel-in-progress: false
    steps:
      - id: run
        uses: ./.github/actions/danger-db-run
        with:
          save: ${{ !inputs.dry_run }}
          data-sources: igpsport,keep,xoss,strava,garmin,garmin_cn,xingzhe,codoon,joyrun
          operation: |
            bundle exec ruby scripts/backfill_device_app.rb \
              --db-path "$DB_PATH" \
              --source "${{ inputs.source }}" \
              ${{ inputs.force && '--force' || '' }} \
              ${{ inputs.dry_run && '--dry-run' || '' }} \
              2>&1 | tee backfill.out

            COUNT=$(grep -oP '(would update=|updated=)\K[0-9]+' backfill.out | head -1)
            [ -n "$COUNT" ] || { echo "::error::backfill produced no summary line"; exit 1; }
            echo "updated=$COUNT" >> $GITHUB_OUTPUT
            if [ "$COUNT" -gt 0 ] && [ "${{ inputs.dry_run }}" != "true" ]; then
              echo "mutated=true" >> $GITHUB_OUTPUT
              bundle exec ruby scripts/wal_checkpoint.rb "$DB_PATH"
            fi

      - name: 'Trigger gh-pages deploy'
        if: steps.run.outputs.updated > 0 && !inputs.dry_run
        run: gh workflow run gh-pages.yml --ref master
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Summary
        run: |
          {
            echo "### GitFit device/app/lineage backfill"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Source | \`${{ inputs.source }}\` |"
            echo "| Force | \`${{ inputs.force }}\` |"
            echo "| Dry-run | \`${{ inputs.dry_run }}\` |"
            echo "| ✅ Updated | \`${{ steps.run.outputs.updated || 0 }}\` |"
            echo ""
          } >> $GITHUB_STEP_SUMMARY

          WARNINGS=$(grep -E '^(backfill|IGPSPORT|Garmin):' backfill.out 2>/dev/null || true)
          if [ -n "$WARNINGS" ]; then
            echo "### Warnings" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$WARNINGS" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
