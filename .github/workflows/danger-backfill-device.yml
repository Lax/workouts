name: "[DB] Dangerous backfill device/app/lineage"

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Source to backfill"
        type: choice
        default: "all"
        options:
          - all
          - igpsport
          - keep
          - xoss
          - strava
          - garmin
          - garmin_cn
          - xingzhe
          - codoon
          - 2bulu
          - apple_health
      force:
        description: "Re-run already backfilled rows (requires single source)"
        type: boolean
        default: false
      dry_run:
        description: "Report only, do not write"
        type: boolean
        default: false

jobs:
  backfill-device:
    name: "Backfill device/app/lineage"
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    env:
      GIT_FIT_DATABASE_PATH: ${{ vars.GIT_FIT_DATABASE_PATH || 'data/db/workouts.db' }}
    concurrency:
      group: workouts-db
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - id: db-paths
        uses: git-fit-actions/db-store/paths@v1
        with:
          database-path: ${{ env.GIT_FIT_DATABASE_PATH }}

      - name: '[db] Restore cache'
        uses: git-fit-actions/db-store/cache/restore@v1
        with:
          db-dir: ${{ steps.db-paths.outputs.dir }}
          db-name: ${{ steps.db-paths.outputs.name }}
          git-restore-mode: fallback
          git-branch: GitFit/db

      - name: 'Restore data store'
        uses: git-fit-actions/data-store/cache/restore@v2
        with:
          sources: igpsport,keep,xoss,strava,garmin,garmin_cn,xingzhe,codoon,joyrun

      - name: Run device/app/lineage backfill
        id: backfill
        run: |
          set -o pipefail
          bundle exec ruby scripts/backfill_device_app.rb \
            --db-path "${{ steps.db-paths.outputs.db-path }}" \
            --source "${{ inputs.source }}" \
            ${{ inputs.force && '--force' || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            2>&1 | tee backfill.out

          COUNT=$(grep -oP '(would update=|updated=)\K[0-9]+' backfill.out | head -1)
          [ -n "$COUNT" ] || { echo "::error::backfill produced no summary line"; exit 1; }
          echo "updated=$COUNT" >> $GITHUB_OUTPUT

      - name: '[db] Checkpoint'
        if: steps.backfill.outputs.updated > 0 && !inputs.dry_run
        env:
          DB_PATH: ${{ steps.db-paths.outputs.db-path }}
        run: |
          bundle exec ruby -e '
            require "sequel"
            db = Sequel.sqlite(ENV.fetch("DB_PATH"))
            db.run("PRAGMA wal_checkpoint(TRUNCATE)")
            print File.size(ENV.fetch("DB_PATH"))
          '

      - name: '[db] Save cache'
        if: always() && !inputs.dry_run
        uses: git-fit-actions/db-store/cache/save@v1
        with:
          db-dir: ${{ steps.db-paths.outputs.dir }}
          db-name: ${{ steps.db-paths.outputs.name }}
          save-to-git-branch: false

      - name: 'Trigger gh-pages deploy'
        if: steps.backfill.outputs.updated > 0 && !inputs.dry_run
        run: gh workflow run gh-pages.yml --ref master
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Summary
        run: |
          {
            echo "### GitFit device/app/lineage backfill"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Source | \`${{ inputs.source }}\` |"
            echo "| Force | \`${{ inputs.force }}\` |"
            echo "| Dry-run | \`${{ inputs.dry_run }}\` |"
            echo "| ✅ Updated | \`${{ steps.backfill.outputs.updated || 0 }}\` |"
            echo ""
          } >> $GITHUB_STEP_SUMMARY

          WARNINGS=$(grep -E '^(backfill|IGPSPORT|Garmin):' backfill.out 2>/dev/null || true)
          if [ -n "$WARNINGS" ]; then
            echo "### Warnings" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$WARNINGS" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
