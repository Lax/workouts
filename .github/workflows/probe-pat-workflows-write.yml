name: Probe PAT workflows:write (Self-Delete)
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Probe PAT permissions
        uses: ./.github/actions/probe-pat-permissions
        with:
          pat_token: ${{ secrets.WORKOUTS_SYNC_PAT }}

      - name: Delete self workflow file
        shell: bash
        env:
          PAT_TOKEN: ${{ secrets.WORKOUTS_SYNC_PAT }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          API="${GITHUB_API_URL:-https://api.github.com}"
          REPO="${GITHUB_REPOSITORY}"
          AUTH="Authorization: Bearer ${PAT_TOKEN}"

          # Extract workflow file path from GITHUB_WORKFLOW_REF
          # Format: owner/repo/.github/workflows/file.yml@branch
          FILE=$(echo "$GITHUB_WORKFLOW_REF" | sed 's|^[^/]*/[^/]*/||;s|@.*||')
          echo "Deleting self: ${FILE}" >&2

          RESP=$(curl -s -H "$AUTH" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API}/repos/${REPO}/contents/${FILE}")

          SHA=$(echo "$RESP" | sed -n 's/.*"sha"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | head -1)

          if [ -z "$SHA" ]; then
            echo "Error: cannot find SHA for ${FILE}" >&2
            echo "$RESP" >&2
            exit 1
          fi

          echo "Deleting self: ${FILE} (sha=${SHA})" >&2
          DELETE_RESP=$(curl -s -w "\n%{http_code}" \
            -X DELETE -H "$AUTH" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            "${API}/repos/${REPO}/contents/${FILE}?sha=${SHA}" \
            -d "{\"message\":\"delete self: ${FILE}\"}")
          DELETE_BODY=$(echo "$DELETE_RESP" | sed '$d')
          DELETE_CODE=$(echo "$DELETE_RESP" | tail -1)

          echo "DELETE response body:" >&2
          echo "${DELETE_BODY}" >&2
          echo "self_delete_http=${DELETE_CODE}" >&2

          if [ "$DELETE_CODE" != "200" ]; then
            echo "Self-delete failed with HTTP ${DELETE_CODE}" >&2
            exit 1
          fi

          echo "Self-deleted: ${FILE}" >&2
