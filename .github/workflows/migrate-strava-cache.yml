name: Migrate Strava Cache (rename .json → .api.json)

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: _/_/strava
          fetch-depth: 0

      - name: Verify files
        run: |
          ls data/raw/strava/*.api.json | head -5
          echo "raw files: $(ls data/raw/strava/*.api.json | wc -l)"
          echo "std files: $(ls data/std/strava/*.json | wc -l)"

      - name: Save migrated files to cache
        uses: actions/cache/save@v4
        with:
          path: |
            data/raw/strava/
            data/std/strava/
          key: raw-std-v1-strava-${{ github.run_id }}-migrate
