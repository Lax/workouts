name: Migrate Strava Cache (rename .json → .api.json)

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: _/_/strava

      - name: Save migrated files to cache
        uses: actions/cache/save@v4
        with:
          path: |
            data/raw/strava/
            data/std/strava/
          key: raw-std-v1-strava-${{ github.run_id }}-api
