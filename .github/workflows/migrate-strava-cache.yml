name: Migrate Strava Cache (rename .json → .api.json)

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: _/_/strava

      - name: Verify files
        run: |
          echo "raw api.json count: $(ls data/raw/strava/*.api.json 2>/dev/null | wc -l)"
          echo "raw fit count: $(ls data/raw/strava/*.fit 2>/dev/null | wc -l)"
          echo "std count: $(ls data/std/strava/*.json 2>/dev/null | wc -l)"
          exit 0

      - name: Save cache
        uses: actions/cache/save@v4
        with:
          path: |
            data/raw/strava/
            data/std/strava/
          key: raw-std-v1-strava-${{ github.run_id }}-migrate
