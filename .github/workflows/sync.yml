name: Sync Workouts
on:
  schedule:
    # NOTE: */N not * — sed below matches /\d+ \* \* to update interval
    - cron: '0 2 */2 * *'
    - cron: '0 14 */2 * *'
  workflow_dispatch:

jobs:
  sync:
    concurrency:
      group: workouts-db
      cancel-in-progress: false
    # set RUNNER_LABEL=self-hosted → local runner
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v6

      - uses: ruby/setup-ruby@v1
        if: vars.RUNNER_LABEL != 'self-hosted'
        with:
          ruby-version: '3.4'
          bundler-cache: true

      # ── DB restore (git-fit db-store) ──
      - name: '[db] Restore cache'
        uses: git-fit-actions/db-store/cache/restore@v1
        with:
          database-path: data/db/workouts.db

      - name: '[db] Restore from archive branch'
        id: db-archive-restore
        shell: bash
        run: |
          if [ ! -s data/db/workouts.db ]; then
            echo "Cache miss — falling back to archive branch"
            git fetch origin GitFit/db || true
            if git archive --format=tar origin/GitFit/db \
                 data/db/workouts.db data/db/workouts.db.SHA256SUMS 2>/dev/null | tar xf -; then
              bytes=$(stat -c%s data/db/workouts.db 2>/dev/null || echo 0)
              echo "restored=$bytes" >> $GITHUB_OUTPUT
              echo "Restored DB from archive branch: $bytes bytes"
            else
              echo "SHA256SUMS not in archive — restoring DB only"
              git archive --format=tar origin/GitFit/db \
                 data/db/workouts.db 2>/dev/null | tar xf - || true
              if [ -f data/db/workouts.db ] && [ -s data/db/workouts.db ]; then
                bytes=$(stat -c%s data/db/workouts.db 2>/dev/null || echo 0)
                echo "restored=$bytes" >> $GITHUB_OUTPUT
                echo "Restored DB from archive branch: $bytes bytes"
              else
                echo "restored=0" >> $GITHUB_OUTPUT
                echo "Archive branch restore failed — DB will be created fresh by sync"
              fi
            fi
          else
            echo "restored=0" >> $GITHUB_OUTPUT
          fi

      - name: Import Apple Health
        uses: ./.github/actions/import-apple-health
        with:
          git-configured: 'true'

      # ── Data restore ──
      - uses: git-fit-actions/data-store/cache/restore@v2
        with:
          sources: keep,igpsport,xoss,xingzhe,garmin,garmin_cn,strava

      - name: Sync activities
        uses: ./.github/actions/sync-activities
        with:
          sync-time-budget: ${{ vars.SYNC_TIME_BUDGET || '' }}
          sync-total-timeout: ${{ vars.SYNC_TOTAL_TIMEOUT || '' }}
          garmin-auth-seed: ${{ secrets.SYNC_GARMIN_AUTH_SEED }}
          garmin-cn-secret: ${{ secrets.SYNC_GARMIN_CN_SECRET }}
          xoss-email: ${{ secrets.SYNC_XOSS_EMAIL }}
          xoss-password: ${{ secrets.SYNC_XOSS_PASSWORD }}
          xingzhe-email: ${{ secrets.SYNC_XINGZHE_EMAIL }}
          xingzhe-password: ${{ secrets.SYNC_XINGZHE_PASSWORD }}
          keep-phone: ${{ secrets.SYNC_KEEP_PHONE }}
          keep-password: ${{ secrets.SYNC_KEEP_PASSWORD }}
          igpsport-phone: ${{ secrets.SYNC_IGPSPORT_PHONE }}
          igpsport-password: ${{ secrets.SYNC_IGPSPORT_PASSWORD }}
          strava-client-id: ${{ secrets.SYNC_STRAVA_CLIENT_ID }}
          strava-client-secret: ${{ secrets.SYNC_STRAVA_CLIENT_SECRET }}
          strava-refresh-token: ${{ secrets.SYNC_STRAVA_REFRESH_TOKEN }}

      - name: Fetch Strava original files
        continue-on-error: true
        timeout-minutes: 10
        shell: bash
        env:
          SYNC__STRAVA__WEB_AUTH__AUTH_SEED: ${{ secrets.SYNC_STRAVA_WEB_AUTH_SEED }}
        run: bundle exec workouts strava fetch --db ${{ vars.GIT_FIT_DATABASE_PATH }} --limit 10

      - id: data-save
        uses: git-fit-actions/data-store/cache/save@v2
        with:
          sources: keep,igpsport,xoss,xingzhe,garmin,garmin_cn,strava

      - name: Parse Geo Regions
        uses: ./.github/actions/parse-geo-regions
        with:
          geo-cache-dir: data/cache
          amap-key: ${{ secrets.AMAP_API_KEY }}
          db-path: ${{ vars.GIT_FIT_DATABASE_PATH }}
          detect-limit: 200
          detect-batch: 20
          detect-strategy: proportional
          detect-time: 300

      - name: '[db] Checkpoint SQLite WAL'
        id: db-checkpoint
        if: always()
        shell: bash
        env:
          DB_PATH: ${{ vars.GIT_FIT_DATABASE_PATH }}
        run: |
          if [ -f "$DB_PATH" ]; then
            bytes=$(bundle exec ruby -e '
              require "sequel"
              db = Sequel.sqlite(ENV.fetch("DB_PATH"))
              db.run("PRAGMA wal_checkpoint(TRUNCATE)")
              print File.size(ENV.fetch("DB_PATH"))
            ')
            echo "db_size=$bytes" >> $GITHUB_OUTPUT
            echo "WAL checkpoint: $bytes bytes"
          fi

      # ── DB save (git-fit db-store) ──
      - name: '[db] Save cache'
        id: db-save
        uses: git-fit-actions/db-store/cache/save@v1
        with:
          database-path: data/db/workouts.db

      - name: Trigger sync scheduler
        if: github.event_name == 'schedule'
        run: |
          gh workflow run sync-scheduler.yml --ref main -f commit=true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Write DB summary
        if: always()
        shell: bash
        run: |
          {
            echo "### DB sync result"
            echo "- DB path: ${{ vars.GIT_FIT_DATABASE_PATH }}"
            echo "- DB changed: ${{ steps.db-save.outputs.changed }}"
            echo "- DB size: ${{ steps.db-checkpoint.outputs.db_size }} bytes"
            echo "- Archive restore: ${{ steps.db-archive-restore.outputs.restored }} bytes"
            echo "- Data changed sources: ${{ steps.data-save.outputs.changed_sources }}"
            echo "- Data unchanged sources: ${{ steps.data-save.outputs.unchanged_sources }}"
            echo "- Data save errors: ${{ steps.data-save.outputs.save_errors }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload DB artifact
        uses: actions/upload-artifact@v6
        if: steps.db-save.outputs.changed == 'true' || steps.data-save.outputs.changed == 'true'
        with:
          name: workouts-db
          path: data/db/workouts.db
          retention-days: 1

      - name: Trigger gh-pages deploy
        if: steps.db-save.outputs.changed == 'true' || steps.data-save.outputs.changed == 'true'
        run: |
          gh workflow run gh-pages.yml --ref main \
            -f artifact-run-id=${{ github.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}
