name: Sync Workouts
on:
  schedule:
    # NOTE: */N not * — sed below matches /\d+ \* \* to update interval
    - cron: '0 2 */1 * *'
    - cron: '0 14 */1 * *'
  workflow_dispatch:

jobs:
  sync:
    # set RUNNER_LABEL=self-hosted → local runner
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure git
        id: git-setup
        env:
          WORKOUTS_SYNC_PAT: ${{ secrets.WORKOUTS_SYNC_PAT }}
        run: |
          if [ -z "$WORKOUTS_SYNC_PAT" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          git config user.name "workouts-bot"
          git config user.email "bot@workouts"
          git config --add http.https://github.com/.extraheader \
            "AUTHORIZATION: basic $(printf '%s:' "$WORKOUTS_SYNC_PAT" | base64 -w0)"
          echo "configured=true" >> $GITHUB_OUTPUT

      - uses: ruby/setup-ruby@v1
        if: vars.RUNNER_LABEL != 'self-hosted'
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - uses: actions/setup-python@v5
        if: vars.RUNNER_LABEL != 'self-hosted'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python deps (curl_cffi for Garmin auth Strategy A)
        if: vars.RUNNER_LABEL != 'self-hosted'
        run: pip install -r scripts/requirements.txt

      - name: Determine data store
        id: data-store
        run: echo "mode=${DATA_STORE:-actions-by-source}" >> $GITHUB_OUTPUT

      - name: Record DB digest
        id: db-before
        run: echo "digest=$(md5sum data/workouts.db 2>/dev/null | cut -d' ' -f1 || echo 'none')" >> $GITHUB_OUTPUT

      - name: Restore import marker
        id: import-cache-apple-health
        uses: actions/cache@v5.1.0
        with:
          path: data/import/apple_health/.imported
          key: imported-v1-apple-health

      - name: Import Apple Health
        if: steps.import-cache-apple-health.outputs.cache-hit != 'true' && steps.git-setup.outputs.configured == 'true'
        run: |
          mkdir -p data/import/apple_health
          git lfs install
          git ls-remote --exit-code origin refs/heads/_/import/apple_health >/dev/null 2>&1 || {
            echo "No _/import/apple_health branch yet — skipping" >&2
            exit 0
          }
          git fetch origin refs/heads/_/import/apple_health:refs/remotes/origin/_/import/apple_health
          git show origin/_/import/apple_health:data/import/apple_health/export.zip | git lfs smudge > data/import/apple_health/export.zip
          if [ ! -f data/import/apple_health/export.zip ]; then
            echo "No export.zip in branch — skipping" >&2
            exit 0
          fi
          file data/import/apple_health/export.zip | grep -qi "Zip archive" || {
            echo "export.zip is not a valid zip — possible LFS smudge failure" >&2
            exit 1
          }
          bundle exec exe/workouts import --source apple_health
          touch data/import/apple_health/.imported

      # ── Data restore (conditional on DATA_STORE) ──
      - uses: actions/cache/restore@v4
        if: steps.data-store.outputs.mode == 'actions-combined'
        with:
          path: |-
            data/raw/
            data/std/
            data/workouts.db
          key: workouts-data-v1-${{ github.run_id }}
          restore-keys: workouts-data-v1-

      - uses: ./.github/actions/sources-cache/restore
        if: steps.data-store.outputs.mode == 'actions-by-source'

      - uses: actions/cache/restore@v4
        id: db-cache
        if: steps.data-store.outputs.mode == 'actions-by-source'
        with:
          path: data/workouts.db
          key: workouts-db-v1-${{ hashFiles('db/migrations/*.rb') }}-${{ github.run_id }}
          restore-keys: workouts-db-v1-

      - name: Restore — git-combined
        if: steps.data-store.outputs.mode == 'git-combined'
        run: |
          if git ls-remote --exit-code origin refs/heads/data/_/_ >/dev/null 2>&1; then
            git fetch origin data/_/_
            mkdir -p data/raw data/std
            git archive --format=tar origin/data/_/_ \
              data/raw data/std data/workouts.db 2>/dev/null | tar xf - || true
          fi

      - name: Restore — git-by-source
        if: steps.data-store.outputs.mode == 'git-by-source'
        run: |
          for src in keep igpsport xoss xingzhe garmin garmin_cn strava; do
            B="_/_/$src"
            git ls-remote --exit-code origin "refs/heads/$B" >/dev/null 2>&1 || continue
            git fetch origin "$B"
            mkdir -p "data/raw/$src" "data/std/$src"
            git archive --format=tar "origin/$B" \
              "data/raw/$src" "data/std/$src" 2>/dev/null | tar xf - || true
          done
          if git ls-remote --exit-code origin refs/heads/_/workouts-db >/dev/null 2>&1; then
            git fetch origin _/workouts-db
            git archive --format=tar origin/_/workouts-db data/workouts.db 2>/dev/null | tar xf - || true
          fi

      - name: Restore — git-flat
        if: steps.data-store.outputs.mode == 'git-flat'
        run: |
          echo "git-flat: data already in checkout, no restore needed"

      - id: load-tokens-cache
        uses: ./.github/actions/tokens-cache/restore

      - name: Sync
        env:
          SYNC__KEEP__PHONE: ${{ secrets.SYNC_KEEP_PHONE }}
          SYNC__KEEP__PASSWORD: ${{ secrets.SYNC_KEEP_PASSWORD }}
          SYNC__IGPSPORT__PHONE: ${{ secrets.SYNC_IGPSPORT_PHONE }}
          SYNC__IGPSPORT__PASSWORD: ${{ secrets.SYNC_IGPSPORT_PASSWORD }}
          SYNC__XOSS__EMAIL: ${{ secrets.SYNC_XOSS_EMAIL }}
          SYNC__XOSS__PASSWORD: ${{ secrets.SYNC_XOSS_PASSWORD }}
          SYNC__XINGZHE__EMAIL: ${{ secrets.SYNC_XINGZHE_EMAIL }}
          SYNC__XINGZHE__PASSWORD: ${{ secrets.SYNC_XINGZHE_PASSWORD }}
          SYNC__GARMIN_CN__EMAIL: ${{ secrets.SYNC_GARMIN_CN_EMAIL }}
          SYNC__GARMIN_CN__PASSWORD: ${{ secrets.SYNC_GARMIN_CN_PASSWORD }}
          SYNC__GARMIN_CN__SECRET: ${{ secrets.SYNC_GARMIN_CN_SECRET }}
          SYNC__GARMIN__EMAIL: ${{ secrets.SYNC_GARMIN_EMAIL }}
          SYNC__GARMIN__PASSWORD: ${{ secrets.SYNC_GARMIN_PASSWORD }}
          SYNC__GARMIN__AUTH_SEED: ${{ secrets.SYNC_GARMIN_AUTH_SEED }}
          SYNC__STRAVA__CLIENT_ID: ${{ secrets.SYNC_STRAVA_CLIENT_ID }}
          SYNC__STRAVA__CLIENT_SECRET: ${{ secrets.SYNC_STRAVA_CLIENT_SECRET }}
          SYNC__STRAVA__REFRESH_TOKEN: ${{ secrets.SYNC_STRAVA_REFRESH_TOKEN }}
          SYNC__TIME_BUDGET: ${{ vars.SYNC_TIME_BUDGET || '' }}
          SYNC__TOTAL_TIMEOUT: ${{ vars.SYNC_TOTAL_TIMEOUT || '' }}
          MIGRATE__IGPSPORT_TO_GARMIN__LIMIT: ${{ vars.MIGRATE_IGPSPORT_TO_GARMIN_LIMIT || 10 }}
          MIGRATE__IGPSPORT_TO_GARMIN_CN__LIMIT: ${{ vars.MIGRATE_IGPSPORT_TO_GARMIN_CN_LIMIT || 10 }}
        run: bundle exec exe/workouts sync

      - uses: ./.github/actions/tokens-cache/save
        if: always() && steps.load-tokens-cache.outputs.restored == 'true'

      - name: Restore geo cache
        uses: actions/cache/restore@v4
        id: geo-cache
        with:
          path: |
            data/cache/geo-point.jsonl
          key: workouts-geo-v1-${{ hashFiles('db/migrations/*.rb') }}-${{ github.run_id }}
          restore-keys: workouts-geo-v1-

      - name: Geo region detection
        env:
          AMAP_API_KEY: ${{ secrets.AMAP_API_KEY }}
        run: |
          bash scripts/run_geo_detection.sh \
            200 20 proportional 300

      - id: cron
        run: echo "N=$(grep -oP '/\K\d+(?= \* \*)' .github/workflows/sync.yml | head -1)" >> $GITHUB_OUTPUT

      - name: Decide interval
        id: decide
        env:
          N: ${{ steps.cron.outputs.N || 3 }}
        run: |
          bundle exec ruby -e '
            n = ENV["N"].to_i
            db = "data/workouts.db"
            unless File.exist?(db)
              puts "new_n=#{n}"
              exit
            end
            require "sequel"
            row = Sequel.sqlite(db)[:activities].order(Sequel.desc(:start_date)).first
            unless row
              puts "new_n=#{n}"
              exit
            end
            f = ((Time.now - Time.parse(row[:start_date].to_s)) / 86400).round
            n -= 1 if f < n && n > 1
            n += 1 if f > 2 * n + 1 && n < 7
            puts "f=#{f}"
            puts "new_n=#{n}"
          ' >> $GITHUB_OUTPUT

      - name: Update cron interval
        if: github.event_name == 'schedule' && steps.git-setup.outputs.configured == 'true'
        id: update-cron
        env:
          NEW_N: ${{ steps.decide.outputs.new_n }}
        run: |
          CURRENT_N=$(grep -oP '/\K\d+(?= \* \*)' .github/workflows/sync.yml | head -1)
          if [ "$CURRENT_N" = "$NEW_N" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          sed -i "s|/\\([0-9]\\) \\* \\*|/${NEW_N} * *|" .github/workflows/sync.yml
          echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit cron change
        if: steps.update-cron.outputs.changed == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: sync interval N=${{ steps.decide.outputs.new_n }}"
          commit_user_name: workouts-bot
          commit_user_email: bot@workouts
          file_pattern: .github/workflows/sync.yml
          token: ${{ secrets.WORKOUTS_SYNC_PAT }}

      - name: Check DB changed
        id: db-changed
        run: |
          new=$(md5sum data/workouts.db 2>/dev/null | cut -d' ' -f1 || echo 'none')
          [ "${{ steps.db-before.outputs.digest }}" != "$new" ] && echo "changed=true" || echo "changed=false"
          echo "changed=$([ "${{ steps.db-before.outputs.digest }}" != "$new" ] && echo true || echo false)" >> $GITHUB_OUTPUT

      # ── Data save (conditional on DATA_STORE) ──
      - uses: actions/cache/save@v4
        if: steps.data-store.outputs.mode == 'actions-combined' && steps.db-changed.outputs.changed == 'true'
        with:
          path: |-
            data/raw/
            data/std/
            data/workouts.db
          key: workouts-data-v1-${{ github.run_id }}

      - uses: ./.github/actions/sources-cache/save
        if: steps.data-store.outputs.mode == 'actions-by-source'

      - uses: actions/cache/save@v4
        if: steps.data-store.outputs.mode == 'actions-by-source' && steps.db-changed.outputs.changed == 'true'
        with:
          path: data/workouts.db
          key: workouts-db-v1-${{ hashFiles('db/migrations/*.rb') }}-${{ github.run_id }}

      - name: Save — git-combined
        if: steps.data-store.outputs.mode == 'git-combined' && steps.git-setup.outputs.configured == 'true' && steps.db-changed.outputs.changed == 'true'
        run: bash scripts/data-store-git-save.sh data/_/_ "data/raw data/std data/workouts.db"

      - name: Save — git-by-source
        if: steps.data-store.outputs.mode == 'git-by-source' && steps.git-setup.outputs.configured == 'true' && steps.db-changed.outputs.changed == 'true'
        run: |
          for src in keep igpsport xoss xingzhe garmin garmin_cn strava; do
            bash scripts/data-store-git-save.sh "_/_/$src" "data/raw/$src data/std/$src"
          done
          bash scripts/data-store-git-save.sh _/workouts-db "data/workouts.db"

      - name: Save — git-flat
        if: steps.data-store.outputs.mode == 'git-flat' && steps.git-setup.outputs.configured == 'true' && steps.db-changed.outputs.changed == 'true'
        run: |
          git add -A
          git diff --cached --quiet && echo "No changes" && exit 0
          git -c user.name=workouts-bot -c user.email=bot@workouts \
            commit -m "store(sync): $(date -u +%Y%m%d-%H%M%S)"
          git pull --rebase
          git push

      - name: Save geo cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/cache/geo-point.jsonl
          key: ${{ steps.geo-cache.outputs.cache-primary-key }}

      - name: Upload DB artifact
        uses: actions/upload-artifact@v4
        if: steps.db-changed.outputs.changed == 'true'
        with:
          name: workouts-db
          path: data/workouts.db
          retention-days: 1

      - name: Trigger gh-pages deploy
        if: steps.db-changed.outputs.changed == 'true'
        run: |
          gh workflow run gh-pages.yml --ref main \
            -f artifact-run-id=${{ github.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}

