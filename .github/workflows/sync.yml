name: Sync Workouts
on:
  schedule:
    - cron: '0 2 */3 * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      db_changed: ${{ steps.db-changed.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - uses: actions/cache/restore@v4
        id: db-cache
        with:
          path: data/workouts.db
          key: workouts-db-v1-${{ hashFiles('db/migrations/*.rb') }}-${{ github.run_id }}
          restore-keys: workouts-db-v1-${{ hashFiles('db/migrations/*.rb') }}-

      - uses: actions/cache/restore@v4
        id: source-cache
        with:
          path: |
            data/raw/
            data/std/
          key: workouts-source-v1-${{ github.run_id }}
          restore-keys: workouts-source-v1-

      - name: Record DB digest
        id: db-before
        run: echo "digest=$(md5sum data/workouts.db 2>/dev/null | cut -d' ' -f1 || echo 'none')" >> $GITHUB_OUTPUT

      - name: Record source digest
        id: source-before
        run: |
          count=$(find data/raw/ data/std/ -type f 2>/dev/null | wc -l)
          echo "count=$count" >> $GITHUB_OUTPUT

      - name: Sync
        env:
          SYNC__KEEP__PHONE: ${{ secrets.SYNC_KEEP_PHONE }}
          SYNC__KEEP__PASSWORD: ${{ secrets.SYNC_KEEP_PASSWORD }}
          SYNC__IGPSPORT__PHONE: ${{ secrets.SYNC_IGPSPORT_PHONE }}
          SYNC__IGPSPORT__PASSWORD: ${{ secrets.SYNC_IGPSPORT_PASSWORD }}
          SYNC__XOSS__EMAIL: ${{ secrets.SYNC_XOSS_EMAIL }}
          SYNC__XOSS__PASSWORD: ${{ secrets.SYNC_XOSS_PASSWORD }}
          SYNC__XINGZHE__EMAIL: ${{ secrets.SYNC_XINGZHE_EMAIL }}
          SYNC__XINGZHE__PASSWORD: ${{ secrets.SYNC_XINGZHE_PASSWORD }}
          SYNC__GARMIN_CN__EMAIL: ${{ secrets.SYNC_GARMIN_CN_EMAIL }}
          SYNC__GARMIN_CN__PASSWORD: ${{ secrets.SYNC_GARMIN_CN_PASSWORD }}
          SYNC__GARMIN__EMAIL: ${{ secrets.SYNC_GARMIN_EMAIL }}
          SYNC__GARMIN__PASSWORD: ${{ secrets.SYNC_GARMIN_PASSWORD }}
          SYNC__GARMIN__SECRET: ${{ secrets.SYNC_GARMIN_SECRET }}
          SYNC__STRAVA__CLIENT_ID: ${{ secrets.SYNC_STRAVA_CLIENT_ID }}
          SYNC__STRAVA__CLIENT_SECRET: ${{ secrets.SYNC_STRAVA_CLIENT_SECRET }}
          SYNC__STRAVA__REFRESH_TOKEN: ${{ secrets.SYNC_STRAVA_REFRESH_TOKEN }}
          SYNC__TIME_BUDGET: ${{ vars.SYNC_TIME_BUDGET || '' }}
        run: bundle exec exe/workouts sync

      - id: cron
        run: echo "N=$(grep -oP '/\K\d+(?= \* \*)' .github/workflows/sync.yml)" >> $GITHUB_OUTPUT

      - name: Decide interval
        id: decide
        env:
          N: ${{ steps.cron.outputs.N || 3 }}
        run: |
          bundle exec ruby -e '
            n = ENV["N"].to_i
            db = "data/workouts.db"
            unless File.exist?(db)
              puts "new_n=#{n}"
              exit
            end
            require "sequel"
            row = Sequel.sqlite(db)[:activities].order(Sequel.desc(:start_date)).first
            unless row
              puts "new_n=#{n}"
              exit
            end
            f = ((Time.now - Time.parse(row[:start_date].to_s)) / 86400).round
            n -= 1 if f < n && n > 1
            n += 1 if f > 2 * n + 1 && n < 7
            puts "f=#{f}"
            puts "new_n=#{n}"
          ' >> $GITHUB_OUTPUT

      - name: Update cron (schedule only)
        if: github.event_name == 'schedule'
        env:
          NEW_N: ${{ steps.decide.outputs.new_n }}
        run: |
          sed -i "s|/\\([0-9]\\) \\* \\*|/${NEW_N} * *|" .github/workflows/sync.yml
          git config user.name "workouts-bot"
          git config user.email "bot@workouts"
          git add .github/workflows/sync.yml
          git diff --cached --quiet || \
            git commit -m "chore: sync interval N=$NEW_N"
          git pull --rebase
          git push

      - name: Check DB changed
        id: db-changed
        run: |
          new=$(md5sum data/workouts.db 2>/dev/null | cut -d' ' -f1 || echo 'none')
          [ "${{ steps.db-before.outputs.digest }}" != "$new" ] && echo "changed=true" || echo "changed=false"
          echo "changed=$([ "${{ steps.db-before.outputs.digest }}" != "$new" ] && echo true || echo false)" >> $GITHUB_OUTPUT

      - name: Check source changed
        id: source-changed
        run: |
          before=${{ steps.source-before.outputs.count }}
          after=$(find data/raw/ data/std/ -type f 2>/dev/null | wc -l)
          echo "changed=$([ "$before" != "$after" ] && echo true || echo false)" >> $GITHUB_OUTPUT

      - uses: actions/cache/save@v4
        if: steps.db-changed.outputs.changed == 'true'
        with:
          path: data/workouts.db
          key: ${{ steps.db-cache.outputs.cache-primary-key }}

      - uses: actions/cache/save@v4
        if: steps.source-changed.outputs.changed == 'true'
        with:
          path: |
            data/raw/
            data/std/
          key: ${{ steps.source-cache.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@v4
        if: steps.db-changed.outputs.changed == 'true'
        with:
          name: workouts-db
          path: data/workouts.db
          retention-days: 1

  build:
    needs: [sync]
    if: needs.sync.outputs.db_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - uses: actions/download-artifact@v4
        with:
          name: workouts-db
          path: data/

      - name: Create build directory
        run: mkdir -p build/svg

      - name: Export JSON
        run: bundle exec exe/workouts export json --output build/activities.json

      - name: Export SVG
        run: bundle exec exe/workouts export svg --style github --title "Workouts" --output build/svg/github.svg

      - name: Validate SVG
        run: |
          bundle exec ruby -e '
            require "nokogiri"
            Dir["build/svg/*.svg"].each do |f|
              doc = Nokogiri::XML(File.read(f))
              if doc.errors.any?
                puts "::error::#{f}: #{doc.errors.map(&:to_s).join(", ")}"
                exit 1
              end
              puts "OK #{f}"
            end
          '

      - name: Generate index.html
        run: |
          ruby -e '
          svg_content = File.read("build/svg/github.svg")
          types = {
            "run"  => { label: "Run",  color: "#4DD2FF" },
            "walk" => { label: "Walk", color: "#4ECDC4" },
            "ride" => { label: "Ride", color: "#FF6B6B" },
          }
          hide_rules = types.keys.map { |t|
            others = types.keys.reject { |o| o == t }
            "#s-#{t}:checked ~ .poster g:not(.s-#{t}) rect { fill: #444444 !important; }"
          }.join("\n          ")
          legend_items = types.map { |k, v|
            %(<label for="s-#{k}" style="background-color:#{v[:color]}">#{v[:label]}</label>)
          }.join("\n          ")
          html = <<~HTML
          <!DOCTYPE html>
          <html lang="zh-CN">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>Workouts</title>
            <style>
              body { background: #222; color: #fff; font-family: sans-serif; text-align: center; margin: 0; }
              a { color: #4DD2FF; }
              input[name="s"] { display: none; }
              .poster svg { max-width: 100%; height: auto; }
              .legend {
                position: fixed; z-index: 100;
                display: flex; gap: 0.5rem; padding: 0.5rem 0.75rem;
                background: rgba(34,34,34,0.9); border: 1px solid #555;
                top: 1rem; left: 50%; transform: translateX(-50%);
                border-radius: 2rem; box-shadow: 0 2px 12px rgba(0,0,0,0.3);
                opacity: 0.25; transition: opacity 0.3s ease, transform 0.3s ease;
              }
              .legend:hover, .legend:focus-within { opacity: 1; transform: translateX(-50%) translateY(0); }
              .legend label { cursor: pointer; padding: 0.25rem 0.75rem; border: 1px solid transparent; border-radius: 4px; color: #fff; background-color: #555; }
              .legend label:hover { border-color: #fff; }
              body { padding-top: 4rem; }
              @media (max-width: 767px) {
                .legend { top: auto; bottom: 0; left: 0; right: 0; transform: none; border-radius: 0;
                  border-bottom: none; border-left: none; border-right: none;
                  justify-content: center; gap: 1rem; padding: 0.75rem; flex-wrap: wrap;
                  opacity: 1; transition: none;
                }
                .poster { padding-bottom: 4rem; }
              }
              #{hide_rules}
              #{types.keys.map { |t| "#s-#{t}:checked ~ .legend label[for=\"s-#{t}\"], #s-all:checked ~ .legend label[for=\"s-all\"]" }.join(",\n              ")} { border-width: 2px; }
            </style>
          </head>
          <body>
            <h1>Workouts</h1>
            <input type="radio" name="s" id="s-all" checked>
            #{types.keys.map { |t| "<input type=\"radio\" name=\"s\" id=\"s-#{t}\">" }.join("\n            ")}
            <div class="legend">
              <label for="s-all">All</label>
              #{legend_items}
            </div>
            <div class="poster">
              #{svg_content}
            </div>
            <p><a href="activities.json">JSON 数据</a></p>
          </body>
          </html>
          HTML
          File.write("build/index.html", html)
          '

      - uses: actions/upload-artifact@v4
        with:
          name: pages-assets
          path: ./build

  deploy:
    needs: [build]
    if: success()
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pages-assets
          path: ./build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

      - id: deployment
        uses: actions/deploy-pages@v4
