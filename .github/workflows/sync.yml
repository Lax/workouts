name: Sync Workouts
on:
  schedule:
    # NOTE: */N not * — sed below matches /\d+ \* \* to update interval
    - cron: '0 2 */1 * *'
    - cron: '0 14 */1 * *'
  workflow_dispatch:

jobs:
  sync:
    concurrency:
      group: workouts-db
      cancel-in-progress: false
    # set RUNNER_LABEL=self-hosted → local runner
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Inspect PAT response headers
        shell: bash
        env:
          WORKOUTS_SYNC_PAT: ${{ secrets.WORKOUTS_SYNC_PAT }}
          GITHUB_API_URL: ${{ github.api_url }}
        run: |
          if [ -z "$WORKOUTS_SYNC_PAT" ]; then
            echo "::warning::WORKOUTS_SYNC_PAT not set — skipping header inspection" >&2
            exit 0
          fi

          API="${GITHUB_API_URL:-https://api.github.com}"
          AUTH="Authorization: Bearer ${WORKOUTS_SYNC_PAT}"

          echo "::group::Raw HTTP response headers (/rate_limit with PAT)" >&2
          curl -s -o /dev/null -D - \
            -H "$AUTH" \
            "${API}/rate_limit" >&2
          echo "::endgroup::" >&2

          echo "::group::Parsed header_json (curl machine-readable)" >&2
          curl -s -o /dev/null -w "%{header_json}" \
            -H "$AUTH" \
            "${API}/rate_limit" >&2
          echo "" >&2
          echo "::endgroup::" >&2

          RAW_HEADERS=$(curl -s -o /dev/null -w "%{header_json}" \
            -H "$AUTH" \
            "${API}/rate_limit")
          SCOPE=$(printf "%b\n" "$RAW_HEADERS" | grep -oi '"x-oauth-scopes":\[[^]]*\]' | head -1 || true)
          PERM=$(printf "%b\n" "$RAW_HEADERS" | grep -oi '"x-accepted-github-permissions":\[[^]]*\]' | head -1 || true)
          echo "x_oauth_scopes=${SCOPE:-not_present}" >> $GITHUB_OUTPUT
          echo "x_accepted_permissions=${PERM:-not_present}" >> $GITHUB_OUTPUT

      - name: Configure git
        id: git-setup
        env:
          WORKOUTS_SYNC_PAT: ${{ secrets.WORKOUTS_SYNC_PAT }}
        run: |
          if [ -z "$WORKOUTS_SYNC_PAT" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          git config user.name "workouts-bot"
          git config user.email "bot@workouts"
          git config --add http.https://github.com/.extraheader \
            "AUTHORIZATION: basic $(printf '%s:' "$WORKOUTS_SYNC_PAT" | base64 -w0)"
          echo "configured=true" >> $GITHUB_OUTPUT

      - uses: ruby/setup-ruby@v1
        if: vars.RUNNER_LABEL != 'self-hosted'
        with:
          ruby-version: '3.4'
          bundler-cache: true
        env:
          BUNDLE_GITHUB__COM: lax:${{ secrets.WORKOUTS_SYNC_PAT }}

      - uses: actions/setup-python@v5
        if: vars.RUNNER_LABEL != 'self-hosted'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        if: vars.RUNNER_LABEL != 'self-hosted'
        run: pip install -r scripts/requirements.txt

      - name: Detect commit mode
        id: mode
        run: |
          echo "shall_commit_db=${{ vars.GIT_FIT_SHALL_COMMIT_DB == 'true' && 'true' || 'false' }}" >> $GITHUB_OUTPUT
          echo "shall_commit_data=${{ vars.GIT_FIT_SHALL_COMMIT_DATA == 'true' && 'true' || 'false' }}" >> $GITHUB_OUTPUT

      # ── DB restore (git-fit db-store) ──
      - uses: ./.github/actions/db-store/restore
        id: db-restore
        with:
          path: data/workouts.db
          key-prefix: workouts-db
          shall-commit-db: ${{ steps.mode.outputs.shall_commit_db }}
          git-branch: _/workouts-db

      - name: Fallback DB restore from archive branch
        shell: bash
        run: |
          if [ ! -s data/workouts.db ]; then
            echo "Cache miss — falling back to archive branch"
            git fetch origin _/workouts-db
            if git archive --format=tar origin/_/workouts-db \
                 data/workouts.db data/workouts.db.SHA256SUMS 2>/dev/null | tar xf -; then
              echo "Restored DB from archive branch: $(stat -c%s data/workouts.db 2>/dev/null || echo 0) bytes"
            else
              echo "SHA256SUMS not in archive — restoring DB only"
              git archive --format=tar origin/_/workouts-db \
                 data/workouts.db 2>/dev/null | tar xf - || true
              if [ -f data/workouts.db ] && [ -s data/workouts.db ]; then
                echo "Restored DB from archive branch: $(stat -c%s data/workouts.db 2>/dev/null || echo 0) bytes"
              else
                echo "Archive branch restore failed — DB will be created fresh by sync"
              fi
            fi
          fi

      - name: Import Apple Health
        uses: ./.github/actions/import-apple-health
        with:
          git-configured: ${{ steps.git-setup.outputs.configured }}

      # ── Data restore (conditional on commit mode) ──
      - uses: ./.github/actions/data-store/restore
        with:
          shall-commit-db: ${{ steps.mode.outputs.shall_commit_db }}
          shall-commit-data: ${{ steps.mode.outputs.shall_commit_data }}

      - name: Sync activities
        uses: ./.github/actions/sync-activities
        with:
          sync-time-budget: ${{ vars.SYNC_TIME_BUDGET || '' }}
          sync-total-timeout: ${{ vars.SYNC_TOTAL_TIMEOUT || '' }}
          garmin-auth-seed: ${{ secrets.SYNC_GARMIN_AUTH_SEED }}
          garmin-cn-secret: ${{ secrets.SYNC_GARMIN_CN_SECRET }}
          xoss-email: ${{ secrets.SYNC_XOSS_EMAIL }}
          xoss-password: ${{ secrets.SYNC_XOSS_PASSWORD }}
          xingzhe-email: ${{ secrets.SYNC_XINGZHE_EMAIL }}
          xingzhe-password: ${{ secrets.SYNC_XINGZHE_PASSWORD }}
          keep-phone: ${{ secrets.SYNC_KEEP_PHONE }}
          keep-password: ${{ secrets.SYNC_KEEP_PASSWORD }}
          igpsport-phone: ${{ secrets.SYNC_IGPSPORT_PHONE }}
          igpsport-password: ${{ secrets.SYNC_IGPSPORT_PASSWORD }}
          strava-client-id: ${{ secrets.SYNC_STRAVA_CLIENT_ID }}
          strava-client-secret: ${{ secrets.SYNC_STRAVA_CLIENT_SECRET }}
          strava-refresh-token: ${{ secrets.SYNC_STRAVA_REFRESH_TOKEN }}

      - name: Parse Geo Regions
        uses: ./.github/actions/parse-geo-regions
        with:
          geo-cache-dir: data/cache
          amap-key: ${{ secrets.AMAP_API_KEY }}
          db-path: data/workouts.db
          detect-limit: 200
          detect-batch: 20
          detect-strategy: proportional
          detect-time: 300

      - name: Checkpoint SQLite WAL
        if: always()
        shell: bash
        run: |
          if [ -f data/workouts.db ]; then
            bundle exec ruby -e '
              require "sequel"
              db = Sequel.sqlite("data/workouts.db")
              db.run("PRAGMA wal_checkpoint(TRUNCATE)")
              puts "WAL checkpoint: #{File.size("data/workouts.db")} bytes"
            '
          fi

      - name: Manage sync cron
        uses: ./.github/actions/cron-manager
        with:
          git-configured: ${{ steps.git-setup.outputs.configured }}

      # ── DB save (git-fit db-store) ──
      - uses: ./.github/actions/db-store/save
        id: db-save
        with:
          path: data/workouts.db
          key-prefix: workouts-db
          shall-commit-db: ${{ steps.mode.outputs.shall_commit_db }}
          git-branch: _/workouts-db
          commit-author-name: workouts-bot
          commit-author-email: bot@workouts

      # ── Data save (per-source, conditional on commit mode) ──
      - uses: ./.github/actions/data-store/save
        id: data-save
        with:
          shall-commit-data: ${{ steps.mode.outputs.shall_commit_data }}
          git-configured: ${{ steps.git-setup.outputs.configured }}

      # ── Git add + unified commit (for commit mode) ──
      - name: Stage data sources
        if: steps.mode.outputs.shall_commit_data == 'true' && steps.data-save.outputs.any_changed == 'true'
        shell: bash
        run: |
          for src in keep igpsport xoss xingzhe garmin garmin_cn strava; do
            git add -f "data/raw/$src/" "data/std/$src/"
          done

      - name: Commit data changes
        if: steps.mode.outputs.shall_commit_data == 'true' && steps.data-save.outputs.any_changed == 'true'
        shell: bash
        run: |
          git diff --cached --quiet && exit 0
          git -c user.name=workouts-bot -c user.email=bot@workouts \
            commit -m "store(sync): $(date -u +%Y%m%d-%H%M%S)"
          git pull --rebase
          git push

      - name: Upload DB artifact
        uses: actions/upload-artifact@v4
        if: steps.db-save.outputs.db-changed == 'true' || steps.data-save.outputs.any_changed == 'true'
        with:
          name: workouts-db
          path: data/workouts.db
          retention-days: 1

      - name: Trigger gh-pages deploy
        if: steps.db-save.outputs.db-changed == 'true' || steps.data-save.outputs.any_changed == 'true'
        run: |
          gh workflow run gh-pages.yml --ref main \
            -f artifact-run-id=${{ github.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}
