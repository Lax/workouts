name: Sync Workouts
on:
  schedule:
    # NOTE: */N not * — sed below matches /\d+ \* \* to update interval
    - cron: '0 2 */1 * *'
    - cron: '0 14 */1 * *'
  workflow_dispatch:

jobs:
  sync:
    concurrency:
      group: workouts-db
      cancel-in-progress: false
    # set RUNNER_LABEL=self-hosted → local runner
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure git
        id: git-setup
        env:
          WORKOUTS_SYNC_PAT: ${{ secrets.WORKOUTS_SYNC_PAT }}
        run: |
          if [ -z "$WORKOUTS_SYNC_PAT" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          git config user.name "workouts-bot"
          git config user.email "bot@workouts"
          git config --add http.https://github.com/.extraheader \
            "AUTHORIZATION: basic $(printf '%s:' "$WORKOUTS_SYNC_PAT" | base64 -w0)"
          echo "configured=true" >> $GITHUB_OUTPUT

      - uses: ruby/setup-ruby@v1
        if: vars.RUNNER_LABEL != 'self-hosted'
        with:
          ruby-version: '3.4'
          bundler-cache: true
        env:
          BUNDLE_GITHUB__COM: lax:${{ secrets.WORKOUTS_SYNC_PAT }}

      - uses: actions/setup-python@v5
        if: vars.RUNNER_LABEL != 'self-hosted'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        if: vars.RUNNER_LABEL != 'self-hosted'
        run: pip install -r scripts/requirements.txt

      - name: Detect commit mode
        id: mode
        run: |
          echo "shall_commit_db=${{ vars.GIT_FIT_SHALL_COMMIT_DB == 'true' && 'true' || 'false' }}" >> $GITHUB_OUTPUT
          echo "shall_commit_data=${{ vars.GIT_FIT_SHALL_COMMIT_DATA == 'true' && 'true' || 'false' }}" >> $GITHUB_OUTPUT

      # ── DB restore (git-fit db-store) ──
      - uses: ./.github/actions/db-store/restore
        id: db-restore
        with:
          path: data/workouts.db
          key-prefix: workouts-db
          shall-commit-db: ${{ steps.mode.outputs.shall_commit_db }}
          git-branch: _/workouts-db

      - name: Fallback DB restore from archive branch
        shell: bash
        run: |
          if [ ! -s data/workouts.db ]; then
            echo "Cache miss — falling back to archive branch"
            git fetch origin _/workouts-db
            if git archive --format=tar origin/_/workouts-db \
                 data/workouts.db data/workouts.db.SHA256SUMS 2>/dev/null | tar xf -; then
              echo "Restored DB from archive branch: $(stat -c%s data/workouts.db 2>/dev/null || echo 0) bytes"
            else
              echo "SHA256SUMS not in archive — restoring DB only"
              git archive --format=tar origin/_/workouts-db \
                 data/workouts.db 2>/dev/null | tar xf - || true
              if [ -f data/workouts.db ] && [ -s data/workouts.db ]; then
                echo "Restored DB from archive branch: $(stat -c%s data/workouts.db 2>/dev/null || echo 0) bytes"
              else
                echo "Archive branch restore failed — DB will be created fresh by sync"
              fi
            fi
          fi

      - name: Diagnose DB after restore
        id: db-state-restore
        shell: bash
        run: |
          echo "=== DB state after restore ==="
          if [ ! -f data/workouts.db ] || [ ! -s data/workouts.db ]; then
            echo "db_missing=true"
            echo "db_size=0"
            echo "wal_size=0"
            echo "shm_size=0"
            echo "tables=none"
            echo "migration_type=none"
            echo "activity_count=0"
          else
            echo "db_size=$(stat -c%s data/workouts.db 2>/dev/null || echo 0)"
            echo "wal_size=$(stat -c%s data/workouts.db-wal 2>/dev/null || echo 0)"
            echo "shm_size=$(stat -c%s data/workouts.db-shm 2>/dev/null || echo 0)"
            bundle exec ruby -e '
              require "sequel"
              db = Sequel.sqlite("data/workouts.db")
              puts "tables=#{db.tables.sort.join(",")}"
              if db.table_exists?(:schema_migrations)
                puts "migration_type=schema_migrations"
                puts "migration_count=#{db[:schema_migrations].count}"
              elsif db.table_exists?(:schema_info)
                version = db[:schema_info].first[:version]
                puts "migration_type=schema_info"
                puts "migration_version=#{version}"
              else
                puts "migration_type=none"
              end
              puts "activity_count=#{db[:activities].count rescue 0}"
            '
          fi

      - name: Restore Apple Health cache
        id: import-cache-apple-health
        uses: actions/cache@v4
        with:
          path: |
            data/import/apple_health/SHA256SUMS
            data/import/apple_health/.imported-at
          key: imported-v2-apple-health

      - name: Check Apple Health export.zip change
        id: ah-check
        shell: bash
        run: |
          if ! git ls-remote --exit-code origin refs/heads/_/import/apple_health >/dev/null 2>&1; then
            echo "No apple_health branch — skip import" >&2
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "reason=no-branch" >> $GITHUB_OUTPUT
            exit 0
          fi

          git fetch origin refs/heads/_/import/apple_health

          export_sha=$(git log --format=%H -1 "origin/_/import/apple_health" -- data/import/apple_health/export.zip)
          if [ -z "$export_sha" ]; then
            echo "export.zip not found in branch — skip" >&2
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "reason=export-zip-missing" >> $GITHUB_OUTPUT
            exit 0
          fi

          export_date=$(git log --format=%ci -1 "origin/_/import/apple_health" -- data/import/apple_health/export.zip)
          export_subject=$(git log --format=%s -1 "origin/_/import/apple_health" -- data/import/apple_health/export.zip)

          cached=$(cat data/import/apple_health/.imported-at 2>/dev/null || echo "")
          if [ "$export_sha" = "$cached" ]; then
            echo "export.zip unchanged at ${export_sha:0:7} ($export_date) — skip" >&2
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "reason=unchanged" >> $GITHUB_OUTPUT
            echo "export_sha=${export_sha:0:7}" >> $GITHUB_OUTPUT
            echo "export_date=$export_date" >> $GITHUB_OUTPUT
            echo "export_subject=$export_subject" >> $GITHUB_OUTPUT
            exit 0
          fi

          if git show "origin/_/import/apple_health:data/import/apple_health/SHA256SUMS" > /tmp/apple-health.sha256 2>/dev/null; then
            if [ -f data/import/apple_health/SHA256SUMS ] && cmp -s /tmp/apple-health.sha256 data/import/apple_health/SHA256SUMS; then
              echo "SHA256 match — commit ID changed (${cached:0:7} → ${export_sha:0:7}) but content unchanged, skip" >&2
              echo "skip=true" >> $GITHUB_OUTPUT
              echo "reason=sha256-match" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi

          echo "skip=false" >> $GITHUB_OUTPUT
          if [ -z "$cached" ]; then
            echo "First import — ${export_sha:0:7} $export_subject ($export_date)" >&2
          else
            echo "export.zip changed — ${cached:0:7} → ${export_sha:0:7} ($export_date)" >&2
          fi

      - name: Import Apple Health
        if: steps.ah-check.outputs.skip == 'false' && steps.git-setup.outputs.configured == 'true'
        env:
          GIT_FIT_DATABASE_PATH: data/workouts.db
        run: |
          mkdir -p data/import/apple_health
          git lfs install
          git show "origin/_/import/apple_health:data/import/apple_health/export.zip" | git lfs smudge > data/import/apple_health/export.zip
          if [ ! -f data/import/apple_health/export.zip ]; then
            echo "No export.zip in branch — skipping" >&2
            exit 0
          fi
          file data/import/apple_health/export.zip | grep -qi "Zip archive" || {
            echo "export.zip is not a valid zip — possible LFS smudge failure" >&2
            exit 1
          }

          bundle exec git fit import apple_health

          bash scripts/generate-checksums.sh data/import/apple_health/export.zip

          bash scripts/data-store-git-save.sh "_/import/apple_health" \
            "data/import/apple_health/SHA256SUMS"

          git log --format=%H -1 "origin/_/import/apple_health" -- data/import/apple_health/export.zip \
            > data/import/apple_health/.imported-at

      # ── Data restore (conditional on commit mode) ──
      - uses: ./.github/actions/data-store/restore
        with:
          shall-commit-db: ${{ steps.mode.outputs.shall_commit_db }}
          shall-commit-data: ${{ steps.mode.outputs.shall_commit_data }}

      - id: load-tokens-cache
        uses: ./.github/actions/tokens-cache/restore

      - name: Sync activities - git fit sync
        env:
          GIT_FIT_SYNC_TIME_BUDGET: ${{ vars.SYNC_TIME_BUDGET || '' }}
          GIT_FIT_SYNC_TOTAL_TIMEOUT: ${{ vars.SYNC_TOTAL_TIMEOUT || '' }}
          GIT_FIT_GARMIN_AUTH_SEED: ${{ secrets.SYNC_GARMIN_AUTH_SEED }}
          GIT_FIT_GARMIN_TOKEN_PATH: data/auth/garmin_garmin_com_tokens.json
          GIT_FIT_GARMIN_CN_TOKEN_PATH: data/auth/garmin_garmin_cn_tokens.json
          GIT_FIT_GARMIN_CN_SECRET: ${{ secrets.SYNC_GARMIN_CN_SECRET }}
          GIT_FIT_XOSS_EMAIL: ${{ secrets.SYNC_XOSS_EMAIL }}
          GIT_FIT_XOSS_PASSWORD: ${{ secrets.SYNC_XOSS_PASSWORD }}
          GIT_FIT_XOSS_TOKEN_PATH: data/auth/xoss_tokens.json
          GIT_FIT_XINGZHE_EMAIL: ${{ secrets.SYNC_XINGZHE_EMAIL }}
          GIT_FIT_XINGZHE_PASSWORD: ${{ secrets.SYNC_XINGZHE_PASSWORD }}
          GIT_FIT_KEEP_PHONE: ${{ secrets.SYNC_KEEP_PHONE }}
          GIT_FIT_KEEP_PASSWORD: ${{ secrets.SYNC_KEEP_PASSWORD }}
          GIT_FIT_IGPSPORT_PHONE: ${{ secrets.SYNC_IGPSPORT_PHONE }}
          GIT_FIT_IGPSPORT_PASSWORD: ${{ secrets.SYNC_IGPSPORT_PASSWORD }}
          GIT_FIT_STRAVA_CLIENT_ID: ${{ secrets.SYNC_STRAVA_CLIENT_ID }}
          GIT_FIT_STRAVA_CLIENT_SECRET: ${{ secrets.SYNC_STRAVA_CLIENT_SECRET }}
          GIT_FIT_STRAVA_REFRESH_TOKEN: ${{ secrets.SYNC_STRAVA_REFRESH_TOKEN }}
          GIT_FIT_DATABASE_PATH: data/workouts.db
        run: bundle exec git fit sync

      - name: Diagnose DB after sync
        id: db-state-sync
        shell: bash
        run: |
          echo "=== DB state after sync ==="
          if [ ! -f data/workouts.db ] || [ ! -s data/workouts.db ]; then
            echo "db_missing=true"
            echo "db_size=0"
            echo "wal_size=0"
            echo "shm_size=0"
            echo "tables=none"
            echo "migration_type=none"
            echo "activity_count=0"
          else
            echo "db_size=$(stat -c%s data/workouts.db 2>/dev/null || echo 0)"
            echo "wal_size=$(stat -c%s data/workouts.db-wal 2>/dev/null || echo 0)"
            echo "shm_size=$(stat -c%s data/workouts.db-shm 2>/dev/null || echo 0)"
            bundle exec ruby -e '
              require "sequel"
              db = Sequel.sqlite("data/workouts.db")
              puts "tables=#{db.tables.sort.join(",")}"
              if db.table_exists?(:schema_migrations)
                puts "migration_type=schema_migrations"
                puts "migration_count=#{db[:schema_migrations].count}"
              elsif db.table_exists?(:schema_info)
                version = db[:schema_info].first[:version]
                puts "migration_type=schema_info"
                puts "migration_version=#{version}"
              else
                puts "migration_type=none"
              end
              puts "activity_count=#{db[:activities].count rescue 0}"
            '
          fi

      - name: Checkpoint SQLite WAL
        if: always()
        shell: bash
        run: |
          if [ -f data/workouts.db ]; then
            bundle exec ruby -e '
              require "sequel"
              db = Sequel.sqlite("data/workouts.db")
              db.run("PRAGMA wal_checkpoint(TRUNCATE)")
              puts "WAL checkpoint: #{File.size("data/workouts.db")} bytes"
            '
          fi

      - uses: ./.github/actions/tokens-cache/save
        if: always()

      - uses: actions/cache@v4
        id: geo-point-cache
        with:
          path: |
            data/cache/geo-point.jsonl
            data/cache/geo-point.jsonl.SHA256SUMS
          key: workouts-geo-v2-cache

      - name: Restore geo cache
        uses: actions/cache/restore@v4
        id: geo-cache
        with:
          path: |
            data/cache/geo-point.jsonl
          key: workouts-geo-v1-${{ hashFiles('db/migrations/*.rb') }}-${{ github.run_id }}
          restore-keys: workouts-geo-v1-

      - name: Geo region detection
        env:
          AMAP_API_KEY: ${{ secrets.AMAP_API_KEY }}
          GIT_FIT_DATABASE_PATH: data/workouts.db
        run: |
          bundle exec git fit geo detect \
            --limit 200 --batch 20 --strategy proportional --time 300

      - name: Diagnose DB after geo
        id: db-state-geo
        shell: bash
        run: |
          echo "=== DB state after geo ==="
          if [ ! -f data/workouts.db ] || [ ! -s data/workouts.db ]; then
            echo "db_missing=true"
            echo "db_size=0"
            echo "wal_size=0"
            echo "shm_size=0"
            echo "tables=none"
            echo "migration_type=none"
            echo "activity_count=0"
            echo "divisions_filled=0"
          else
            echo "db_size=$(stat -c%s data/workouts.db 2>/dev/null || echo 0)"
            echo "wal_size=$(stat -c%s data/workouts.db-wal 2>/dev/null || echo 0)"
            echo "shm_size=$(stat -c%s data/workouts.db-shm 2>/dev/null || echo 0)"
            bundle exec ruby -e '
              require "sequel"
              db = Sequel.sqlite("data/workouts.db")
              puts "tables=#{db.tables.sort.join(",")}"
              if db.table_exists?(:schema_migrations)
                puts "migration_type=schema_migrations"
                puts "migration_count=#{db[:schema_migrations].count}"
              elsif db.table_exists?(:schema_info)
                version = db[:schema_info].first[:version]
                puts "migration_type=schema_info"
                puts "migration_version=#{version}"
              else
                puts "migration_type=none"
              end
              puts "activity_count=#{db[:activities].count rescue 0}"
              puts "divisions_filled=#{db[:activities].where{divisions IS NOT NULL}.count rescue 0}"
            '
          fi

      - id: cron
        run: echo "N=$(grep -oP '/\K\d+(?= \* \*)' .github/workflows/sync.yml | head -1)" >> $GITHUB_OUTPUT

      - name: Compute sync interval
        id: decide
        env:
          N: ${{ steps.cron.outputs.N || 3 }}
        run: |
          bundle exec ruby -e '
            n = ENV["N"].to_i
            db = "data/workouts.db"
            unless File.exist?(db)
              puts "new_n=#{n}"
              exit
            end
            require "sequel"
            row = Sequel.sqlite(db)[:activities].order(Sequel.desc(:start_date)).first
            unless row
              puts "new_n=#{n}"
              exit
            end
            f = ((Time.now - Time.parse(row[:start_date].to_s)) / 86400).round
            n -= 1 if f < n && n > 1
            n += 1 if f > 2 * n + 1 && n < 7
            puts "f=#{f}"
            puts "new_n=#{n}"
          ' >> $GITHUB_OUTPUT

      - name: Update sync cron
        if: github.event_name == 'schedule' && steps.git-setup.outputs.configured == 'true'
        id: update-cron
        env:
          NEW_N: ${{ steps.decide.outputs.new_n }}
        run: |
          CURRENT_N=$(grep -oP '/\K\d+(?= \* \*)' .github/workflows/sync.yml | head -1)
          if [ "$CURRENT_N" = "$NEW_N" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          sed -i "s|/\\([0-9]\\) \\* \\*|/${NEW_N} * *|" .github/workflows/sync.yml
          echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit cron change
        if: steps.update-cron.outputs.changed == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: sync interval N=${{ steps.decide.outputs.new_n }}"
          commit_user_name: workouts-bot
          commit_user_email: bot@workouts
          file_pattern: .github/workflows/sync.yml
          token: ${{ secrets.WORKOUTS_SYNC_PAT }}

      # ── DB save (git-fit db-store) ──
      - name: Diagnose DB before save
        id: db-state-before-save
        shell: bash
        run: |
          echo "=== DB state before save ==="
          if [ ! -f data/workouts.db ] || [ ! -s data/workouts.db ]; then
            echo "db_missing=true"
            echo "db_size=0"
            echo "wal_size=0"
            echo "shm_size=0"
            echo "tables=none"
            echo "migration_type=none"
            echo "activity_count=0"
            echo "activity_columns=none"
            echo "missing_columns=none"
            echo "has_dedup_tables=false"
          else
            echo "db_size=$(stat -c%s data/workouts.db 2>/dev/null || echo 0)"
            echo "wal_size=$(stat -c%s data/workouts.db-wal 2>/dev/null || echo 0)"
            echo "shm_size=$(stat -c%s data/workouts.db-shm 2>/dev/null || echo 0)"
            bundle exec ruby -e '
              require "sequel"
              db = Sequel.sqlite("data/workouts.db")
              puts "tables=#{db.tables.sort.join(",")}"
              if db.table_exists?(:schema_migrations)
                puts "migration_type=schema_migrations"
                puts "migration_count=#{db[:schema_migrations].count}"
              elsif db.table_exists?(:schema_info)
                version = db[:schema_info].first[:version]
                puts "migration_type=schema_info"
                puts "migration_version=#{version}"
              else
                puts "migration_type=none"
              end
              puts "activity_count=#{db[:activities].count rescue 0}"
              cols = db[:activities].columns rescue []
              expected = [:run_id, :distance, :moving_time, :sport_category, :start_date,
                          :duplicate_info, :divisions, :title, :external_id]
              missing = expected - cols
              puts "activity_columns=#{cols.join(",")}"
              puts "missing_columns=#{missing.join(",")}"
              puts "has_dedup_tables=#{db.tables.include?(:dedup_groups) && db.tables.include?(:dedup_group_members)}"
            '
          fi

      - uses: ./.github/actions/db-store/save
        id: db-save
        with:
          path: data/workouts.db
          key-prefix: workouts-db
          shall-commit-db: ${{ steps.mode.outputs.shall_commit_db }}
          git-branch: _/workouts-db
          commit-author-name: workouts-bot
          commit-author-email: bot@workouts

      # ── Data save (per-source, conditional on commit mode) ──
      - uses: ./.github/actions/data-store/save
        id: data-save
        with:
          shall-commit-data: ${{ steps.mode.outputs.shall_commit_data }}
          git-configured: ${{ steps.git-setup.outputs.configured }}

      # ── Git add + unified commit (for commit mode) ──
      - name: Stage data sources
        if: steps.mode.outputs.shall_commit_data == 'true' && steps.data-save.outputs.any_changed == 'true'
        shell: bash
        run: |
          for src in keep igpsport xoss xingzhe garmin garmin_cn strava; do
            git add -f "data/raw/$src/" "data/std/$src/"
          done

      - name: Commit data changes
        if: steps.mode.outputs.shall_commit_data == 'true' && steps.data-save.outputs.any_changed == 'true'
        shell: bash
        run: |
          git diff --cached --quiet && exit 0
          git -c user.name=workouts-bot -c user.email=bot@workouts \
            commit -m "store(sync): $(date -u +%Y%m%d-%H%M%S)"
          git pull --rebase
          git push

      - name: Generate geo cache SHA256SUMS
        if: always()
        shell: bash
        run: |
          if [ -f data/cache/geo-point.jsonl ]; then
            sha256sum data/cache/geo-point.jsonl > data/cache/geo-point.jsonl.SHA256SUMS
          fi

      - name: Save geo cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/cache/geo-point.jsonl
          key: ${{ steps.geo-cache.outputs.cache-primary-key }}

      - name: Upload DB artifact
        uses: actions/upload-artifact@v4
        if: steps.db-save.outputs.db-changed == 'true' || steps.data-save.outputs.any_changed == 'true'
        with:
          name: workouts-db
          path: data/workouts.db
          retention-days: 1

      - name: Trigger gh-pages deploy
        if: steps.db-save.outputs.db-changed == 'true' || steps.data-save.outputs.any_changed == 'true'
        run: |
          gh workflow run gh-pages.yml --ref main \
            -f artifact-run-id=${{ github.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}
