name: Sync Workouts
on:
  schedule:
    # NOTE: */N not * — sed below matches /\d+ \* \* to update interval
    - cron: '0 2 */7 * *'
    - cron: '0 14 */7 * *'
  workflow_dispatch:

jobs:
  sync:
    concurrency:
      group: workouts-db
      cancel-in-progress: false
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    # 账单保险丝：纯数据管道（AI 导出已拆至 ai-insights.yml），正常全程 ~2min
    # （2026-10 实测），geo-detect 5min 总预算 + 余量 → 30min；
    # 2026-11 AI export 挂死烧穿 spending limit 教训见 git-fit#98
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write
    env:
      GIT_FIT_DATABASE_PATH: ${{ vars.GIT_FIT_DATABASE_PATH || 'data/db/workouts.db' }}
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      # ── DB paths ──
      # 单一真值 GIT_FIT_DATABASE_PATH → dir/name/db-path，供 db-store、git-fit、
      # checkpoint、artifact、summary 统一引用。
      - name: '[db] Derive database paths'
        id: db-paths
        uses: git-fit-actions/db-store/paths@v1
        with:
          database-path: ${{ env.GIT_FIT_DATABASE_PATH }}

      # ── DB restore (git-fit db-store) ──
      # cache miss 时从 GitFit/db 分支兜底恢复（fallback 模式），恢复成功会经 save-to-git-branch
      # 输出建议 save 侧把 DB push 回该分支。
      - name: '[db] Restore cache'
        id: db-restore
        uses: git-fit-actions/db-store/cache/restore@v1
        with:
          db-dir: ${{ steps.db-paths.outputs.dir }}
          db-name: ${{ steps.db-paths.outputs.name }}
          git-restore-mode: fallback
          git-branch: GitFit/db

      - name: Import data (Apple Health + 2bulu)
        uses: git-fit-actions/import@v1
        with:
          sources: apple_health,2bulu

      # ── Data restore ──
      - uses: git-fit-actions/data-store/cache/restore@v2
        with:
          sources: keep,igpsport,xoss,xingzhe,garmin,garmin_cn,strava,codoon,joyrun

      - name: Sync activities
        uses: ./.github/actions/sync-activities
        with:
          sync-time-budget: ${{ vars.SYNC_TIME_BUDGET || '' }}
          sync-total-timeout: ${{ vars.SYNC_TOTAL_TIMEOUT || '' }}
          garmin-auth-seed: ${{ secrets.SYNC_GARMIN_AUTH_SEED }}
          garmin-cn-secret: ${{ secrets.SYNC_GARMIN_CN_SECRET }}
          xoss-email: ${{ secrets.SYNC_XOSS_EMAIL }}
          xoss-password: ${{ secrets.SYNC_XOSS_PASSWORD }}
          xingzhe-email: ${{ secrets.SYNC_XINGZHE_EMAIL }}
          xingzhe-password: ${{ secrets.SYNC_XINGZHE_PASSWORD }}
          keep-phone: ${{ secrets.SYNC_KEEP_PHONE }}
          keep-password: ${{ secrets.SYNC_KEEP_PASSWORD }}
          igpsport-phone: ${{ secrets.SYNC_IGPSPORT_PHONE }}
          igpsport-password: ${{ secrets.SYNC_IGPSPORT_PASSWORD }}
          strava-client-id: ${{ secrets.SYNC_STRAVA_CLIENT_ID }}
          strava-client-secret: ${{ secrets.SYNC_STRAVA_CLIENT_SECRET }}
          strava-refresh-token: ${{ secrets.SYNC_STRAVA_REFRESH_TOKEN }}
          strava-web-auth-seed: ${{ secrets.SYNC_STRAVA_WEB_AUTH_SEED }}
          codoon-phone: ${{ secrets.SYNC_CODOON_PHONE }}
          codoon-password: ${{ secrets.SYNC_CODOON_PASSWORD }}
          joyrun-uid: ${{ secrets.SYNC_JOYRUN_UID }}
          joyrun-sid: ${{ secrets.SYNC_JOYRUN_SID }}
          timezone: ${{ vars.GIT_FIT_SYSTEM_TIMEZONE || 'Asia/Shanghai' }}
          db-path: ${{ steps.db-paths.outputs.db-path }}

      - id: data-save
        if: always()
        uses: git-fit-actions/data-store/cache/save@v2
        with:
          sources: keep,igpsport,xoss,xingzhe,garmin,garmin_cn,strava,codoon,joyrun

      - name: Parse Geo Regions
        uses: git-fit-actions/geo-detect@v1
        with:
          cache-dir: data/cache
          amap-key: ${{ secrets.AMAP_API_KEY }}
          db-path: ${{ steps.db-paths.outputs.db-path }}
          detect-limit: 200
          detect-batch: 20
          detect-strategy: proportional
          detect-time: 300

      - name: '[db] Checkpoint SQLite WAL'
        id: db-checkpoint
        if: always()
        shell: bash
        env:
          DB_PATH: ${{ steps.db-paths.outputs.db-path }}
        run: |
          if [ -f "$DB_PATH" ]; then
            bytes=$(bundle exec ruby -e '
              require "sequel"
              db = Sequel.sqlite(ENV.fetch("DB_PATH"))
              db.run("PRAGMA wal_checkpoint(TRUNCATE)")
              print File.size(ENV.fetch("DB_PATH"))
            ')
            echo "db_size=$bytes" >> $GITHUB_OUTPUT
            echo "WAL checkpoint: $bytes bytes"
          fi

      # ── DB save (git-fit db-store) ──
      # git-save-gate: 仅 job 成功时透传 restore 的 save-to-git-branch 建议，失败时 save 侧不 push。
      - name: '[db] Gate git save on job success'
        id: git-save-gate
        if: success()
        shell: bash
        run: echo "save-to-git-branch=${{ steps.db-restore.outputs.save-to-git-branch }}" >> "$GITHUB_OUTPUT"

      - name: '[db] Save cache'
        id: db-save
        if: always()
        uses: git-fit-actions/db-store/cache/save@v1
        with:
          db-dir: ${{ steps.db-paths.outputs.dir }}
          db-name: ${{ steps.db-paths.outputs.name }}
          save-to-git-branch: ${{ steps.git-save-gate.outputs.save-to-git-branch || 'false' }}

      - name: Trigger sync scheduler
        if: steps.db-save.outputs.changed == 'true' || steps.data-save.outputs.changed == 'true'
        run: |
          gh workflow run sync-scheduler.yml --ref master -f commit=true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload DB artifact
        uses: actions/upload-artifact@v7
        if: steps.db-save.outputs.changed == 'true' || steps.data-save.outputs.changed == 'true'
        with:
          name: workouts-db
          path: ${{ steps.db-paths.outputs.db-path }}
          retention-days: 1

      - name: Trigger gh-pages deploy
        if: steps.db-save.outputs.changed == 'true' || steps.data-save.outputs.changed == 'true'
        run: |
          gh workflow run gh-pages.yml --ref master \
            -f artifact-run-id=${{ github.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}

      # AI 导出独立于本 workflow（失败不影响数据同步与发布）；与 gh-pages 并行消费
      # 同一 DB artifact，新鲜度一致。export 失败仅本 workflow 红，旧 insights 保留。
      - name: Trigger AI insights export
        if: steps.db-save.outputs.changed == 'true' || steps.data-save.outputs.changed == 'true'
        run: |
          gh workflow run ai-insights.yml --ref master \
            -f artifact-run-id=${{ github.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}
