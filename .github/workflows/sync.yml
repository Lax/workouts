name: Sync Workouts
on:
  schedule:
    # NOTE: */N not * — sed below matches /\d+ \* \* to update interval
    - cron: '0 2 */1 * *'
    - cron: '0 14 */1 * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: self-hosted
    permissions:
      contents: write
    outputs:
      db_changed: ${{ steps.db-changed.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@v1
        if: runner.name == 'GitHub Actions'
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - uses: actions/setup-python@v5
        if: runner.name == 'GitHub Actions'
        with:
          python-version: '3.12'

      - name: Install Python deps (curl_cffi for Strategy A)
        if: runner.name == 'GitHub Actions'
        run: pip install curl_cffi

      - uses: actions/cache/restore@v4
        id: db-cache
        with:
          path: data/workouts.db
          key: workouts-db-v1-${{ hashFiles('db/migrations/*.rb') }}-${{ github.run_id }}
          restore-keys: workouts-db-v1-${{ hashFiles('db/migrations/*.rb') }}-

      - name: Record DB digest
        id: db-before
        run: echo "digest=$(md5sum data/workouts.db 2>/dev/null | cut -d' ' -f1 || echo 'none')" >> $GITHUB_OUTPUT

      - uses: actions/cache/restore@v4
        id: garmin-cn-tokens-cache
        with:
          path: data/cache/garmin_garmin_cn_tokens.json
          key: garmin-tokens-v1-garmin_cn-${{ github.run_id }}
          restore-keys: garmin-tokens-v1-garmin_cn-

      - uses: actions/cache/restore@v4
        id: garmin-tokens-cache
        with:
          path: data/cache/garmin_garmin_com_tokens.json
          key: garmin-tokens-v1-garmin-${{ github.run_id }}
          restore-keys: garmin-tokens-v1-garmin-

      - id: cache-keep
        uses: ./.github/actions/source-cache
        with:
          source: keep
          phase: restore

      - id: cache-igpsport
        uses: ./.github/actions/source-cache
        with:
          source: igpsport
          phase: restore

      - id: cache-xoss
        uses: ./.github/actions/source-cache
        with:
          source: xoss
          phase: restore

      - id: cache-xingzhe
        uses: ./.github/actions/source-cache
        with:
          source: xingzhe
          phase: restore

      - id: cache-garmin
        uses: ./.github/actions/source-cache
        with:
          source: garmin
          phase: restore

      - id: cache-garmin-cn
        uses: ./.github/actions/source-cache
        with:
          source: garmin_cn
          phase: restore

      - id: cache-strava
        uses: ./.github/actions/source-cache
        with:
          source: strava
          phase: restore

      - name: Sync
        env:
          SYNC__KEEP__PHONE: ${{ secrets.SYNC_KEEP_PHONE }}
          SYNC__KEEP__PASSWORD: ${{ secrets.SYNC_KEEP_PASSWORD }}
          SYNC__IGPSPORT__PHONE: ${{ secrets.SYNC_IGPSPORT_PHONE }}
          SYNC__IGPSPORT__PASSWORD: ${{ secrets.SYNC_IGPSPORT_PASSWORD }}
          SYNC__XOSS__EMAIL: ${{ secrets.SYNC_XOSS_EMAIL }}
          SYNC__XOSS__PASSWORD: ${{ secrets.SYNC_XOSS_PASSWORD }}
          SYNC__XINGZHE__EMAIL: ${{ secrets.SYNC_XINGZHE_EMAIL }}
          SYNC__XINGZHE__PASSWORD: ${{ secrets.SYNC_XINGZHE_PASSWORD }}
          SYNC__GARMIN_CN__EMAIL: ${{ secrets.SYNC_GARMIN_CN_EMAIL }}
          SYNC__GARMIN_CN__PASSWORD: ${{ secrets.SYNC_GARMIN_CN_PASSWORD }}
          SYNC__GARMIN_CN__SECRET: ${{ secrets.SYNC_GARMIN_CN_SECRET }}
          SYNC__GARMIN__EMAIL: ${{ secrets.SYNC_GARMIN_EMAIL }}
          SYNC__GARMIN__PASSWORD: ${{ secrets.SYNC_GARMIN_PASSWORD }}
          SYNC__GARMIN__AUTH_SEED: ${{ secrets.SYNC_GARMIN_AUTH_SEED }}
          SYNC__STRAVA__CLIENT_ID: ${{ secrets.SYNC_STRAVA_CLIENT_ID }}
          SYNC__STRAVA__CLIENT_SECRET: ${{ secrets.SYNC_STRAVA_CLIENT_SECRET }}
          SYNC__STRAVA__REFRESH_TOKEN: ${{ secrets.SYNC_STRAVA_REFRESH_TOKEN }}
          SYNC__TIME_BUDGET: ${{ vars.SYNC_TIME_BUDGET || '' }}
          MIGRATE__IGPSPORT_TO_GARMIN__LIMIT: ${{ vars.MIGRATE_IGPSPORT_TO_GARMIN_LIMIT || 10 }}
          MIGRATE__IGPSPORT_TO_GARMIN_CN__LIMIT: ${{ vars.MIGRATE_IGPSPORT_TO_GARMIN_CN_LIMIT || 10 }}
        run: bundle exec exe/workouts sync

      - id: cron
        run: echo "N=$(grep -oP '/\K\d+(?= \* \*)' .github/workflows/sync.yml | head -1)" >> $GITHUB_OUTPUT

      - name: Decide interval
        id: decide
        env:
          N: ${{ steps.cron.outputs.N || 3 }}
        run: |
          bundle exec ruby -e '
            n = ENV["N"].to_i
            db = "data/workouts.db"
            unless File.exist?(db)
              puts "new_n=#{n}"
              exit
            end
            require "sequel"
            row = Sequel.sqlite(db)[:activities].order(Sequel.desc(:start_date)).first
            unless row
              puts "new_n=#{n}"
              exit
            end
            f = ((Time.now - Time.parse(row[:start_date].to_s)) / 86400).round
            n -= 1 if f < n && n > 1
            n += 1 if f > 2 * n + 1 && n < 7
            puts "f=#{f}"
            puts "new_n=#{n}"
          ' >> $GITHUB_OUTPUT

      - name: Update cron (schedule only)
        if: github.event_name == 'schedule'
        env:
          NEW_N: ${{ steps.decide.outputs.new_n }}
          WORKOUTS_SYNC_PAT: ${{ secrets.WORKOUTS_SYNC_PAT }}
        run: |
          sed -i "s|/\\([0-9]\\) \\* \\*|/${NEW_N} * *|" .github/workflows/sync.yml
          git config user.name "workouts-bot"
          git config user.email "bot@workouts"
          # sed matches /{N} * * on both cron lines (same N, updates both)
          # persist-credentials: false → no extraheader written.
          # Write bare PAT extraheader (no x-access-token: prefix)
          # so server routes as PAT, not GitHub App.
          git config --add http.https://github.com/.extraheader \
            "AUTHORIZATION: basic $(printf '%s:' "$WORKOUTS_SYNC_PAT" | base64 -w0)"
          git add .github/workflows/sync.yml
          git diff --cached --quiet || \
            git commit -m "chore: sync interval N=$NEW_N"
          git pull --rebase
          git push

      - name: Check DB changed
        id: db-changed
        run: |
          new=$(md5sum data/workouts.db 2>/dev/null | cut -d' ' -f1 || echo 'none')
          [ "${{ steps.db-before.outputs.digest }}" != "$new" ] && echo "changed=true" || echo "changed=false"
          echo "changed=$([ "${{ steps.db-before.outputs.digest }}" != "$new" ] && echo true || echo false)" >> $GITHUB_OUTPUT

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data/cache/garmin_garmin_cn_tokens.json
          key: ${{ steps.garmin-cn-tokens-cache.outputs.cache-primary-key }}

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data/cache/garmin_garmin_com_tokens.json
          key: ${{ steps.garmin-tokens-cache.outputs.cache-primary-key }}

      - uses: actions/cache/save@v4
        if: steps.db-changed.outputs.changed == 'true'
        with:
          path: data/workouts.db
          key: ${{ steps.db-cache.outputs.cache-primary-key }}

      - uses: ./.github/actions/source-cache
        with:
          source: keep
          phase: save
          before_digest: ${{ steps.cache-keep.outputs.before_digest }}

      - uses: ./.github/actions/source-cache
        with:
          source: igpsport
          phase: save
          before_digest: ${{ steps.cache-igpsport.outputs.before_digest }}

      - uses: ./.github/actions/source-cache
        with:
          source: xoss
          phase: save
          before_digest: ${{ steps.cache-xoss.outputs.before_digest }}

      - uses: ./.github/actions/source-cache
        with:
          source: xingzhe
          phase: save
          before_digest: ${{ steps.cache-xingzhe.outputs.before_digest }}

      - uses: ./.github/actions/source-cache
        with:
          source: garmin
          phase: save
          before_digest: ${{ steps.cache-garmin.outputs.before_digest }}

      - uses: ./.github/actions/source-cache
        with:
          source: garmin_cn
          phase: save
          before_digest: ${{ steps.cache-garmin-cn.outputs.before_digest }}

      - uses: ./.github/actions/source-cache
        with:
          source: strava
          phase: save
          before_digest: ${{ steps.cache-strava.outputs.before_digest }}

      - uses: actions/upload-artifact@v4
        if: steps.db-changed.outputs.changed == 'true'
        with:
          name: workouts-db
          path: data/workouts.db
          retention-days: 1

  build:
    needs: [sync]
    if: needs.sync.outputs.db_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - uses: actions/download-artifact@v4
        with:
          name: workouts-db
          path: data/

      - name: Create build directory
        run: mkdir -p build/svg

      - name: Export JSON
        run: bundle exec exe/workouts export json --output build/activities.json

      - name: Export SVG
        run: bundle exec exe/workouts export svg --style github --title "Workouts" --output build/svg/github.svg

      - name: Validate SVG
        run: |
          bundle exec ruby -e '
            require "nokogiri"
            Dir["build/svg/*.svg"].each do |f|
              doc = Nokogiri::XML(File.read(f))
              if doc.errors.any?
                puts "::error::#{f}: #{doc.errors.map(&:to_s).join(", ")}"
                exit 1
              end
              puts "OK #{f}"
            end
          '

      - name: Export Stats
        run: bundle exec exe/workouts export stats --output build/stats.json

      - name: Export dashboard
        run: bundle exec exe/workouts export dashboard --output build/

      - name: Validate dashboard HTML
        run: |
          for id in map app-drawer chart chart-small detail-overlay charts-overlay; do
            if ! grep -q "id=\"$id\"" build/index.html; then
              echo "::error::Missing DOM id: $id"
              exit 1
            fi
          done
          echo "OK: All DOM IDs present"

      - name: Validate dashboard JS syntax
        run: |
          awk '/<script>/,/<\/script>/' build/index.html | head -n -1 | tail -n +2 > /tmp/dashboard.js
          node -e "new Function(require('fs').readFileSync('/tmp/dashboard.js','utf8'))"
          echo "OK: Dashboard JS syntax valid"

      - uses: actions/upload-artifact@v4
        with:
          name: pages-assets
          path: ./build

  deploy:
    needs: [build]
    if: success()
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pages-assets
          path: ./build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

      - id: deployment
        uses: actions/deploy-pages@v4
