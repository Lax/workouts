name: Probe PAT Permissions
on:
  workflow_dispatch:
    inputs:
      pat_token:
        description: 'PAT to probe (leave empty to use secrets.WORKOUTS_SYNC_PAT)'
        required: false
        default: ''

jobs:
  probe:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Probe variables API (GITHUB_TOKEN baseline)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          API="${GITHUB_API_URL:-https://api.github.com}"
          REPO="${GITHUB_REPOSITORY}"
          AUTH="Authorization: Bearer ${GITHUB_TOKEN}"
          TEST_VAR="__pat_probe_$$"

          echo "::group::Variables API — GITHUB_TOKEN (expected: 201)" >&2
          HTTP_CODE=$(curl -s -o /tmp/_var_success.json -w "%{http_code}" \
            -X POST \
            -H "$AUTH" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API}/repos/${REPO}/actions/variables" \
            -d "{\"name\":\"${TEST_VAR}\",\"value\":\"probe\"}" 2>/dev/null || echo "000")
          echo "HTTP ${HTTP_CODE}" >&2
          echo "--- Body ---" >&2
          cat /tmp/_var_success.json >&2
          echo "" >&2
          echo "--- Headers ---" >&2
          curl -s -o /dev/null -D - \
            -X POST \
            -H "$AUTH" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API}/repos/${REPO}/actions/variables" \
            -d "{\"name\":\"${TEST_VAR}\",\"value\":\"probe\"}" >&2
          echo "" >&2
          echo "::endgroup::" >&2
          echo "var_success_http=${HTTP_CODE}" >> $GITHUB_OUTPUT

          curl -s -o /dev/null -w "%{http_code}" \
            -X DELETE \
            -H "$AUTH" \
            "${API}/repos/${REPO}/actions/variables/${TEST_VAR}" 2>/dev/null || true

      - name: Probe variables API (WORKOUTS_SYNC_PAT)
        shell: bash
        env:
          PAT_TOKEN: ${{ inputs.pat_token || secrets.WORKOUTS_SYNC_PAT }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${PAT_TOKEN}" ]; then
            echo "::warning::PAT not provided — skipping" >&2
            exit 0
          fi
          API="${GITHUB_API_URL:-https://api.github.com}"
          REPO="${GITHUB_REPOSITORY}"
          AUTH="Authorization: Bearer ${PAT_TOKEN}"
          TEST_VAR="__pat_probe_$$"

          echo "::group::Variables API — WORKOUTS_SYNC_PAT (expected: 403)" >&2
          HTTP_CODE=$(curl -s -o /tmp/_var_pat.json -w "%{http_code}" \
            -X POST \
            -H "$AUTH" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API}/repos/${REPO}/actions/variables" \
            -d "{\"name\":\"${TEST_VAR}\",\"value\":\"probe\"}" 2>/dev/null || echo "000")
          echo "HTTP ${HTTP_CODE}" >&2
          echo "--- Body ---" >&2
          cat /tmp/_var_pat.json >&2
          echo "" >&2
          echo "--- Headers ---" >&2
          curl -s -o /dev/null -D - \
            -X POST \
            -H "$AUTH" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API}/repos/${REPO}/actions/variables" \
            -d "{\"name\":\"${TEST_VAR}\",\"value\":\"probe\"}" >&2
          echo "" >&2
          echo "::endgroup::" >&2
          echo "var_pat_http=${HTTP_CODE}" >> $GITHUB_OUTPUT

          curl -s -o /dev/null -w "%{http_code}" \
            -X DELETE \
            -H "$AUTH" \
            "${API}/repos/${REPO}/actions/variables/${TEST_VAR}" 2>/dev/null || true

      - name: Probe workflow:write (Contents API)
        shell: bash
        env:
          PAT_TOKEN: ${{ inputs.pat_token || secrets.WORKOUTS_SYNC_PAT }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_JOB: ${{ github.job }}
        run: |
          set -euo pipefail
          if [ -z "${PAT_TOKEN}" ]; then
            echo "::warning::PAT not provided — skipping" >&2
            exit 0
          fi
          API="${GITHUB_API_URL:-https://api.github.com}"
          REPO="${GITHUB_REPOSITORY}"
          AUTH="Authorization: Bearer ${PAT_TOKEN}"
          TEST_FILE=".github/workflows/__pat_probe-${GITHUB_RUN_ID}_${GITHUB_JOB}.yml"

          echo "::group::Contents API — write workflow file" >&2
          HTTP_CODE=$(curl -s -o /tmp/_wf_probe.json -w "%{http_code}" \
            -X PUT \
            -H "$AUTH" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API}/repos/${REPO}/contents/${TEST_FILE}" \
            -d '{"message":"permission probe","content":"bmFtZTogX19wYXRfcHJvYmUKb246IHdvcmtmbG93X2Rpc3BhdGNoCmpvYnM6CiAgcHJvYmU6CiAgICBydW5zLW9uOiB1YnVudHUtbGF0ZXN0CiAgICBzdGVwczoKICAgICAgLSBydW46IGVjaG8gInByb2JlIgo="}' \
            2>/dev/null || echo "000")
          echo "HTTP ${HTTP_CODE}" >&2
          echo "--- Body ---" >&2
          cat /tmp/_wf_probe.json >&2
          echo "" >&2
          echo "--- Headers ---" >&2
          curl -s -o /dev/null -D - \
            -X PUT \
            -H "$AUTH" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API}/repos/${REPO}/contents/${TEST_FILE}" \
            -d '{"message":"permission probe","content":"bmFtZTogX19wYXRfcHJvYmUKb246IHdvcmtmbG93X2Rpc3BhdGNoCmpvYnM6CiAgcHJvYmU6CiAgICBydW5zLW9uOiB1YnVudHUtbGF0ZXN0CiAgICBzdGVwczoKICAgICAgLSBydW46IGVjaG8gInByb2JlIgo="}' >&2
          echo "" >&2
          echo "::endgroup::" >&2
          echo "workflow_probe_http=${HTTP_CODE}" >> $GITHUB_OUTPUT

          SHA=$(sed -n 's/.*"sha"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' /tmp/_wf_probe.json | head -1)
          echo "cleanup: extracted SHA=[${SHA}]" >&2
          if [ -n "$SHA" ]; then
            DELETE_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              -X DELETE \
              -H "$AUTH" \
              "${API}/repos/${REPO}/contents/${TEST_FILE}?sha=${SHA}" 2>/dev/null || echo "000")
            echo "cleanup: DELETE ${TEST_FILE} → HTTP ${DELETE_CODE}" >&2
          else
            echo "cleanup: no SHA extracted, skipping DELETE" >&2
          fi
