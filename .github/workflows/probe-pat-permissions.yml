name: Probe PAT Permissions
on:
  workflow_dispatch:
    inputs:
      pat_token:
        description: 'PAT to probe (leave empty to use secrets.WORKOUTS_SYNC_PAT)'
        required: false
        default: ''

jobs:
  probe:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Probe PAT permissions
        uses: ./.github/actions/probe-pat-permissions
        with:
          pat_token: ${{ inputs.pat_token || secrets.WORKOUTS_SYNC_PAT }}
