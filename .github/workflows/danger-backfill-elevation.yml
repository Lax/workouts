name: "[DB] Dangerous backfill elevation"

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Source to backfill"
        type: choice
        default: "all"
        options:
          - all
          - igpsport
          - keep
          - xoss
          - strava
          - garmin
          - garmin_cn
          - xingzhe
      force:
        description: "Overwrite existing elevation values (default: only fill NULLs)"
        type: boolean
        default: false

jobs:
  backfill-elevation:
    name: "Backfill elevation"
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GIT_FIT_DATABASE_PATH: ${{ vars.GIT_FIT_DATABASE_PATH || 'data/db/workouts.db' }}
    concurrency:
      group: workouts-db
      cancel-in-progress: false
    steps:
      - id: run
        uses: ./.github/actions/danger-db-run
        with:
          data-sources: igpsport,keep,xoss,strava,garmin,garmin_cn,xingzhe,codoon,joyrun
          operation: |
            SOURCE="${{ inputs.source }}"
            FORCE="${{ inputs.force }}"

            args=""
            if [ "$SOURCE" != "all" ]; then
              args="$args $SOURCE"
            fi
            if [ "$FORCE" = "true" ]; then
              args="$args --force"
            fi

            bundle exec git fit elevation backfill $args 2>&1 | tee backfill.out

            if ! grep -q 'Elevation backfill:' backfill.out; then
              echo "::error::Elevation backfill command produced no summary line"
              exit 1
            fi

            UPDATED=$(grep -oP '\d+(?= updated)' backfill.out | head -1)
            SKIPPED=$(grep -oP '\d+(?= skipped)' backfill.out | head -1)
            FAILED=$(grep -oP '\d+(?= failed)' backfill.out | head -1)

            echo "updated=$UPDATED" >> $GITHUB_OUTPUT
            echo "result={\"skipped\":${SKIPPED:-0},\"failed\":${FAILED:-0}}" >> $GITHUB_OUTPUT
            if [ "$UPDATED" -gt 0 ]; then
              echo "mutated=true" >> $GITHUB_OUTPUT
              bundle exec ruby scripts/wal_checkpoint.rb "$DB_PATH"
            fi

      - name: Summary
        run: |
          echo "### GitFit elevation backfill" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|"
          echo "| Source | \`${{ inputs.source }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Force | \`${{ inputs.force }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Updated | \`${{ steps.run.outputs.updated || 0 }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Skipped | \`${{ fromJSON(steps.run.outputs.result || '{}').skipped || 0 }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Failed | \`${{ fromJSON(steps.run.outputs.result || '{}').failed || 0 }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          WARNINGS=$(grep '^Elevation backfill \[' backfill.out 2>/dev/null || true)
          if [ -n "$WARNINGS" ]; then
            echo "### Warnings" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$WARNINGS" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
