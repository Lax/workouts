name: "[DB] Dangerous backfill datetime + temperature"

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Source to backfill (all = run all sources)'
        required: false
        type: string
        default: all

jobs:
  backfill:
    concurrency:
      group: workouts-db
      cancel-in-progress: false
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      contents: write
    env:
      GIT_FIT_DATABASE_PATH: ${{ vars.GIT_FIT_DATABASE_PATH || 'data/db/workouts.db' }}
    steps:
      - id: run
        uses: ./.github/actions/danger-db-run
        with:
          data-sources: ${{ inputs.source == 'all' && 'keep,strava,igpsport,garmin,garmin_cn' || inputs.source }}
          operation: |
            SOURCE="${{ inputs.source }}"

            # Each script appends "updated=N" to $GITHUB_OUTPUT (last-wins);
            # capture per-source stdout "updated:" count and sum for the total.
            run_script() {
              bundle exec ruby scripts/backfill_keep_time.rb --db-path "$DB_PATH" --source "$1" 2>&1 | tee "/tmp/bf_$1.out"
              n=$(grep -oP 'updated:\s*\K\d+' "/tmp/bf_$1.out" | head -1)
              echo "$1 updated=$n"
            }

            total=0
            for src in keep strava igpsport; do
              if [ "$SOURCE" = "all" ] || [ "$SOURCE" = "$src" ]; then
                [ "$src" = "keep" ] && export GIT_FIT_SYSTEM_TIMEZONE="${{ vars.GIT_FIT_SYSTEM_TIMEZONE || 'Asia/Shanghai' }}"
                run_script "$src"
                n=$(grep -oP 'updated:\s*\K\d+' "/tmp/bf_$src.out" | head -1)
                total=$((total + ${n:-0}))
              fi
            done
            for src in garmin garmin_cn; do
              if [ "$SOURCE" = "all" ] || [ "$SOURCE" = "$src" ]; then
                bundle exec ruby scripts/backfill_garmin_sensors.rb --db-path "$DB_PATH" --source "$src" 2>&1 | tee "/tmp/bf_$src.out"
                n=$(grep -oP 'updated:\s*\K\d+' "/tmp/bf_$src.out" | head -1)
                total=$((total + ${n:-0}))
              fi
            done

            echo "updated=$total" >> $GITHUB_OUTPUT
            if [ "$total" -gt 0 ]; then
              echo "mutated=true" >> $GITHUB_OUTPUT
              bundle exec ruby scripts/wal_checkpoint.rb "$DB_PATH"
            else
              echo "updated=0" >> $GITHUB_OUTPUT
            fi

      - name: Summary
        run: |
          echo "### GitFit datetime + temperature backfill" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|"
          echo "| Source | \`${{ inputs.source }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Updated | \`${{ steps.run.outputs.updated || 0 }}\` |" >> $GITHUB_STEP_SUMMARY
