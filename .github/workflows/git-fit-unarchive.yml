name: "[GitFit] Unarchive Data Git -> Cache"

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Source to unarchive (empty = all sources)'
        required: false
        type: choice
        default: ''
        options:
          - ''
          - db
          - keep
          - igpsport
          - xoss
          - xingzhe
          - garmin
          - garmin_cn
          - strava

jobs:
  unarchive-data:
    if: ${{ inputs.source != 'db' }}
    concurrency:
      group: unarchive-${{ matrix.source }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        source: ${{ fromJson(github.event_name == 'workflow_dispatch' && inputs.source != '' && format('["{0}"]', inputs.source) || '["keep","igpsport","xoss","xingzhe","garmin","garmin_cn","strava"]') }}
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: GitFit/data/${{ matrix.source }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate extracted files
        shell: bash
        run: |
          RAW="data/raw/${{ matrix.source }}"
          STD="data/std/${{ matrix.source }}"
          if [[ ! -d "$RAW" ]] && [[ ! -d "$STD" ]]; then
            echo "::error::No data directories for '${{ matrix.source }}' in branch 'GitFit/data/${{ matrix.source }}'"
            exit 1
          fi

      - uses: actions/cache/save@v6.1.0
        with:
          path: |
            data/raw/${{ matrix.source }}
            data/std/${{ matrix.source }}
          # Recovery snapshot written by unarchive (git → cache).
          # This is real readable content; subsequent workflow restores hit it via the -v0- prefix.
          # It must NOT collide with the sentinel exact key (-v0-sentinel) used by restore,
          # otherwise restore would exact-hit this snapshot and permanently shadow newer -v0-{run} caches (F1).
          # run_number + run_id suffix keeps each unarchive a distinct cache entry (no key collision on repeat runs),
          # mirroring the sync-save key format (data-store/cache/save).
          key: GitFit-data-${{ matrix.source }}-v0-snapshot-${{ github.run_number }}-${{ github.run_id }}

  unarchive-db:
    if: ${{ inputs.source == 'db' || inputs.source == '' }}
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      contents: read
    concurrency:
      group: workouts-db
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: GitFit/db
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/git-fit-actions/db-store/paths
        id: db-paths
        with:
          database-path: ${{ vars.GIT_FIT_DATABASE_PATH || 'data/db/workouts.db' }}

      - name: Validate DB file
        shell: bash
        run: |
          DB_PATH="${{ steps.db-paths.outputs.db-path }}"
          if [[ ! -f "$DB_PATH" ]]; then
            echo "::error::DB file not found in branch 'GitFit/db'"
            exit 1
          fi

      - uses: actions/cache/save@v6.1.0
        with:
          path: |
            ${{ steps.db-paths.outputs.db-path }}
            ${{ steps.db-paths.outputs.db-path }}.SHA256SUMS
            ${{ steps.db-paths.outputs.db-path }}-wal
            ${{ steps.db-paths.outputs.db-path }}-shm
          # Recovery snapshot written by unarchive (git → cache).
          # Same sentinel/snapshot discipline as data above: real readable content under -v0- prefix,
          # never collide with the sentinel exact key used by db-store/cache/restore (F1).
          # run_number + run_id suffix mirrors the sync-save key format (db-store/cache/save).
          key: GitFit-db-v0-snapshot-${{ github.run_number }}-${{ github.run_id }}
