name: "[GitFit] Unarchive Data -> Cache"

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Source to unarchive (empty = all sources)'
        required: false
        type: choice
        options:
          - db
          - keep
          - igpsport
          - xoss
          - xingzhe
          - garmin
          - garmin_cn
          - strava

jobs:
  unarchive-data:
    if: ${{ inputs.source != 'db' }}
    concurrency:
      group: unarchive-${{ matrix.source }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        source: ${{ fromJson(github.event_name == 'workflow_dispatch' && inputs.source != '' && format('["{0}"]', inputs.source) || '["keep","igpsport","xoss","xingzhe","garmin","garmin_cn","strava"]') }}
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - name: Ensure branch exists
        env:
          BRANCH: GitFit/data/${{ matrix.source }}
        run: |
          if git ls-remote --exit-code --heads origin "refs/heads/$BRANCH" >/dev/null 2>&1; then
            echo "branch exists"
          else
            echo "::error::Branch '$BRANCH' does not exist"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate extracted files
        shell: bash
        run: |
          RAW="data/raw/${{ matrix.source }}"
          STD="data/std/${{ matrix.source }}"
          if [[ ! -d "$RAW" ]] && [[ ! -d "$STD" ]]; then
            echo "::error::No data directories for '${{ matrix.source }}' in branch '$BRANCH'"
            exit 1
          fi

      - uses: actions/cache/save@v6.1.0
        with:
          path: |
            data/raw/${{ matrix.source }}/
            data/std/${{ matrix.source }}/
          key: GitFit-data-${{ matrix.source }}-v0-cold

  unarchive-db:
    if: ${{ inputs.source == 'db' || inputs.source == '' }}
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      contents: read
    concurrency:
      group: workouts-db
      cancel-in-progress: false
    steps:
      - name: Ensure branch exists
        env:
          BRANCH: GitFit/db
        run: |
          if git ls-remote --exit-code --heads origin "refs/heads/$BRANCH" >/dev/null 2>&1; then
            echo "branch exists"
          else
            echo "::error::Branch '$BRANCH' does not exist"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate DB file
        shell: bash
        run: |
          if [[ ! -f data/db/workouts.db ]]; then
            echo "::error::DB file not found in branch '$BRANCH'"
            exit 1
          fi

      - uses: actions/cache/save@v6.1.0
        with:
          path: |
            data/db/workouts.db
            data/db/workouts.db.SHA256SUMS
            data/db/workouts.db-wal
            data/db/workouts.db-shm
          key: GitFit-db-v0-cold
