name: "[DB] Dangerous purge by source"

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Source to delete (activities.source)"
        required: true
        type: choice
        default: "2bulu"
        options: ["2bulu", "apple_health"]
      dry_run:
        description: "Dry-run (count only, no DELETE)"
        required: false
        type: boolean
        default: true
      confirm:
        description: 'Type "DELETE" to confirm destructive delete'
        required: true
        type: string
        default: ""

concurrency:
  group: workouts-db
  cancel-in-progress: false

permissions:
  contents: write

env:
  GIT_FIT_DATABASE_PATH: ${{ vars.GIT_FIT_DATABASE_PATH || 'data/db/workouts.db' }}

jobs:
  purge:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: "[db] Derive database paths"
        id: db-paths
        uses: git-fit-actions/db-store/paths@v1
        with:
          database-path: ${{ env.GIT_FIT_DATABASE_PATH }}

      - name: "[db] Restore cache"
        id: db-restore
        uses: git-fit-actions/db-store/cache/restore@v1
        with:
          db-dir: ${{ steps.db-paths.outputs.dir }}
          db-name: ${{ steps.db-paths.outputs.name }}
          git-restore-mode: fallback
          git-branch: GitFit/db

      - name: Guard confirm
        shell: bash
        run: |
          if [ "${{ inputs.confirm }}" != "DELETE" ]; then
            echo "::error::Must type DELETE to confirm. Got: ${{ inputs.confirm }}"
            exit 1
          fi
          echo "confirm ok (source=${{ inputs.source }} dry_run=${{ inputs.dry_run }})"

      - name: Purge source via SQLite
        id: purge
        shell: bash
        env:
          DB_PATH: ${{ steps.db-paths.outputs.db-path }}
          SOURCE: ${{ inputs.source }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          bundle exec ruby -e '
            require "sequel"
            db = Sequel.sqlite(ENV.fetch("DB_PATH"))
            src = ENV.fetch("SOURCE")
            dry = ENV.fetch("DRY_RUN") == "true"
            before = db[:activities].where(source: src).count
            deleted = 0
            unless dry
              deleted = db[:activities].where(source: src).delete
            end
            File.open(ENV.fetch("GITHUB_OUTPUT"), "a") do |f|
              f.puts "matched=#{before}"
              f.puts "deleted=#{deleted}"
            end
            puts "matched=#{before} deleted=#{deleted} dry=#{dry}"
          '

      - name: "[db] Checkpoint SQLite WAL"
        if: steps.purge.outputs.deleted != '0'
        shell: bash
        env:
          DB_PATH: ${{ steps.db-paths.outputs.db-path }}
        run: |
          bytes=$(bundle exec ruby -e '
            require "sequel"
            db = Sequel.sqlite(ENV.fetch("DB_PATH"))
            db.run("PRAGMA wal_checkpoint(TRUNCATE)")
            print File.size(ENV.fetch("DB_PATH"))
          ')
          echo "db_size=$bytes" >> "$GITHUB_OUTPUT"
          echo "checkpoint done size=$bytes"

      # ── DB save (cache-only) ──
      - name: "[db] Save cache"
        if: always()
        uses: git-fit-actions/db-store/cache/save@v1
        with:
          db-dir: ${{ steps.db-paths.outputs.dir }}
          db-name: ${{ steps.db-paths.outputs.name }}
          save-to-git-branch: false

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "### Dangerous DB purge \`${{ inputs.source }}\` ${{ inputs.dry_run == true && 'dry-run' || 'LIVE' }}: matched=${{ steps.purge.outputs.matched }} deleted=${{ steps.purge.outputs.deleted }}" >> "$GITHUB_STEP_SUMMARY"
          echo "confirm=${{ inputs.confirm }} source=${{ inputs.source }} dry_run=${{ inputs.dry_run }}" >> "$GITHUB_STEP_SUMMARY"
