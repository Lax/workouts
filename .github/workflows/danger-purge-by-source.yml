name: "[DB] Dangerous purge by source"

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Source to delete (activities.source)"
        required: true
        type: choice
        default: "2bulu"
        options: ["2bulu", "apple_health"]
      dry_run:
        description: "Dry-run (count only, no DELETE)"
        required: false
        type: boolean
        default: true
      confirm:
        description: 'Type "DELETE" to confirm destructive delete'
        required: true
        type: string
        default: ""

concurrency:
  group: workouts-db
  cancel-in-progress: false

permissions:
  contents: write

env:
  GIT_FIT_DATABASE_PATH: ${{ vars.GIT_FIT_DATABASE_PATH || 'data/db/workouts.db' }}

jobs:
  purge:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: Guard confirm
        shell: bash
        run: |
          if [ "${{ inputs.confirm }}" != "DELETE" ]; then
            echo "::error::Must type DELETE to confirm. Got: ${{ inputs.confirm }}"
            exit 1
          fi
          echo "confirm ok (source=${{ inputs.source }} dry_run=${{ inputs.dry_run }})"

      - id: run
        uses: ./.github/actions/danger-db-run
        with:
          operation: |
            DRY="${{ inputs.dry_run }}"
            SRC="${{ inputs.source }}"
            before=$(sqlite3 "$DB_PATH" "SELECT COUNT(*) FROM activities WHERE source='$SRC'")
            deleted=0
            if [ "$DRY" != "true" ]; then
              deleted=$(sqlite3 "$DB_PATH" "DELETE FROM activities WHERE source='$SRC'; SELECT changes()")
            fi
            echo "matched=$before deleted=$deleted dry=$DRY"
            echo "updated=$deleted" >> $GITHUB_OUTPUT
            echo "result={\"matched\":$before,\"deleted\":$deleted,\"dry\":\"$DRY\"}" >> $GITHUB_OUTPUT
            if [ "$deleted" != 0 ]; then
              echo "mutated=true" >> $GITHUB_OUTPUT
              bytes=$(bundle exec ruby scripts/wal_checkpoint.rb "$DB_PATH")
              echo "checkpoint done size=$bytes"
            else
              echo "mutated=false" >> $GITHUB_OUTPUT
            fi

      - name: Summary
        if: always()
        run: |
          echo "### Dangerous DB purge \`${{ inputs.source }}\` ${{ inputs.dry_run == true && 'dry-run' || 'LIVE' }}: matched=${{ fromJSON(steps.run.outputs.result || '{}').matched || 0 }} deleted=${{ fromJSON(steps.run.outputs.result || '{}').deleted || 0 }}" >> "$GITHUB_STEP_SUMMARY"
          echo "confirm=${{ inputs.confirm }} source=${{ inputs.source }} dry_run=${{ inputs.dry_run }}" >> "$GITHUB_STEP_SUMMARY"
