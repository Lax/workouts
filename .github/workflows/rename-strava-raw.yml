name: Rename Strava API Raw Files (.json → .api.json)

on:
  workflow_dispatch:

jobs:
  rename:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure git auth
        run: |
          git config --add http.https://github.com/.extraheader \
            "AUTHORIZATION: basic $(printf '%s:' \
              "${{ secrets.WORKOUTS_SYNC_PAT }}" | base64 -w0)"

      - name: Checkout archive branch
        env:
          BRANCH: _/_/strava
        run: |
          git fetch origin "$BRANCH"
          git checkout "$BRANCH"

      - name: Restore Strava cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/raw/strava/
          key: raw-std-v1-strava-${{ github.run_id }}
          restore-keys: raw-std-v1-strava-

      - name: Clean up temp files
        run: |
          rm -f data/raw/strava/.*.tmp 2>/dev/null
          find data/raw/strava -name '*.tmp' -type f -delete 2>/dev/null || true
          echo "Temp files cleaned."

      - name: Rename .json → .api.json
        id: rename
        run: |
          count=0
          for f in data/raw/strava/*.json; do
            [ -f "$f" ] || continue
            [[ "$f" == *.api.json ]] && continue

            if ! head -c256 "$f" | grep -q '"source":"strava"'; then
              echo "WARN: $(basename "$f") — not a Strava API archive, skipping"
              continue
            fi

            new="${f%.json}.api.json"
            [ -f "$new" ] && { echo "WARN: $new exists — skipping"; continue; }

            git mv "$f" "$new"
            count=$((count + 1))
            echo "  $(basename "$f") → $(basename "$new")"
          done

          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Renamed $count files."

      - name: Save Strava cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/raw/strava/
          key: raw-std-v1-strava-${{ github.run_id }}

      - name: Commit & push
        if: steps.rename.outputs.count != '0'
        env:
          BRANCH: _/_/strava
        run: |
          rm -f data/raw/strava/.*.tmp 2>/dev/null
          find data/raw/strava -name '*.tmp' -type f -delete 2>/dev/null || true
          git add data/raw/strava/
          git diff --cached --quiet && { echo "no changes"; exit 0; }
          git -c user.name=workouts-bot -c user.email=bot@workouts \
            commit -m "chore(strava): rename API raw files .json → .api.json (${{ steps.rename.outputs.count }} files)"
          git push origin "HEAD:$BRANCH"
