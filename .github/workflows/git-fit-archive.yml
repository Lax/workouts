name: "[GitFit] Archive Data Cache -> Git"

on:
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:
    inputs:
      source:
        description: 'Single source to archive (empty = all)'
        required: false
        type: string

jobs:
  archive:
    concurrency:
      group: archive-${{ matrix.source }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        source: ${{ fromJson(github.event_name == 'workflow_dispatch' && inputs.source != '' && format('["{0}"]', inputs.source) || '["keep","igpsport","xoss","xingzhe","garmin","garmin_cn","strava"]') }}
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: GitFit/data/${{ matrix.source }}

      - name: Restore ${{ matrix.source }} cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            data/raw/${{ matrix.source }}
            data/std/${{ matrix.source }}
          key: GitFit-data-${{ matrix.source }}-v0-cold
          restore-keys: GitFit-data-${{ matrix.source }}-v0-

      - name: Commit & push
        env:
          SRC: ${{ matrix.source }}
          BRANCH: GitFit/data/${{ matrix.source }}
        run: |
          set -euo pipefail

          git add -f -A "data/raw/$SRC/" "data/std/$SRC/" 2>/dev/null || true

          TREE=$(git write-tree)
          PURE_DEL=$(git diff-tree -r --diff-filter=D --name-only -M50% \
            HEAD "$TREE" 2>/dev/null || true)

          if [ -n "$PURE_DEL" ]; then
            echo "Pure deletes (unstage):"
            echo "$PURE_DEL" | while IFS= read -r f; do
              echo "  $f"
              git reset HEAD -- "$f" 2>/dev/null || true
            done
          fi

          git diff --cached --quiet && echo "no changes" && exit 0

          git -c user.name=workouts-bot -c user.email=bot@workouts \
            commit -m "archive($SRC): $(date +%Y-%m-%d)"
          git push origin "HEAD:$BRANCH"

  archive-db:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      contents: write
    concurrency:
      group: workouts-db
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: GitFit/db

      - name: Restore DB from cache
        uses: git-fit-actions/db-store/cache/restore@v1
        with:
          database-path: data/db/workouts.db

      - name: Commit & push
        env:
          BRANCH: GitFit/db
        run: |
          set -euo pipefail
          git add -f -A "data/db/" 2>/dev/null || true
          git diff --cached --quiet && echo "no changes" && exit 0
          git -c user.name=workouts-bot -c user.email=bot@workouts \
            commit -m "archive(db): $(date +%Y-%m-%d)"
          git push origin "HEAD:$BRANCH"
