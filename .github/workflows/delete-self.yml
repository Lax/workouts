name: Delete Workflow File
on:
  workflow_dispatch:
    inputs:
      workflow_file:
        description: 'Path to workflow file to delete (e.g. .github/workflows/__pat_probe-30419222651_probe.yml)'
        required: true
        default: '.github/workflows/__pat_probe-30419222651_probe.yml'
      pat_token:
        description: 'PAT with workflows:write (leave empty to use secrets.WORKOUTS_SYNC_PAT)'
        required: false
        default: ''

jobs:
  delete:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Delete workflow file via PAT
        shell: bash
        env:
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PAT_TOKEN: ${{ inputs.pat_token || secrets.WORKOUTS_SYNC_PAT }}
          WORKFLOW_FILE: ${{ inputs.workflow_file }}
        run: |
          set -euo pipefail
          if [ -z "${PAT_TOKEN}" ]; then
            echo "::error::PAT token not provided" >&2
            exit 1
          fi
          API="${GITHUB_API_URL:-https://api.github.com}"
          REPO="${GITHUB_REPOSITORY}"
          FILE="$WORKFLOW_FILE"
          AUTH="Authorization: Bearer ${PAT_TOKEN}"

          echo "Fetching info for ${FILE}" >&2
          RESP=$(curl -s -H "$AUTH" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API}/repos/${REPO}/contents/${FILE}")

          SHA=$(echo "$RESP" | sed -n 's/.*"sha"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | head -1)

          if [ -z "$SHA" ]; then
            echo "Error: cannot find SHA for ${FILE}" >&2
            echo "$RESP" >&2
            exit 1
          fi

          echo "Deleting ${FILE} (sha=${SHA})" >&2
          HTTP_CODE=$(curl -s -o /tmp/_del.json -w "%{http_code}" \
            -X DELETE \
            -H "$AUTH" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API}/repos/${REPO}/contents/${FILE}?sha=${SHA}")

          echo "HTTP=${HTTP_CODE}" >&2
          cat /tmp/_del.json >&2

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Delete failed" >&2
            exit 1
          fi

          echo "Deleted ${FILE}" >&2
