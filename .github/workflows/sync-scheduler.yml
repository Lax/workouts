name: Sync Scheduler

# Adjusts sync.yml adaptive cron interval based on DB freshness.
# Triggered conditionally by sync.yml on schedule events (gh-pages pattern).
# workflow_dispatch: manual run; commit defaults to false (does not write cron).

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Commit and push the cron change (sync schedule-origin sets true)
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  manage:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    concurrency:
      group: workouts-db
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configure git
        id: git-setup
        env:
          WORKOUTS_SYNC_PAT: ${{ secrets.WORKOUTS_SYNC_PAT }}
        run: |
          if [ -z "$WORKOUTS_SYNC_PAT" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          git config user.name "workouts-bot"
          git config user.email "bot@workouts"
          git config --add http.https://github.com/.extraheader \
            "AUTHORIZATION: basic $(printf '%s:' "$WORKOUTS_SYNC_PAT" | base64 -w0)"
          echo "configured=true" >> $GITHUB_OUTPUT

      - uses: ruby/setup-ruby@v1
        if: vars.RUNNER_LABEL != 'self-hosted'
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: '[db] Restore cache'
        uses: git-fit-actions/db-store/cache/restore@v1
        with:
          database-path: data/db/workouts.db

      - name: Read current cron interval
        id: read
        shell: bash
        run: echo "N=$(grep -oP '/\K\d+(?= \* \*)' .github/workflows/sync.yml | head -1)" >> $GITHUB_OUTPUT

      - name: Compute new interval
        id: compute
        shell: bash
        env:
          N: ${{ steps.read.outputs.N || '3' }}
          DB_PATH: ${{ vars.GIT_FIT_DATABASE_PATH }}
        run: |
          bundle exec ruby -e '
            n = ENV["N"].to_i
            db = ENV["DB_PATH"]
            unless File.exist?(db)
              puts "new_n=#{n}"
              exit
            end
            require "sequel"
            row = Sequel.sqlite(db)[:activities].order(Sequel.desc(:start_date)).first
            unless row
              puts "new_n=#{n}"
              exit
            end
            f = ((Time.now - Time.parse(row[:start_date].to_s)) / 86400).round
            n -= 1 if f < n && n > 1
            n += 1 if f > 2 * n + 1 && n < 7
            puts "f=#{f}"
            puts "new_n=#{n}"
          ' >> $GITHUB_OUTPUT

      - name: Update and commit cron
        id: manage
        shell: bash
        env:
          CURRENT_N: ${{ steps.read.outputs.N || '3' }}
          NEW_N: ${{ steps.compute.outputs.new_n }}
          WORKFLOW_FILE: .github/workflows/sync.yml
          GIT_CONFIGURED: ${{ steps.git-setup.outputs.configured }}
          COMMIT: ${{ inputs.commit }}
        run: |
          if [ "$CURRENT_N" = "$NEW_N" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "new_n=$NEW_N" >> $GITHUB_OUTPUT
            exit 0
          fi
          sed -i "s|/\\([0-9]\\) \\* \\*|/${NEW_N} * *|" "$WORKFLOW_FILE"
          echo "new_n=$NEW_N" >> $GITHUB_OUTPUT
          echo "changed=true" >> $GITHUB_OUTPUT

          if [ "$COMMIT" = "true" ] && [ "$GIT_CONFIGURED" = "true" ]; then
            git -c user.name=workouts-bot -c user.email=bot@workouts \
              commit -m "chore: sync interval N=$NEW_N ［skip ci］" "$WORKFLOW_FILE"
            git pull --rebase
            git push
          fi
