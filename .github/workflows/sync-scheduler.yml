name: Sync Scheduler

# Adjusts sync.yml adaptive cron interval based on DB freshness.
# Triggered by sync.yml on data/DB change (gh-pages pattern), or by its own
# daily schedule as a fallback for the deceleration branch (f > 2N+1) which
# only fires when data is stale (i.e. no data change to trigger it).
# workflow_dispatch: manual run; commit defaults to false (does not write cron).

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      commit:
        description: Commit and push the cron change (sync schedule-origin sets true)
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  manage:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    concurrency:
      group: workouts-db
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - uses: git-fit-actions/db-store/paths@v1.2.1
        id: db-paths
        with:
          database-path: ${{ vars.GIT_FIT_DATABASE_PATH || 'data/db/workouts.db' }}

      - name: '[db] Restore cache'
        uses: git-fit-actions/db-store/cache/restore@v1.2.1
        with:
          db-dir: ${{ steps.db-paths.outputs.dir }}
          db-name: ${{ steps.db-paths.outputs.name }}

      - name: Read current cron interval
        id: read
        shell: bash
        run: echo "N=$(grep -oP '/\K\d+(?= \* \*)' .github/workflows/sync.yml | head -1)" >> $GITHUB_OUTPUT

      - name: Compute new interval
        id: compute
        shell: bash
        env:
          N: ${{ steps.read.outputs.N || '3' }}
          DB_PATH: ${{ steps.db-paths.outputs.db-path }}
        run: |
          bundle exec ruby -e '
            n = ENV["N"].to_i
            db = ENV["DB_PATH"]
            unless File.exist?(db)
              puts "new_n=#{n}"
              exit
            end
            require "sequel"
            row = Sequel.sqlite(db)[:activities].order(Sequel.desc(:start_date)).first
            unless row
              puts "new_n=#{n}"
              exit
            end
            f = ((Time.now - Time.parse(row[:start_date].to_s)) / 86400).round
            n -= 1 if f < n && n > 1
            n += 1 if f > 2 * n + 1 && n < 7
            puts "f=#{f}"
            puts "new_n=#{n}"
          ' >> $GITHUB_OUTPUT

      - name: Update sync.yml cron
        if: ${{ github.event_name == 'schedule' || inputs.commit == 'true' }}
        shell: bash
        env:
          NEW_N: ${{ steps.compute.outputs.new_n }}
        run: |
          sed -i "s|/\([0-9]\) \* \*|/${NEW_N} * *|" .github/workflows/sync.yml

      - name: Configure git
        if: ${{ github.event_name == 'schedule' || inputs.commit == 'true' }}
        id: git-setup
        env:
          WORKOUTS_SYNC_PAT: ${{ secrets.WORKOUTS_SYNC_PAT }}
        run: |
          if [ -z "$WORKOUTS_SYNC_PAT" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          git config --add http.https://github.com/.extraheader \
            "AUTHORIZATION: basic $(printf '%s:' "$WORKOUTS_SYNC_PAT" | base64 -w0)"
          echo "configured=true" >> $GITHUB_OUTPUT

      - name: Commit cron change
        uses: stefanzweifel/git-auto-commit-action@v7
        if: ${{ (github.event_name == 'schedule' || inputs.commit == 'true') && steps.git-setup.outputs.configured == 'true' }}
        with:
          commit_message: 'chore: sync interval N=${{ steps.compute.outputs.new_n }} [skip ci]'
          commit_user_name: 'workouts-bot'
          commit_user_email: 'bot@workouts'
          file_pattern: '.github/workflows/sync.yml'
