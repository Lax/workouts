name: Deploy (Github Pages)

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      artifact-run-id:
        description: 'Sync run ID to download DB artifact'
        required: false

jobs:
  deploy-pages:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: deploy-gh-pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          token: ${{ secrets.WORKOUTS_SYNC_PAT }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - uses: git-fit-actions/db-store/cache/restore@v1
        with:
          database-path: data/db/workouts.db

      - name: Download fresh DB artifact
        if: inputs.artifact-run-id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: workouts-db
          path: data/db/
          run-id: ${{ inputs.artifact-run-id }}
          github-token: ${{ github.token }}

      - name: Create build directory
        run: mkdir -p site/svg

      - name: Export JSON
        run: bundle exec exe/workouts export json --output site/activities.json --tracks-output site/tracks.json

      - name: Export SVG
        run: bundle exec exe/workouts export svg --style github --title "Workouts" --output site/svg/github.svg

      - name: Validate SVG
        run: |
          bundle exec ruby -e '
            require "nokogiri"
            Dir["site/svg/*.svg"].each do |f|
              doc = Nokogiri::XML(File.read(f))
              if doc.errors.any?
                puts "::error::#{f}: #{doc.errors.map(&:to_s).join(", ")}"
                exit 1
              end
              puts "OK #{f}"
            end
          '

      - name: Export Stats
        run: bundle exec exe/workouts export stats --output site/stats.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - id: deployment
        uses: actions/deploy-pages@v4
