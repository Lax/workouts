name: Deploy (Github Pages)

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      artifact-run-id:
        description: 'Sync run ID to download DB artifact'
        required: false

jobs:
  deploy-pages:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    env:
      GIT_FIT_DATABASE_PATH: ${{ vars.GIT_FIT_DATABASE_PATH || 'data/db/workouts.db' }}
      # secrets 不可用于 step 级 if（actionlint 验证）——经 job env 间接传递
      AI_API_KEY_PRESENT: ${{ secrets.AI_API_KEY != '' }}
    permissions:
      actions: read
      pages: write
      id-token: write
      packages: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: deploy-gh-pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          token: ${{ secrets.WORKOUTS_SYNC_PAT }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - uses: git-fit-actions/db-store/paths@v1
        id: db-paths
        with:
          database-path: ${{ env.GIT_FIT_DATABASE_PATH }}

      - uses: git-fit-actions/db-store/cache/restore@v1
        with:
          db-dir: ${{ steps.db-paths.outputs.dir }}
          db-name: ${{ steps.db-paths.outputs.name }}

      - name: Download fresh DB artifact
        if: inputs.artifact-run-id != ''
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: workouts-db
          path: ${{ steps.db-paths.outputs.dir }}
          run-id: ${{ inputs.artifact-run-id }}
          github-token: ${{ github.token }}

      - name: Create build directory
        run: mkdir -p site

      - name: Export JSON
        run: bundle exec git fit export json --output site/activities.json --tracks-output site/tracks.json

      - name: Export Stats
        run: bundle exec git fit export stats --output site/stats.json

      - name: '[ai] Restore cache'
        uses: actions/cache/restore@v4
        with:
          path: site/insights.json
          key: GitFit-ai-insights-v0-sentinel
          restore-keys: |
            GitFit-ai-insights-v0-

      - name: Export AI insights
        id: ai-export
        if: env.AI_API_KEY_PRESENT == 'true'
        continue-on-error: true
        env:
          GIT_FIT_AI_ENABLED: 'true'
          GIT_FIT_AI_ENDPOINT: ${{ vars.AI_ENDPOINT || 'https://opencode.ai/zen/v1' }}
          GIT_FIT_AI_MODEL: ${{ vars.AI_MODEL || 'mimo-v2.5-free' }}
          GIT_FIT_AI_API_KEY_ENV: AI_API_KEY
          # 免费档模型在 ~43KB stats prompt 下常见 >60s（2026-08-31 insights 场景 60s 超时实测），放宽到 180s
          GIT_FIT_AI_TIMEOUT: '180'
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: |
          before=$(sha256sum site/insights.json 2>/dev/null | cut -d' ' -f1 || echo none)
          bundle exec git fit export ai --output site/insights.json
          after=$(sha256sum site/insights.json 2>/dev/null | cut -d' ' -f1 || echo none)
          if [ "$before" != "$after" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      - name: '[ai] Save cache'
        if: steps.ai-export.outputs.changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: site/insights.json
          key: GitFit-ai-insights-v0-${{ github.run_id }}

      - name: Stage races.json
        run: jq -c . data/events/races.json > site/races.json

      - name: Verify map tile token
        env:
          MAPTILER_TOKEN: ${{ secrets.MAPTILER_TOKEN }}
        run: |
          if [ -z "$MAPTILER_TOKEN" ]; then
            status="missing"
            http="n/a"
          else
            http="000"
            for attempt in 1 2 3; do
              http=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
                "https://api.maptiler.com/maps/dark-v2/0/0/0.png?key=${MAPTILER_TOKEN}")
              [ "$http" = "200" ] && break
              [ "$attempt" -lt 3 ] && sleep 5
            done
            status="ok"
            [ "$http" = "200" ] || status="smoke-failed"
          fi
          {
            echo "### Map tile source (running-page)"
            echo ""
            echo "| Status | HTTP | Token |"
            echo "|---|---|---|"
            case "$status" in
              ok)           echo "| ✅ maptiler verified | $http | present |" ;;
              missing)      echo "| ❌ maptiler token missing — map shows error tiles | $http | absent |" ;;
              smoke-failed) echo "| ❌ maptiler smoke check failed — map may show error tiles | $http | present |" ;;
            esac
            echo ""
            echo "Fix: update MAPTILER_TOKEN secret (https://cloud.maptiler.com/account/keys/)"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" != "ok" ]; then
            echo "::warning::MapTiler token $status (HTTP $http) — running-page map shows error tiles. Fix: update MAPTILER_TOKEN secret (https://cloud.maptiler.com/account/keys/)"
          fi

      - name: Create frontend build config
        env:
          MAPTILER_TOKEN: ${{ secrets.MAPTILER_TOKEN }}
        run: |
          jq --arg token "$MAPTILER_TOKEN" '
            .themes["running-page"].site.mapTileVendor = "maptiler" |
            .themes["running-page"].site.mapTileToken = $token |
            .themes["running-page"].site |= del(.mapTileStyle)
          ' config.json > config.build.json

      - name: Build frontend UI
        uses: git-fit-actions/frontend-build@v1
        with:
          config: config.build.json
          out-dir: site
          npm-auth-token: ${{ secrets.GIT_FIT_NPM_TOKEN }}

      - name: Remove generated frontend build config
        run: rm -f config.build.json

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

      - id: deployment
        uses: actions/deploy-pages@v5
