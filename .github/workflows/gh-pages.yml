name: Deploy (Github Pages)

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      artifact-run-id:
        description: 'Sync run ID to download DB artifact'
        required: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: deploy-gh-pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          token: ${{ secrets.WORKOUTS_SYNC_PAT }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Restore DB from cache
        uses: actions/cache/restore@v4
        with:
          path: data/workouts.db
          key: workouts-db-v1-
          restore-keys: workouts-db-v1-

      - name: Download fresh DB artifact
        if: inputs.artifact-run-id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: workouts-db
          path: data/
          run-id: ${{ inputs.artifact-run-id }}
          github-token: ${{ github.token }}

      - name: Create build directory
        run: mkdir -p site/svg

      - name: Export JSON
        run: bundle exec exe/workouts export json --output site/activities.json

      - name: Export SVG
        run: bundle exec exe/workouts export svg --style github --title "Workouts" --output site/svg/github.svg

      - name: Validate SVG
        run: |
          bundle exec ruby -e '
            require "nokogiri"
            Dir["site/svg/*.svg"].each do |f|
              doc = Nokogiri::XML(File.read(f))
              if doc.errors.any?
                puts "::error::#{f}: #{doc.errors.map(&:to_s).join(", ")}"
                exit 1
              end
              puts "OK #{f}"
            end
          '

      - name: Export Stats
        run: bundle exec exe/workouts export stats --output site/stats.json

      - name: Build Svelte frontend
        run: npm run build

      - name: Copy Svelte build to site/ (primary)
        run: |
          cp -r packages/web/dist/assets site/
          cp packages/web/dist/*.html site/

      - name: Validate build
        run: |
          test -f site/index.html || { echo "::error::Missing index.html"; exit 1; }
          ls site/assets/index-*.js >/dev/null 2>&1 || { echo "::error::Missing JS bundle"; exit 1; }
          echo "OK: Svelte build present"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - id: deployment
        uses: actions/deploy-pages@v4
