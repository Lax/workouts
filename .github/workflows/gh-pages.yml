name: Deploy (Github Pages)

# 触发只有 workflow_dispatch：sync 数据变更 / CI deploy-gate（站点相关路径命中）
# / backfill-device 自动重导出 / 手动。原先 CI 成功即全量重建的 workflow_run
# 触发已改为 ci.yml deploy-gate 的路径闸。
on:
  workflow_dispatch:
    inputs:
      artifact-run-id:
        description: 'Sync run ID to download DB artifact'
        required: false

jobs:
  deploy-pages:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    # 账单保险丝：纯发布管道（AI 导出已拆至 ai-insights.yml，发布不依赖 LLM），
    # 常态 ~2min（2026-11 实测），各导出 + frontend-build 冷缓存最坏 ~15min → 20min
    timeout-minutes: 20
    env:
      GIT_FIT_DATABASE_PATH: ${{ vars.GIT_FIT_DATABASE_PATH || 'data/db/workouts.db' }}
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
      packages: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: deploy-gh-pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - uses: git-fit-actions/db-store/paths@v1
        id: db-paths
        with:
          database-path: ${{ env.GIT_FIT_DATABASE_PATH }}

      - uses: git-fit-actions/db-store/cache/restore@v1
        with:
          db-dir: ${{ steps.db-paths.outputs.dir }}
          db-name: ${{ steps.db-paths.outputs.name }}

      - name: Download fresh DB artifact
        if: inputs.artifact-run-id != ''
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: workouts-db
          path: ${{ steps.db-paths.outputs.dir }}
          run-id: ${{ inputs.artifact-run-id }}
          github-token: ${{ github.token }}

      - name: Create build directory
        run: mkdir -p site

      - name: Export JSON
        run: bundle exec git fit export json --output site/activities.json --tracks-output site/tracks.json

      - name: Export Stats
        run: bundle exec git fit export stats --output site/stats.json

      # 能力画像快照（wiki/Ability）——纯本地派生无 LLM，确定性重算无需缓存；
      # insights digest 在 gem 内已指纹 ability，digest-skip 联动无需 CI 侧缓存键
      - name: Export ability snapshots
        run: bundle exec git fit ability compute --output site/ability.json

      # 只读消费 ai-insights.yml 产出的 insights cache——发布链路不运行 LLM，
      # cache 冷/缺失时站点以无 AI 数据发布（config.json data.ai optional: true）
      - name: '[ai] Restore cache'
        uses: actions/cache/restore@v6
        with:
          path: site/insights.json
          key: GitFit-ai-insights-v0-sentinel
          restore-keys: |
            GitFit-ai-insights-v0-

      - name: Stage races.json
        run: jq -c . data/events/races.json > site/races.json

      - name: Verify map tile token
        env:
          MAPTILER_TOKEN: ${{ secrets.MAPTILER_TOKEN }}
        run: |
          if [ -z "$MAPTILER_TOKEN" ]; then
            status="missing"
            http="n/a"
          else
            http="000"
            for style in darkmatter bright-v2; do
              for attempt in 1 2 3; do
                http=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
                  -H "Referer: https://liulantao.com/" \
                  "https://api.maptiler.com/maps/${style}/0/0/0.png?key=${MAPTILER_TOKEN}")
                [ "$http" = "200" ] && break
                [ "$attempt" -lt 3 ] && sleep 5
              done
              [ "$http" = "200" ] || { style_failed="$style"; break; }
            done
            status="ok"
            [ -z "$style_failed" ] || status="smoke-failed"
          fi
          {
            echo "### Map tile source (running-page)"
            echo ""
            echo "| Status | HTTP | Token |"
            echo "|---|---|---|"
            case "$status" in
              ok)           echo "| ✅ maptiler verified (darkmatter + bright-v2) | 200 | present |" ;;
              missing)      echo "| ❌ maptiler token missing — map shows error tiles | $http | absent |" ;;
              smoke-failed) echo "| ❌ maptiler smoke check failed on ${style_failed:-tile} — map may show error tiles | $http | present |" ;;
            esac
            echo ""
            echo "Fix: update MAPTILER_TOKEN secret (https://cloud.maptiler.com/account/keys/)"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" != "ok" ]; then
            echo "::warning::MapTiler token $status (HTTP $http) — running-page map shows error tiles. Fix: update MAPTILER_TOKEN secret (https://cloud.maptiler.com/account/keys/)"
          fi

      - name: Create frontend build config
        env:
          MAPTILER_TOKEN: ${{ secrets.MAPTILER_TOKEN }}
        run: |
          jq --arg token "$MAPTILER_TOKEN" '
            .themes["running-page"].site.mapTileVendor = "maptiler" |
            .themes["running-page"].site.mapTileToken = $token |
            .themes["running-page"].site |= del(.mapTileStyle)
          ' config.json > config.build.json

      - name: Build frontend UI
        uses: git-fit-actions/frontend-build@v1
        with:
          config: config.build.json
          out-dir: site
          npm-auth-token: ${{ secrets.GIT_FIT_NPM_TOKEN }}

      - name: Remove generated frontend build config
        run: rm -f config.build.json

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

      - id: deployment
        uses: actions/deploy-pages@v5
