name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  workflow-lint:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Lint GitHub Actions workflows
        uses: raven-actions/actionlint@v2
        with:
          # shellcheck off: repo scripts are not shellcheck-clean (SC2086 style).
          # Empty-option lint ignored via .github/actionlint.yml.
          shellcheck: false

  ruby-test:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}

    strategy:
      matrix:
        ruby-version: ["3.4"]

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      - name: Run tests
        run: bundle exec rspec

      - name: Check syntax
        run: |
          ruby -c lib/workouts.rb
          for f in $(find lib -name '*.rb'); do ruby -c "$f"; done
