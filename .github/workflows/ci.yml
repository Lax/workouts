name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  workflow-lint:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Lint GitHub Actions workflows
        uses: raven-actions/actionlint@v2
        with:
          # shellcheck off: repo scripts are not shellcheck-clean (SC2086 style).
          # Empty-option lint ignored via .github/actionlint.yml.
          shellcheck: false

  test-import-action:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: .github/git-fit-actions/import
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .github/git-fit-actions/import/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Check dist is up to date
        run: npm run build:check

  ruby-test:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}

    strategy:
      matrix:
        ruby-version: ["3.4"]

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      - name: Run tests
        run: bundle exec rspec

      - name: Check syntax
        run: |
          ruby -c lib/workouts.rb
          for f in $(find lib -name '*.rb'); do ruby -c "$f"; done
