name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ruby-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        ruby-version: ["3.4"]

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      - name: Run tests
        run: bundle exec rspec

      - name: Check syntax
        run: |
          ruby -c lib/workouts.rb
          for f in $(find lib -name '*.rb'); do ruby -c "$f"; done

  frontend-e2e:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Biome lint + format check
        run: npx biome ci .

      - name: Vitest unit tests
        run: npx vitest run
        working-directory: packages/web

      - name: Build frontend
        run: npm run build
        env:
          VITE__MAPBOX__TOKEN: ${{ secrets.MAPBOX_TOKEN }}

      # ── Playwright browser cache (GitHub runner) ──
      - id: playwright-cache
        if: vars.RUNNER_LABEL != 'self-hosted'
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('packages/web/package.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true' && vars.RUNNER_LABEL != 'self-hosted'
        run: npx playwright install --with-deps chromium
        working-directory: packages/web

      - uses: actions/cache/save@v4
        if: steps.playwright-cache.outputs.cache-hit != 'true' && vars.RUNNER_LABEL != 'self-hosted'
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}

      - name: Run Playwright E2E tests
        run: npx playwright test
        working-directory: packages/web
