name: "[DB] Dangerous purge activity"

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "run_id to delete (e.g. keep_9223370467197600022)"
        required: true
        type: string
      dry_run:
        description: "Dry-run (preview only, no DELETE)"
        required: false
        type: boolean
        default: true
      confirm:
        description: 'Type "DELETE" to confirm destructive delete'
        required: true
        type: string
        default: ""

concurrency:
  group: workouts-db
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

env:
  GIT_FIT_DATABASE_PATH: ${{ vars.GIT_FIT_DATABASE_PATH || 'data/db/workouts.db' }}

jobs:
  purge:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: "[db] Derive database paths"
        id: db-paths
        uses: git-fit-actions/db-store/paths@v1
        with:
          database-path: ${{ env.GIT_FIT_DATABASE_PATH }}

      - name: "[db] Restore cache"
        id: db-restore
        uses: git-fit-actions/db-store/cache/restore@v1
        with:
          db-dir: ${{ steps.db-paths.outputs.dir }}
          db-name: ${{ steps.db-paths.outputs.name }}
          git-restore-mode: fallback
          git-branch: GitFit/db

      - name: Guard confirm
        shell: bash
        run: |
          if [ "${{ inputs.confirm }}" != "DELETE" ]; then
            echo "::error::Must type DELETE to confirm. Got: ${{ inputs.confirm }}"
            exit 1
          fi
          echo "confirm ok (run_id=${{ inputs.run_id }} dry_run=${{ inputs.dry_run }})"

      # Always preview the target row; RecordNotFound fails fast here.
      - name: Preview target (dry-run)
        shell: bash
        env:
          RUN_ID: ${{ inputs.run_id }}
        run: bundle exec git fit purge activity "$RUN_ID" --dry-run

      - name: Purge activity
        id: purge
        if: inputs.dry_run == false
        shell: bash
        env:
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -o pipefail
          bundle exec git fit purge activity "$RUN_ID" | tee purge.out
          n=$(grep -oE 'Removed [0-9]+' purge.out | grep -oE '[0-9]+' || echo 0)
          echo "deleted=$n" >> "$GITHUB_OUTPUT"
          echo "deleted=$n"

      # ── DB save (cache-only) ──
      - name: "[db] Save cache"
        if: always()
        uses: git-fit-actions/db-store/cache/save@v1
        with:
          db-dir: ${{ steps.db-paths.outputs.dir }}
          db-name: ${{ steps.db-paths.outputs.name }}
          save-to-git-branch: false

      - name: Trigger gh-pages
        if: success() && steps.purge.outputs.deleted != '0'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run gh-pages.yml --ref ${{ github.ref_name }}

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "### Dangerous purge activity \`${{ inputs.run_id }}\` ${{ inputs.dry_run == true && 'dry-run' || 'LIVE' }}: deleted=${{ steps.purge.outputs.deleted || '0' }}" >> "$GITHUB_STEP_SUMMARY"
