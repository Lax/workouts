name: "[DB] Dangerous purge activity"

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "run_id to delete (e.g. keep_9223370467197600022)"
        required: true
        type: string
      dry_run:
        description: "Dry-run (preview only, no DELETE)"
        required: false
        type: boolean
        default: true
      delete_raw:
        description: "Also delete data/raw/{source}/{id}.* (v0.17.1)"
        required: false
        type: boolean
        default: false
      delete_std:
        description: "Also delete data/std/{source}/{id}.json (v0.17.1)"
        required: false
        type: boolean
        default: false
      confirm:
        description: 'Type "DELETE" to confirm destructive delete'
        required: true
        type: string
        default: ""

concurrency:
  group: workouts-db
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

env:
  GIT_FIT_DATABASE_PATH: ${{ vars.GIT_FIT_DATABASE_PATH || 'data/db/workouts.db' }}

jobs:
  purge:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: "[db] Derive database paths"
        id: db-paths
        uses: git-fit-actions/db-store/paths@v1
        with:
          database-path: ${{ env.GIT_FIT_DATABASE_PATH }}

      - name: "[db] Restore cache"
        id: db-restore
        uses: git-fit-actions/db-store/cache/restore@v1
        with:
          db-dir: ${{ steps.db-paths.outputs.dir }}
          db-name: ${{ steps.db-paths.outputs.name }}
          git-restore-mode: fallback
          git-branch: GitFit/db

      - name: "[data] Derive source + build flags"
        id: meta
        shell: bash
        env:
          RUN_ID: ${{ inputs.run_id }}
          DELETE_RAW: ${{ inputs.delete_raw }}
          DELETE_STD: ${{ inputs.delete_std }}
        run: |
          rid="$RUN_ID"
          if [[ "$rid" == garmin_cn_* ]]; then
            src=garmin_cn
          else
            src="${rid%%_*}"
          fi
          echo "source=$src" >> "$GITHUB_OUTPUT"
          flags=""
          [ "$DELETE_RAW" = "true" ] && flags="$flags --delete-raw"
          [ "$DELETE_STD" = "true" ] && flags="$flags --delete-std"
          # trim leading space
          flags="${flags# }"
          echo "flags=$flags" >> "$GITHUB_OUTPUT"
          echo "derived source=$src flags='$flags'"
          if [ "$DELETE_RAW" = "true" ] || [ "$DELETE_STD" = "true" ]; then
            case "$src" in
              keep|igpsport|xoss|xingzhe|garmin|garmin_cn|strava) ;;
              *) echo "::error::delete flags require source in [keep,igpsport,xoss,xingzhe,garmin,garmin_cn,strava]; derived '$src' from run_id='$rid' is invalid" >&2; exit 1 ;;
            esac
          fi

      - name: "[data] Restore cache"
        if: inputs.delete_raw == true || inputs.delete_std == true
        uses: git-fit-actions/data-store/cache/restore@v2
        with:
          sources: ${{ steps.meta.outputs.source }}

      - name: Guard confirm
        shell: bash
        run: |
          if [ "${{ inputs.confirm }}" != "DELETE" ]; then
            echo "::error::Must type DELETE to confirm. Got: ${{ inputs.confirm }}"
            exit 1
          fi
          echo "confirm ok (run_id=${{ inputs.run_id }} dry_run=${{ inputs.dry_run }} delete_raw=${{ inputs.delete_raw }} delete_std=${{ inputs.delete_std }})"

      - name: "[db] Dump full record"
        id: dump
        shell: bash
        env:
          DB_PATH: ${{ steps.db-paths.outputs.db-path }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          bundle exec ruby -e '
            require "sequel"
            require "json"
            db = Sequel.sqlite(ENV.fetch("DB_PATH"))
            row = db[:activities].where(run_id: ENV.fetch("RUN_ID")).first
            abort "::error::Not found: #{ENV["RUN_ID"]}" unless row
            File.write("purge-record.json", JSON.pretty_generate(row))
          '
          {
            echo "### Full DB record \`${{ inputs.run_id }}\`"
            echo '\''```json'\''
            cat purge-record.json
            echo '\''```'\''
          } >> "$GITHUB_STEP_SUMMARY"

      # Always preview the target row + files; RecordNotFound / invalid source fails fast here.
      - name: Preview target (dry-run)
        shell: bash
        env:
          RUN_ID: ${{ inputs.run_id }}
          FLAGS: ${{ steps.meta.outputs.flags }}
        run: |
          set -o pipefail
          bundle exec git fit purge activity "$RUN_ID" --dry-run $FLAGS | tee preview.out

      - name: Purge activity
        id: purge
        if: inputs.dry_run == false
        shell: bash
        env:
          RUN_ID: ${{ inputs.run_id }}
          FLAGS: ${{ steps.meta.outputs.flags }}
        run: |
          set -o pipefail
          bundle exec git fit purge activity "$RUN_ID" $FLAGS | tee purge.out
          n=$(grep -oE 'Removed [0-9]+' purge.out | grep -oE '[0-9]+' || echo 0)
          echo "deleted=$n" >> "$GITHUB_OUTPUT"
          echo "deleted=$n"

      # ── DB save (cache-only) ──
      - name: "[db] Save cache"
        if: always()
        uses: git-fit-actions/db-store/cache/save@v1
        with:
          db-dir: ${{ steps.db-paths.outputs.dir }}
          db-name: ${{ steps.db-paths.outputs.name }}
          save-to-git-branch: false

      - name: "[data] Save cache"
        if: success() && inputs.dry_run == false && (inputs.delete_raw == true || inputs.delete_std == true)
        uses: git-fit-actions/data-store/cache/save@v2
        with:
          sources: ${{ steps.meta.outputs.source }}

      - name: Trigger gh-pages
        if: success() && steps.purge.outputs.deleted != '0'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run gh-pages.yml --ref ${{ github.ref_name }}

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "### Dangerous purge activity \`${{ inputs.run_id }}\` ${{ inputs.dry_run == true && 'dry-run' || 'LIVE' }}: deleted=${{ steps.purge.outputs.deleted || '0' }} ${{ steps.meta.outputs.flags && format('flags={0}', steps.meta.outputs.flags) || '' }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f purge-record.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat purge-record.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          for f in preview.out purge.out; do
            if [ -s "$f" ] && grep -qE 'Would delete|Removed|No (raw|std) files' "$f"; then
              echo "#### $f" >> "$GITHUB_STEP_SUMMARY"
              grep -E 'Would delete|Removed|No (raw|std) files' "$f" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
