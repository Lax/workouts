name: Sync activities
description: Restore token caches, run git fit sync, save token caches

runs:
  using: composite
  steps:
    - name: Restore token caches
      uses: ./.github/actions/tokens-cache/restore

    - name: Run sync
      shell: bash
      env:
        GIT_FIT_SYNC_TIME_BUDGET: ${{ vars.SYNC_TIME_BUDGET || '' }}
        GIT_FIT_SYNC_TOTAL_TIMEOUT: ${{ vars.SYNC_TOTAL_TIMEOUT || '' }}
        GIT_FIT_GARMIN_AUTH_SEED: ${{ secrets.SYNC_GARMIN_AUTH_SEED }}
        GIT_FIT_GARMIN_TOKEN_PATH: data/auth/garmin_garmin_com_tokens.json
        GIT_FIT_GARMIN_CN_TOKEN_PATH: data/auth/garmin_garmin_cn_tokens.json
        GIT_FIT_GARMIN_CN_SECRET: ${{ secrets.SYNC_GARMIN_CN_SECRET }}
        GIT_FIT_XOSS_EMAIL: ${{ secrets.SYNC_XOSS_EMAIL }}
        GIT_FIT_XOSS_PASSWORD: ${{ secrets.SYNC_XOSS_PASSWORD }}
        GIT_FIT_XOSS_TOKEN_PATH: data/auth/xoss_tokens.json
        GIT_FIT_XINGZHE_EMAIL: ${{ secrets.SYNC_XINGZHE_EMAIL }}
        GIT_FIT_XINGZHE_PASSWORD: ${{ secrets.SYNC_XINGZHE_PASSWORD }}
        GIT_FIT_KEEP_PHONE: ${{ secrets.SYNC_KEEP_PHONE }}
        GIT_FIT_KEEP_PASSWORD: ${{ secrets.SYNC_KEEP_PASSWORD }}
        GIT_FIT_IGPSPORT_PHONE: ${{ secrets.SYNC_IGPSPORT_PHONE }}
        GIT_FIT_IGPSPORT_PASSWORD: ${{ secrets.SYNC_IGPSPORT_PASSWORD }}
        GIT_FIT_STRAVA_CLIENT_ID: ${{ secrets.SYNC_STRAVA_CLIENT_ID }}
        GIT_FIT_STRAVA_CLIENT_SECRET: ${{ secrets.SYNC_STRAVA_CLIENT_SECRET }}
        GIT_FIT_STRAVA_REFRESH_TOKEN: ${{ secrets.SYNC_STRAVA_REFRESH_TOKEN }}
        GIT_FIT_DATABASE_PATH: data/workouts.db
      run: bundle exec git fit sync

    - name: Save token caches
      if: always()
      uses: ./.github/actions/tokens-cache/save
