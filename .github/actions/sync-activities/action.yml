name: Sync activities
description: Restore token caches, run git fit sync, save token caches

inputs:
  sync-time-budget:
    description: Sync time budget
    required: false
    default: ''
  sync-total-timeout:
    description: Sync total timeout
    required: false
    default: ''
  garmin-auth-seed:
    description: Garmin auth seed
    required: true
  garmin-cn-secret:
    description: Garmin CN secret
    required: true
  xoss-email:
    description: XOSS email
    required: true
  xoss-password:
    description: XOSS password
    required: true
  xingzhe-email:
    description: XingZhe email
    required: true
  xingzhe-password:
    description: XingZhe password
    required: true
  keep-phone:
    description: Keep phone
    required: true
  keep-password:
    description: Keep password
    required: true
  igpsport-phone:
    description: iGPSPORT phone
    required: true
  igpsport-password:
    description: iGPSPORT password
    required: true
  strava-client-id:
    description: Strava client ID
    required: true
  strava-client-secret:
    description: Strava client secret
    required: true
  strava-refresh-token:
    description: Strava refresh token
    required: true
  strava-web-auth-seed:
    description: Strava web auth JWT seed (base64) for original file fetch
    required: false
    default: ''
  codoon-phone:
    description: Codoon phone
    required: false
    default: ''
  codoon-password:
    description: Codoon password
    required: false
    default: ''
  joyrun-uid:
    description: Joyrun uid (from `git fit auth joyrun`)
    required: false
    default: ''
  joyrun-sid:
    description: Joyrun sid (from `git fit auth joyrun`)
    required: false
    default: ''
  timezone:
    description: Git-Fit framework timezone (system.timezone) for display formatting
    required: false
    default: Asia/Shanghai
  db-path:
    description: SQLite database path
    required: false
    default: data/db/workouts.db

runs:
  using: composite
  steps:
    - name: Restore token caches
      uses: actions/cache/restore@v6.1.0
      with:
        path: data/auth/garmin_cn
        key: tokens-v0-garmin_cn-auth-${{ github.run_id }}
        restore-keys: tokens-v0-garmin_cn-auth-

    - name: Restore Garmin Intl token caches
      uses: actions/cache/restore@v6.1.0
      with:
        path: data/auth/garmin
        key: tokens-v0-garmin-auth-${{ github.run_id }}
        restore-keys: tokens-v0-garmin-auth-

    - name: Restore XOSS token caches
      uses: actions/cache/restore@v6.1.0
      with:
        path: data/auth/xoss
        key: tokens-v0-xoss-auth-${{ github.run_id }}
        restore-keys: tokens-v0-xoss-auth-

    - name: Restore XingZhe session cache
      uses: actions/cache/restore@v6.1.0
      with:
        path: data/auth/xingzhe
        key: tokens-v0-xingzhe-auth-${{ github.run_id }}
        restore-keys: tokens-v0-xingzhe-auth-

    - name: Restore Strava web session cache
      uses: actions/cache/restore@v6.1.0
      with:
        path: data/auth/strava
        key: tokens-v0-strava-web-auth-${{ github.run_id }}
        restore-keys: tokens-v0-strava-web-auth-

    - name: Run sync
      shell: bash
      env:
        GIT_FIT_SYNC_TIME_BUDGET: ${{ inputs.sync-time-budget }}
        GIT_FIT_SYNC_TOTAL_TIMEOUT: ${{ inputs.sync-total-timeout }}
        GIT_FIT_GARMIN_AUTH_SEED: ${{ inputs.garmin-auth-seed }}
        GIT_FIT_GARMIN_CN_SECRET: ${{ inputs.garmin-cn-secret }}
        GIT_FIT_XOSS_EMAIL: ${{ inputs.xoss-email }}
        GIT_FIT_XOSS_PASSWORD: ${{ inputs.xoss-password }}
        GIT_FIT_XINGZHE_EMAIL: ${{ inputs.xingzhe-email }}
        GIT_FIT_XINGZHE_PASSWORD: ${{ inputs.xingzhe-password }}
        GIT_FIT_KEEP_PHONE: ${{ inputs.keep-phone }}
        GIT_FIT_KEEP_PASSWORD: ${{ inputs.keep-password }}
        GIT_FIT_IGPSPORT_PHONE: ${{ inputs.igpsport-phone }}
        GIT_FIT_IGPSPORT_PASSWORD: ${{ inputs.igpsport-password }}
        GIT_FIT_STRAVA_CLIENT_ID: ${{ inputs.strava-client-id }}
        GIT_FIT_STRAVA_CLIENT_SECRET: ${{ inputs.strava-client-secret }}
        GIT_FIT_STRAVA_REFRESH_TOKEN: ${{ inputs.strava-refresh-token }}
        GIT_FIT_CODOON_PHONE: ${{ inputs.codoon-phone }}
        GIT_FIT_CODOON_PASSWORD: ${{ inputs.codoon-password }}
        GIT_FIT_JOYRUN_UID: ${{ inputs.joyrun-uid }}
        GIT_FIT_JOYRUN_SID: ${{ inputs.joyrun-sid }}
        GIT_FIT_DATABASE_PATH: ${{ inputs.db-path }}
      run: bundle exec git fit sync

    - name: Fetch Strava original files
      continue-on-error: true
      shell: bash
      env:
        GIT_FIT_STRAVA_WEB_AUTH_AUTH_SEED: ${{ inputs.strava-web-auth-seed }}
        GIT_FIT_DATABASE_PATH: ${{ inputs.db-path }}
        GIT_FIT_SYSTEM_TIMEZONE: ${{ inputs.timezone }}
      run: bundle exec git fit strava fetch --limit 10

    - name: Save Garmin Intl token caches
      if: always()
      uses: actions/cache/save@v6.1.0
      with:
        path: data/auth/garmin
        key: tokens-v0-garmin-auth-${{ github.run_id }}

    - name: Save Garmin CN token caches
      if: always()
      uses: actions/cache/save@v6.1.0
      with:
        path: data/auth/garmin_cn
        key: tokens-v0-garmin_cn-auth-${{ github.run_id }}

    - name: Save Strava web session cache
      if: always()
      uses: actions/cache/save@v6.1.0
      with:
        path: data/auth/strava
        key: tokens-v0-strava-web-auth-${{ github.run_id }}

    - name: Save XingZhe session cache
      if: always()
      uses: actions/cache/save@v6.1.0
      with:
        path: data/auth/xingzhe
        key: tokens-v0-xingzhe-auth-${{ github.run_id }}

    - name: Save XOSS token caches
      if: always()
      uses: actions/cache/save@v6.1.0
      with:
        path: data/auth/xoss
        key: tokens-v0-xoss-auth-${{ github.run_id }}
