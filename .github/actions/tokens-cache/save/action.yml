name: Tokens Cache Save
description: Save Garmin/Garmin CN/XOSS token caches
runs:
  using: composite
  steps:
    - name: Save Garmin Intl tokens (auth-only)
      uses: actions/cache/save@v6.1.0
      if: always()
      with:
        path: data/auth/garmin
        key: tokens-v0-garmin-auth-${{ github.run_id }}

    - name: Save Garmin CN tokens (auth-only)
      uses: actions/cache/save@v6.1.0
      if: always()
      with:
        path: data/auth/garmin_cn
        key: tokens-v0-garmin_cn-auth-${{ github.run_id }}

    - name: Save Strava web session
      uses: actions/cache/save@v6.1.0
      if: always()
      with:
        path: data/auth/strava
        key: tokens-v0-strava-web-auth-${{ github.run_id }}

    - name: Save XingZhe session
      uses: actions/cache/save@v6.1.0
      if: always()
      with:
        path: data/auth/xingzhe
        key: tokens-v0-xingzhe-auth-${{ github.run_id }}

    - name: Save XOSS tokens (auth-only)
      uses: actions/cache/save@v6.1.0
      if: always()
      with:
        path: data/auth/xoss
        key: tokens-v0-xoss-auth-${{ github.run_id }}
