name: Tokens Cache Restore
description: Restore Garmin/Garmin CN/XOSS token caches
outputs:
  restored:
    description: "true if any token cache was restored from GitHub Actions cache"
    value: ${{ steps.check-restored.outputs.restored }}
runs:
  using: composite
  steps:
    - id: restore-garmin-cn
      uses: actions/cache/restore@v6.1.0
      with:
        path: data/auth/garmin_cn
        key: tokens-v0-garmin_cn-auth-${{ github.run_id }}
        restore-keys: tokens-v0-garmin_cn-auth-

    - id: restore-garmin-intl-auth
      uses: actions/cache/restore@v6.1.0
      with:
        path: data/auth/garmin
        key: tokens-v0-garmin-auth-${{ github.run_id }}
        restore-keys: tokens-v0-garmin-auth-

    - id: restore-xoss
      uses: actions/cache/restore@v6.1.0
      with:
        path: data/auth/xoss
        key: tokens-v0-xoss-auth-${{ github.run_id }}
        restore-keys: tokens-v0-xoss-auth-

    - id: restore-xingzhe-session
      uses: actions/cache/restore@v6.1.0
      with:
        path: data/auth/xingzhe
        key: tokens-v0-xingzhe-auth-${{ github.run_id }}
        restore-keys: tokens-v0-xingzhe-auth-

    - id: restore-strava-web
      uses: actions/cache/restore@v6.1.0
      with:
        path: data/auth/strava
        key: tokens-v0-strava-web-auth-${{ github.run_id }}
        restore-keys: tokens-v0-strava-web-auth-

    - id: check-restored
      shell: bash
      run: |
        hit=false
        if [ "${{ steps.restore-garmin-cn.outputs.cache-hit }}" = "true" ]; then
          hit=true
        elif [ "${{ steps.restore-garmin-intl-auth.outputs.cache-hit }}" = "true" ]; then
          hit=true
        elif [ "${{ steps.restore-xoss.outputs.cache-hit }}" = "true" ]; then
          hit=true
        elif [ "${{ steps.restore-xingzhe-session.outputs.cache-hit }}" = "true" ]; then
          hit=true
        elif [ "${{ steps.restore-strava-web.outputs.cache-hit }}" = "true" ]; then
          hit=true
        fi
        echo "restored=$hit" >> $GITHUB_OUTPUT
