name: Probe Self Delete
on:
  workflow_dispatch:

jobs:
  delete-self:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      contents: write
    steps:
      - name: Delete self
        shell: bash
        env:
          PAT_TOKEN: ${{ secrets.WORKOUTS_SYNC_PAT }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          API="${GITHUB_API_URL:-https://api.github.com}"
          REPO="${GITHUB_REPOSITORY}"
          AUTH="Authorization: Bearer ${PAT_TOKEN}"
          FILE=$(echo "$GITHUB_WORKFLOW_REF" | sed 's|^[^/]*/[^/]*/||;s|@.*||')
          echo "Deleting self: ${FILE}" >&2
          RESP=$(curl -s -H "$AUTH" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API}/repos/${REPO}/contents/${FILE}")
          SHA=$(echo "$RESP" | sed -n 's/.*"sha"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | head -1)
          if [ -z "$SHA" ]; then
            echo "Error: cannot find SHA for ${FILE}" >&2
            echo "$RESP" >&2
            exit 1
          fi
          DELETE_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X DELETE -H "$AUTH" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            "${API}/repos/${REPO}/contents/${FILE}?sha=${SHA}" \
            -d "{\"message\":\"delete self: ${FILE} [skip ci]\"}")
          echo "self_delete_http=${DELETE_CODE}" >&2
          if [ "$DELETE_CODE" != "200" ]; then
            echo "Self-delete failed" >&2
            exit 1
          fi
          echo "Self-deleted: ${FILE}" >&2
