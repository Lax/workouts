name: Probe PAT permissions
description: Probe PAT permissions via variables API and contents/workflow API

inputs:
  pat_token:
    description: PAT to probe
    required: true

outputs:
  has_variables_write:
    description: Whether PAT has variables:write permission
    value: ${{ steps.aggregate.outputs.has_variables_write }}
  has_contents_write:
    description: Whether PAT has contents:write permission
    value: ${{ steps.aggregate.outputs.has_contents_write }}
  has_workflows_write:
    description: Whether PAT has workflows:write permission
    value: ${{ steps.aggregate.outputs.has_workflows_write }}
  has_actions_write:
    description: Whether PAT has actions:write permission
    value: ${{ steps.aggregate.outputs.has_actions_write }}

runs:
  using: composite
  steps:
    - name: Probe variables:write
      id: variables
      shell: bash
      env:
        PAT_TOKEN: ${{ inputs.pat_token }}
        GITHUB_API_URL: ${{ github.api_url }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_RUN_ID: ${{ github.run_id }}
        GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
      run: |
        set -euo pipefail
        API="${GITHUB_API_URL:-https://api.github.com}"
        REPO="${GITHUB_REPOSITORY}"
        AUTH="Authorization: Bearer ${PAT_TOKEN}"
        RUN_ID="${GITHUB_RUN_ID}"
        ATTEMPT="${GITHUB_RUN_ATTEMPT}"

        TEST_VAR="__pat_probe__"
        VAR_VALUE="${RUN_ID}-${ATTEMPT}"
        VAR_HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
          -X POST -H "$AUTH" \
          -H "Accept: application/vnd.github+json" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          "${API}/repos/${REPO}/actions/variables" \
          -d "{\"name\":\"${TEST_VAR}\",\"value\":\"${VAR_VALUE}\"}" 2>/dev/null || echo "000")

        curl -s -o /dev/null -w "%{http_code}" \
          -X DELETE -H "$AUTH" \
          "${API}/repos/${REPO}/actions/variables/${TEST_VAR}" 2>/dev/null || true

        HAS_VARIABLES="false"
        [ "$VAR_HTTP" = "201" ] && HAS_VARIABLES="true"

        echo "has_variables_write=${HAS_VARIABLES}" >> $GITHUB_OUTPUT

    - name: Create probe workflow
      id: create
      shell: bash
      env:
        PAT_TOKEN: ${{ inputs.pat_token }}
        GITHUB_API_URL: ${{ github.api_url }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_RUN_ID: ${{ github.run_id }}
        GITHUB_JOB: ${{ github.job }}
      run: |
        set -euo pipefail
        API="${GITHUB_API_URL:-https://api.github.com}"
        REPO="${GITHUB_REPOSITORY}"
        AUTH="Authorization: Bearer ${PAT_TOKEN}"
        RUN_ID="${GITHUB_RUN_ID}"
        JOB="${GITHUB_JOB}"

        TEMPLATE_FILE=".github/actions/probe-pat-permissions/template.yml"
        if [ ! -f "$TEMPLATE_FILE" ]; then
          echo "Error: template file not found: ${TEMPLATE_FILE}" >&2
          exit 1
        fi
        PROBE_CONTENT=$(base64 -w0 "$TEMPLATE_FILE")

        PROBE_FILE=".github/workflows/probe-pat-${RUN_ID}-${JOB}.yml"
        HEADERS=$(mktemp)
        CONT_HTTP=$(curl -s -o /tmp/_probe_resp.json -D "$HEADERS" -w "%{http_code}" \
          -X PUT -H "$AUTH" \
          -H "Accept: application/vnd.github+json" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          "${API}/repos/${REPO}/contents/${PROBE_FILE}" \
          -d "{\"message\":\"permission probe [skip ci]\",\"content\":\"${PROBE_CONTENT}\"}" 2>/dev/null || echo "000")

        PERM_LIST=$(grep -i '^x-accepted-github-permissions:' "$HEADERS" | head -1 | sed 's/^[^:]*: //' | tr -d '\r\n')
        rm -f "$HEADERS"

        HAS_CONTENTS="false"
        HAS_WORKFLOWS="false"
        if [ -n "$PERM_LIST" ]; then
          LAST_SCOPE=$(echo "$PERM_LIST" | awk -F';' '{print $NF}' | sed 's/^ *//;s/ *$//')
          echo "$LAST_SCOPE" | grep -qi 'contents=write' && HAS_CONTENTS="true"
          echo "$LAST_SCOPE" | grep -qi 'workflows' && HAS_WORKFLOWS="true"
        fi

        echo "has_contents_write=${HAS_CONTENTS}" >> $GITHUB_OUTPUT
        echo "has_workflows_write=${HAS_WORKFLOWS}" >> $GITHUB_OUTPUT
        echo "probe_file=${PROBE_FILE}" >> $GITHUB_OUTPUT

    - name: Execute probe workflow
      id: dispatch
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.pat_token }}
        GITHUB_API_URL: ${{ github.api_url }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        PROBE_FILE: ${{ steps.create.outputs.probe_file }}
      run: |
        set -euo pipefail
        API="${GITHUB_API_URL:-https://api.github.com}"
        REPO="${GITHUB_REPOSITORY}"
        AUTH="Authorization: Bearer ${GH_TOKEN}"
        ENCODED_PATH=$(echo "${PROBE_FILE}" | sed 's|/|%2F|g')
        echo "Dispatching probe workflow: ${PROBE_FILE}" >&2

        for i in $(seq 1 12); do
          echo "Attempt ${i}: checking workflow registration..." >&2
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "$AUTH" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API}/repos/${REPO}/actions/workflows/${ENCODED_PATH}" 2>/dev/null || echo "000")

          if [ "$HTTP_CODE" = "200" ]; then
            echo "Workflow registered, dispatching..." >&2
            DISPATCH_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST -H "$AUTH" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${API}/repos/${REPO}/actions/workflows/${ENCODED_PATH}/dispatches" \
              -d "{\"ref\":\"main\"}" 2>/dev/null || echo "000")
            echo "has_actions_write=${DISPATCH_CODE}" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Workflow not yet registered (HTTP ${HTTP_CODE}), waiting 5s..." >&2
          sleep 5
        done

        echo "Workflow did not register within 60s" >&2
        echo "has_actions_write=000" >> $GITHUB_OUTPUT
        exit 1

    - name: Aggregate results
      id: aggregate
      shell: bash
      env:
        HAS_VARIABLES: ${{ steps.variables.outputs.has_variables_write }}
        HAS_CONTENTS: ${{ steps.create.outputs.has_contents_write }}
        HAS_WORKFLOWS: ${{ steps.create.outputs.has_workflows_write }}
        HAS_ACTIONS: ${{ steps.dispatch.outputs.has_actions_write }}
      run: |
        set -euo pipefail

        echo "has_variables_write=${HAS_VARIABLES}" >> $GITHUB_OUTPUT
        echo "has_contents_write=${HAS_CONTENTS}" >> $GITHUB_OUTPUT
        echo "has_workflows_write=${HAS_WORKFLOWS}" >> $GITHUB_OUTPUT
        echo "has_actions_write=${HAS_ACTIONS}" >> $GITHUB_OUTPUT
