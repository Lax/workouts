name: Import Apple Health
description: >
  Preflight checks (branch + blob existence), detect change
  (.modified-at + SHA256SUMS), then import via LFS smudge.

inputs:
  branch:
    description: Git branch storing export.zip
    required: false
    default: _/import/apple_health
  dir:
    description: Local directory for import data
    required: false
    default: data/import/apple_health
  remote:
    description: Remote tracking ref
    required: false
    default: origin/_/import/apple_health
  cache-key:
    description: Cache key for state markers
    required: false
    default: import-apple-health-v1-detect
  db-path:
    description: SQLite database path
    required: false
    default: data/workouts.db
  git-configured:
    description: Whether git push auth is configured
    required: true

outputs:
  skip:
    description: Whether the import was skipped
    value: ${{ steps.detect.outputs.skip }}
  reason:
    description: Reason for skipping
    value: ${{ steps.detect.outputs.reason }}

runs:
  using: composite
  steps:
    - name: Preflight
      id: preflight
      shell: bash
      env:
        AH_BRANCH: ${{ inputs.branch }}
        AH_DIR: ${{ inputs.dir }}
        AH_REMOTE: ${{ inputs.remote }}
      run: |
        if ! git ls-remote --exit-code origin "refs/heads/$AH_BRANCH" >/dev/null 2>&1; then
          echo "No apple_health branch — skip import" >&2
          echo "skip=true" >> $GITHUB_OUTPUT
          echo "reason=no-branch" >> $GITHUB_OUTPUT
          exit 0
        fi

        git fetch origin "+refs/heads/$AH_BRANCH:refs/remotes/$AH_REMOTE"
        echo "Fetched $AH_BRANCH" >&2

        modified_sha=$(git log --format=%H -1 "$AH_REMOTE" -- "$AH_DIR/export.zip")
        if [ -z "$modified_sha" ]; then
          echo "export.zip not found in branch — skip" >&2
          echo "skip=true" >> $GITHUB_OUTPUT
          echo "reason=export-zip-missing" >> $GITHUB_OUTPUT
          exit 0
        fi

        if ! git cat-file -e "$modified_sha:$AH_DIR/export.zip" 2>/dev/null; then
          echo "Blob missing at ${modified_sha:0:7} — deleted in git history, skipping" >&2
          echo "skip=true" >> $GITHUB_OUTPUT
          echo "reason=export-zip-deleted" >> $GITHUB_OUTPUT
          exit 0
        fi

        echo "export.zip at ${modified_sha:0:7}" >&2
        echo "skip=false" >> $GITHUB_OUTPUT
        echo "modified_sha=$modified_sha" >> $GITHUB_OUTPUT

    - name: Restore cache
      id: cache
      if: steps.preflight.outputs.skip != 'true'
      uses: actions/cache@v4
      with:
        path: |
          ${{ inputs.dir }}/export.zip.SHA256SUMS
          ${{ inputs.dir }}/.modified-at
        key: ${{ inputs.cache-key }}

    - name: Detect change
      id: detect
      if: steps.preflight.outputs.skip != 'true'
      shell: bash
      env:
        AH_BRANCH: ${{ inputs.branch }}
        AH_DIR: ${{ inputs.dir }}
        AH_REMOTE: ${{ inputs.remote }}
      run: |
        modified_sha="${{ steps.preflight.outputs.modified_sha }}"

        if [ "${{ steps.cache.outputs.cache-hit }}" = "true" ]; then
          echo "[cache] .modified-at + export.zip.SHA256SUMS restored" >&2
        else
          echo "[cache] No cache hit — fresh start" >&2
        fi

        cached_sha=$(cat "$AH_DIR/.modified-at" 2>/dev/null || echo "")
        if [ "$modified_sha" = "$cached_sha" ]; then
          echo "export.zip unchanged at ${modified_sha:0:7} — skip" >&2
          echo "skip=true" >> $GITHUB_OUTPUT
          echo "reason=unchanged" >> $GITHUB_OUTPUT
          exit 0
        fi

        if git show "$AH_REMOTE:$AH_DIR/export.zip.SHA256SUMS" > "$RUNNER_TEMP/apple-health.sha256" 2>/dev/null; then
          if [ -f "$AH_DIR/export.zip.SHA256SUMS" ] && cmp -s "$RUNNER_TEMP/apple-health.sha256" "$AH_DIR/export.zip.SHA256SUMS"; then
            echo "SHA256 match — commit ID changed (${cached_sha:0:7} → ${modified_sha:0:7}) but content unchanged, skip" >&2
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "reason=sha256-match" >> $GITHUB_OUTPUT
            exit 0
          fi
        fi

        echo "skip=false" >> $GITHUB_OUTPUT
        if [ -z "$cached_sha" ]; then
          echo "First import — ${modified_sha:0:7}" >&2
        else
          echo "export.zip changed — ${cached_sha:0:7} → ${modified_sha:0:7}" >&2
        fi

    - name: Download export.zip
      id: download
      if: steps.detect.outputs.skip == 'false' && inputs.git-configured == 'true'
      shell: bash
      env:
        AH_BRANCH: ${{ inputs.branch }}
        AH_DIR: ${{ inputs.dir }}
        AH_REMOTE: ${{ inputs.remote }}
      run: |
        mkdir -p "$AH_DIR"
        git lfs install

        echo "[download] Fetching export.zip from HEAD..." >&2
        git show "$AH_REMOTE:$AH_DIR/export.zip" \
          | git lfs smudge > "$AH_DIR/export.zip"

        size=$(stat -c%s "$AH_DIR/export.zip" 2>/dev/null \
          || stat -f%z "$AH_DIR/export.zip" 2>/dev/null)
        echo "[download] Downloaded ${size} bytes" >&2

        file "$AH_DIR/export.zip" | grep -qi "Zip archive" || {
          echo "[download] export.zip is not a valid zip" >&2
          exit 1
        }
        echo "[download] Validation passed" >&2

    - name: Import
      if: steps.download.conclusion == 'success'
      shell: bash
      env:
        GIT_FIT_DATABASE_PATH: ${{ inputs.db-path }}
      run: |
        echo "[import] Running git fit import apple_health..." >&2
        bundle exec git fit import apple_health

    - name: Store state
      if: steps.import.conclusion == 'success'
      shell: bash
      env:
        AH_BRANCH: ${{ inputs.branch }}
        AH_DIR: ${{ inputs.dir }}
        AH_REMOTE: ${{ inputs.remote }}
      run: |
        echo "[store] Generating SHA256SUMS..." >&2
        bash scripts/generate-checksums.sh "$AH_DIR/export.zip"

        echo "[store] Saving state to branch..." >&2
        bash scripts/append-to-branch.sh "$AH_BRANCH" \
          "$AH_DIR/export.zip.SHA256SUMS"

        git fetch origin "+refs/heads/$AH_BRANCH:refs/remotes/$AH_REMOTE"
        git log --format=%H -1 "$AH_REMOTE" -- "$AH_DIR/export.zip" \
          > "$AH_DIR/.modified-at"
        echo "[store] .modified-at updated" >&2
