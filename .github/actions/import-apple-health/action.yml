name: Import Apple Health
description: >
  Detect data-file changes via git blob id (content-addressed).
  SHA256SUMS retained for cross-cache recovery and quick checks.

inputs:
  branch:
    description: Git branch storing export.zip
    required: false
    default: GitFit/import/apple_health
  dir:
    description: Local directory for import data
    required: false
    default: data/import/apple_health
  remote:
    description: Remote tracking ref
    required: false
    default: origin/GitFit/import/apple_health
  cache-key:
    description: Cache key namespace. Current data_hash appended automatically at save.
    required: false
    default: import-apple-health-v1-detect
  db-path:
    description: SQLite database path
    required: false
    default: data/db/workouts.db
  git-configured:
    description: Whether git push auth is configured
    required: true

outputs:
  skip:
    description: Whether the import was skipped
    value: ${{ steps.detect.outputs.skip }}
  reason:
    description: Reason for skipping
    value: ${{ steps.detect.outputs.reason }}

runs:
  using: composite
  steps:
    - name: Preflight
      id: preflight
      shell: bash
      env:
        AH_BRANCH: ${{ inputs.branch }}
        AH_DIR: ${{ inputs.dir }}
        AH_REMOTE: ${{ inputs.remote }}
      run: |
        if ! git ls-remote --exit-code origin "refs/heads/$AH_BRANCH" >/dev/null 2>&1; then
          echo "No apple_health branch — skip import" >&2
          echo "skip=true" >> $GITHUB_OUTPUT
          echo "reason=no-branch" >> $GITHUB_OUTPUT
          exit 0
        fi

        git fetch origin "+refs/heads/$AH_BRANCH:refs/remotes/$AH_REMOTE"
        echo "Fetched $AH_BRANCH" >&2

        data_hash=$(git rev-parse -q --verify "$AH_REMOTE:$AH_DIR/export.zip" 2>/dev/null || echo "")
        if [ -z "$data_hash" ]; then
          echo "export.zip not found in branch — skip" >&2
          echo "skip=true" >> $GITHUB_OUTPUT
          echo "reason=export-zip-missing" >> $GITHUB_OUTPUT
          exit 0
        fi

        echo "data_hash=${data_hash:0:12}" >&2
        echo "skip=false" >> $GITHUB_OUTPUT
        echo "data_hash=$data_hash" >> $GITHUB_OUTPUT

    - name: Restore cache
      id: cache
      if: steps.preflight.outputs.skip != 'true'
      uses: actions/cache@v6.1.0
      with:
        path: |
          ${{ inputs.dir }}/export.zip.SHA256SUMS
          ${{ inputs.dir }}/.modified-at
        key: ${{ inputs.cache-key }}-${{ steps.preflight.outputs.data_hash }}
        restore-keys: ${{ inputs.cache-key }}-

    - name: Detect change
      id: detect
      if: steps.preflight.outputs.skip != 'true'
      shell: bash
      env:
        AH_DIR: ${{ inputs.dir }}
      run: |
        data_hash="${{ steps.preflight.outputs.data_hash }}"

        if [ "${{ steps.cache.outputs.cache-hit }}" = "true" ]; then
          echo "[cache] .modified-at restored" >&2
        else
          echo "[cache] No cache hit — fresh start" >&2
        fi

        cached=$(cat "$AH_DIR/.modified-at" 2>/dev/null || echo "")
        echo "cached=$cached" >> $GITHUB_OUTPUT
        if [ "$data_hash" = "$cached" ]; then
          echo "export.zip unchanged (${data_hash:0:12}) — skip" >&2
          echo "skip=true" >> $GITHUB_OUTPUT
          echo "reason=unchanged" >> $GITHUB_OUTPUT
          exit 0
        fi

        echo "skip=false" >> $GITHUB_OUTPUT
        if [ -z "$cached" ]; then
          echo "First import — ${data_hash:0:12}" >&2
        else
          echo "export.zip changed — ${cached:0:12} → ${data_hash:0:12}" >&2
        fi

    - name: Download export.zip
      id: download
      if: steps.detect.outputs.skip == 'false' && inputs.git-configured == 'true'
      shell: bash
      env:
        AH_DIR: ${{ inputs.dir }}
        AH_REMOTE: ${{ inputs.remote }}
      run: |
        mkdir -p "$AH_DIR"
        git lfs install

        echo "[download] Fetching export.zip from HEAD..." >&2
        git show "$AH_REMOTE:$AH_DIR/export.zip" \
          | git lfs smudge > "$AH_DIR/export.zip"

        size=$(stat -c%s "$AH_DIR/export.zip" 2>/dev/null \
          || stat -f%z "$AH_DIR/export.zip" 2>/dev/null)
        echo "size=$size" >> $GITHUB_OUTPUT
        echo "[download] Downloaded ${size} bytes" >&2

        file "$AH_DIR/export.zip" | grep -qi "Zip archive" || {
          echo "[download] export.zip is not a valid zip" >&2
          exit 1
        }
        echo "[download] Validation passed" >&2

    - name: Import
      id: import
      if: steps.download.conclusion == 'success'
      shell: bash
      env:
        GIT_FIT_DATABASE_PATH: ${{ inputs.db-path }}
      run: |
        echo "[import] Running git fit import apple_health..." >&2
        bundle exec git fit import apple_health

    - name: Store state
      id: store
      if: steps.import.conclusion == 'success'
      shell: bash
      env:
        AH_BRANCH: ${{ inputs.branch }}
        AH_DIR: ${{ inputs.dir }}
      run: |
        echo "[store] Generating SHA256SUMS..." >&2
        bash scripts/generate-checksums.sh "$AH_DIR/export.zip"

        echo "[store] Saving SHA256SUMS to branch..." >&2
        push_output=$(bash scripts/append-to-branch.sh "$AH_BRANCH" \
          "$AH_DIR/export.zip.SHA256SUMS" 2>&1)
        echo "$push_output" >&2
        if echo "$push_output" | grep -q "Pushed to"; then
          echo "pushed=pushed" >> $GITHUB_OUTPUT
        else
          echo "pushed=noop" >> $GITHUB_OUTPUT
        fi

        data_hash="${{ steps.preflight.outputs.data_hash }}"
        echo "$data_hash" > "$AH_DIR/.modified-at"
        echo "[store] .modified-at updated (${data_hash:0:12})" >&2

    - name: Write summary
      if: always()
      shell: bash
      run: |
        pre_skip="${{ steps.preflight.outputs.skip }}"
        det_skip="${{ steps.detect.outputs.skip }}"
        det_reason="${{ steps.detect.outputs.reason }}"
        data_hash="${{ steps.preflight.outputs.data_hash }}"
        cached="${{ steps.detect.outputs.cached }}"
        size="${{ steps.download.outputs.size }}"
        pushed="${{ steps.store.outputs.pushed }}"

        if [ "$pre_skip" = "true" ]; then
          status="skipped (preflight: ${det_reason:-unknown})"
        elif [ "$det_skip" = "true" ]; then
          status="skipped (${det_reason})"
        elif [ "${{ steps.import.conclusion }}" = "success" ]; then
          status="imported"
        elif [ "${{ steps.download.conclusion }}" = "failure" ]; then
          status="download failed"
        elif [ "${{ steps.download.conclusion }}" = "skipped" ]; then
          status="not run"
        else
          status="failed"
        fi

        {
          echo "### Apple Health import"
          echo "- Status: $status"
          echo "- data_hash: ${data_hash:0:12} (last: ${cached:0:12})"
          if [ -n "$size" ]; then echo "- Download: $size bytes"; fi
          if [ -n "$pushed" ]; then echo "- Store state: $pushed"; fi
        } >> "$GITHUB_STEP_SUMMARY"
