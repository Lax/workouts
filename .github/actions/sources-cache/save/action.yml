name: Sources Cache Save
description: Save changed source raw caches
runs:
  using: composite
  steps:
    - name: Detect changed sources
      id: detect
      shell: bash {0}
      run: |
        if [ ! -f data/.source-digests ]; then
          echo "No digest snapshot — marking all sources as changed" >&2
          for src in keep igpsport xoss xingzhe garmin garmin_cn strava; do
            echo "changed_${src}=true"
          done >> "$GITHUB_OUTPUT"
          exit 0
        fi
        while read -r src before; do
          after=$(scripts/source-digest.sh "$src")
          if [ "$before" != "$after" ]; then
            echo "  $src: CHANGED" >&2
            echo "changed_${src}=true"
          else
            echo "  $src: unchanged" >&2
            echo "changed_${src}=false"
          fi
        done < data/.source-digests >> "$GITHUB_OUTPUT"

    - name: Save — keep
      uses: actions/cache/save@v4
      if: steps.detect.outputs.changed_keep == 'true'
      with:
        path: |
          data/raw/keep/
          data/std/keep/
        key: raw-std-v1-keep-${{ github.run_id }}

    - name: Save — igpsport
      uses: actions/cache/save@v4
      if: steps.detect.outputs.changed_igpsport == 'true'
      with:
        path: |
          data/raw/igpsport/
          data/std/igpsport/
        key: raw-std-v1-igpsport-${{ github.run_id }}

    - name: Save — xoss
      uses: actions/cache/save@v4
      if: steps.detect.outputs.changed_xoss == 'true'
      with:
        path: |
          data/raw/xoss/
          data/std/xoss/
        key: raw-std-v1-xoss-${{ github.run_id }}

    - name: Save — xingzhe
      uses: actions/cache/save@v4
      if: steps.detect.outputs.changed_xingzhe == 'true'
      with:
        path: |
          data/raw/xingzhe/
          data/std/xingzhe/
        key: raw-std-v1-xingzhe-${{ github.run_id }}

    - name: Save — garmin
      uses: actions/cache/save@v4
      if: steps.detect.outputs.changed_garmin == 'true'
      with:
        path: |
          data/raw/garmin/
          data/std/garmin/
        key: raw-std-v1-garmin-${{ github.run_id }}

    - name: Save — garmin_cn
      uses: actions/cache/save@v4
      if: steps.detect.outputs.changed_garmin_cn == 'true'
      with:
        path: |
          data/raw/garmin_cn/
          data/std/garmin_cn/
        key: raw-std-v1-garmin_cn-${{ github.run_id }}

    - name: Save — strava
      uses: actions/cache/save@v4
      if: steps.detect.outputs.changed_strava == 'true'
      with:
        path: |
          data/raw/strava/
          data/std/strava/
        key: raw-std-v1-strava-${{ github.run_id }}

    - name: Source cache summary
      if: always()
      shell: bash
      run: |
        echo "=== Source digests after sync ==="
        for src in keep igpsport xoss xingzhe garmin garmin_cn strava; do
          echo "  $src: $(scripts/source-digest.sh "$src")"
        done
