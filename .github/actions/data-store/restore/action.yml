name: Data Store Restore
description: Restore data from configured store backend
inputs:
  mode:
    required: true
runs:
  using: composite
  steps:
    - uses: ./.github/actions/data-store/sources-cache/restore
      if: inputs.mode == 'cache'

    - uses: ./.github/actions/data-store/sources-git/restore
      if: inputs.mode == 'git'

    - name: Restore — flat
      if: inputs.mode == 'flat'
      shell: bash
      run: |
        echo "flat: data already in checkout, no restore needed"

    - name: Generate .checksum files
      shell: bash
      run: |
        for src in keep igpsport xoss xingzhe garmin garmin_cn strava; do
          find "data/raw/$src" "data/std/$src" -type f ! -name '.checksum' -print0 2>/dev/null \
            | sort -z | xargs -0 sha256sum > "data/raw/$src/.checksum" 2>/dev/null || true
        done
        sha256sum data/workouts.db > data/workouts.db.checksum 2>/dev/null || true
