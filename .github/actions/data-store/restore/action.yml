name: Data Store Restore
description: Restore data from configured store backend
inputs:
  shall-commit-data:
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - uses: ./.github/actions/data-store/sources-cache/restore
      if: inputs.shall-commit-data != 'true'

    - uses: ./.github/actions/data-store/sources-git/restore
      if: inputs.shall-commit-data == 'true'
      with:
        shall-commit-data: ${{ inputs.shall-commit-data }}

    - name: Generate SHA256SUMS files
      shell: bash
      run: |
        for src in keep igpsport xoss xingzhe garmin garmin_cn strava; do
          bash scripts/generate-checksums.sh "data/raw/$src" "data/std/$src"
        done
