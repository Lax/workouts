name: Data Store Save
description: Save data to configured store backend
outputs:
  any_changed:
    description: Whether any data changed
    value: ${{ steps.detect.outputs.any_changed }}
runs:
  using: composite
  steps:
    - name: Detect data changes
      id: detect
      shell: bash
      run: |
        any=false
        for src in keep igpsport xoss xingzhe garmin garmin_cn strava; do
          changed=false
          for dir in "data/raw/$src" "data/std/$src"; do
            if [ -d "$dir" ]; then
              if [ ! -f "$dir/SHA256SUMS" ]; then
                changed=true
              else
                current_hash=$(sha256sum "$dir/SHA256SUMS" | cut -d' ' -f1)
                saved_hash=$(grep " $dir$" "$RUNNER_TEMP/data-store-orig-checksums" 2>/dev/null | cut -d' ' -f1 || echo "")
                if [ "$current_hash" != "$saved_hash" ]; then
                  changed=true
                fi
              fi
            fi
          done
          if [ "$changed" = "true" ]; then
            echo "changed_${src}=true"; any=true
          else
            echo "changed_${src}=false"
          fi
        done >> "$GITHUB_OUTPUT"
        echo "any_changed=$any" >> $GITHUB_OUTPUT
