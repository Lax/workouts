name: Data Store Save
description: Save data to configured store backend
inputs:
  shall-commit-data:
    required: false
    default: 'false'
  git-configured:
    required: false
    default: 'false'
outputs:
  any_changed:
    description: Whether any data changed
    value: ${{ steps.detect.outputs.any_changed }}
runs:
  using: composite
  steps:
    - name: Detect data changes
      id: detect
      shell: bash
      run: |
        any=false
        for src in keep igpsport xoss xingzhe garmin garmin_cn strava; do
          changed=false
          for dir in "data/raw/$src" "data/std/$src"; do
            if [ -d "$dir" ]; then
              if [ ! -f "$dir/SHA256SUMS" ] || ! (cd "$dir" && sha256sum -c SHA256SUMS --quiet >/dev/null 2>&1); then
                changed=true
              fi
            fi
          done
          if [ "$changed" = "true" ]; then
            echo "changed_${src}=true"; any=true
          else
            echo "changed_${src}=false"
          fi
        done >> "$GITHUB_OUTPUT"
        echo "any_changed=$any" >> $GITHUB_OUTPUT

    - uses: ./.github/actions/data-store/sources-cache/save
      if: inputs.shall-commit-data != 'true'

    - uses: ./.github/actions/data-store/sources-git/save
      if: inputs.shall-commit-data == 'true'
      with:
        shall-commit-data: ${{ inputs.shall-commit-data }}
        git-configured: ${{ inputs.git-configured }}

    - name: Commit data
      if: inputs.shall-commit-data == 'true' && inputs.git-configured == 'true' && steps.detect.outputs.any_changed == 'true'
      shell: bash
      run: |
        git diff --cached --quiet && exit 0
        git -c user.name=workouts-bot -c user.email=bot@workouts \
          commit -m "store(sync): $(date -u +%Y%m%d-%H%M%S)"
        git pull --rebase
        git push
