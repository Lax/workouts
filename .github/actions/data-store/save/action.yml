name: Data Store Save
description: >
  Save per-source raw/std caches to GH Actions cache (git-fit data-store),
  aggregate change status per source.

outputs:
  any_changed:
    description: Whether any source changed
    value: ${{ steps.aggregate.outputs.any_changed }}
  changed_sources:
    description: Comma-joined list of changed sources (empty if none)
    value: ${{ steps.aggregate.outputs.changed_sources }}
  unchanged_sources:
    description: Comma-joined list of unchanged sources (empty if none)
    value: ${{ steps.aggregate.outputs.unchanged_sources }}

runs:
  using: composite
  steps:
    - id: save-keep
      uses: git-fit-actions/data-store/cache/save@v1
      with:
        source: keep

    - id: save-igpsport
      uses: git-fit-actions/data-store/cache/save@v1
      with:
        source: igpsport

    - id: save-xoss
      uses: git-fit-actions/data-store/cache/save@v1
      with:
        source: xoss

    - id: save-xingzhe
      uses: git-fit-actions/data-store/cache/save@v1
      with:
        source: xingzhe

    - id: save-garmin
      uses: git-fit-actions/data-store/cache/save@v1
      with:
        source: garmin

    - id: save-garmin_cn
      uses: git-fit-actions/data-store/cache/save@v1
      with:
        source: garmin_cn

    - id: save-strava
      uses: git-fit-actions/data-store/cache/save@v1
      with:
        source: strava

    - name: Aggregate change status
      id: aggregate
      shell: bash
      env:
        CH_KEEP: ${{ steps.save-keep.outputs.changed }}
        CH_IGPSPORT: ${{ steps.save-igpsport.outputs.changed }}
        CH_XOSS: ${{ steps.save-xoss.outputs.changed }}
        CH_XINGZHE: ${{ steps.save-xingzhe.outputs.changed }}
        CH_GARMIN: ${{ steps.save-garmin.outputs.changed }}
        CH_GARMIN_CN: ${{ steps.save-garmin_cn.outputs.changed }}
        CH_STRAVA: ${{ steps.save-strava.outputs.changed }}
      run: |
        changed=""
        unchanged=""
        any=false
        for entry in \
          "keep:$CH_KEEP" \
          "igpsport:$CH_IGPSPORT" \
          "xoss:$CH_XOSS" \
          "xingzhe:$CH_XINGZHE" \
          "garmin:$CH_GARMIN" \
          "garmin_cn:$CH_GARMIN_CN" \
          "strava:$CH_STRAVA"; do
          src="${entry%%:*}"
          ch="${entry#*:}"
          if [ "$ch" = "true" ]; then
            any=true
            changed="${changed:+$changed,}$src"
          else
            unchanged="${unchanged:+$unchanged,}$src"
          fi
        done
        echo "any_changed=$any" >> "$GITHUB_OUTPUT"
        echo "changed_sources=$changed" >> "$GITHUB_OUTPUT"
        echo "unchanged_sources=$unchanged" >> "$GITHUB_OUTPUT"

    - name: Source cache summary
      if: always()
      shell: bash
      run: |
        echo "=== Source digests after sync ==="
        for src in keep igpsport xoss xingzhe garmin garmin_cn strava; do
          raw_ck="data/raw/$src/SHA256SUMS"
          std_ck="data/std/$src/SHA256SUMS"
          raw_digest="$(sha256sum "$raw_ck" 2>/dev/null | cut -d' ' -f1 || echo 'none')"
          std_digest="$(sha256sum "$std_ck" 2>/dev/null | cut -d' ' -f1 || echo 'none')"
          echo "  $src: raw=$raw_digest std=$std_digest"
        done
