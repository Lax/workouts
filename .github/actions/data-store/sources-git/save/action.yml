name: Sources Git Save
description: Save per-source data to git branches
inputs:
  mode:
    required: true
  git-configured:
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Save per-source git branches
      if: inputs.mode == 'git' && inputs.git-configured == 'true'
      shell: bash
      run: |
        for src in keep igpsport xoss xingzhe garmin garmin_cn strava; do
          ck="data/raw/$src/SHA256SUMS"
          if [ ! -f "$ck" ] || ! (cd "data/raw/$src" && sha256sum -c SHA256SUMS --quiet 2>/dev/null); then
            bash scripts/data-store-git-save.sh "_/_/$src" \
              "data/raw/$src data/std/$src data/raw/$src/SHA256SUMS"
          fi
        done
