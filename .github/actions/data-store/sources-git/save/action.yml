name: Sources Git Save
description: Save per-source data to git branches
inputs:
  shall-commit-data:
    required: false
    default: 'false'
  git-configured:
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Save per-source git branches
      if: inputs.shall-commit-data == 'true' && inputs.git-configured == 'true'
      shell: bash
      run: |
        for src in keep igpsport xoss xingzhe garmin garmin_cn strava; do
          changed=false
          for dir in "data/raw/$src" "data/std/$src"; do
            if [ -d "$dir" ]; then
              if [ ! -f "$dir/SHA256SUMS" ]; then
                changed=true
              else
                current_hash=$(sha256sum "$dir/SHA256SUMS" | cut -d' ' -f1)
                saved_hash=$(grep " $dir$" "$RUNNER_TEMP/data-store-orig-checksums" 2>/dev/null | cut -d' ' -f1 || echo "")
                if [ "$current_hash" != "$saved_hash" ]; then
                  changed=true
                fi
              fi
            fi
          done
          if [ "$changed" = "true" ]; then
            bash scripts/data-store-git-save.sh "GitFit/data/$src" \
              "data/raw/$src data/std/$src"
          fi
        done
