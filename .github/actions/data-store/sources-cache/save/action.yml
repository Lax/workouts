name: Data Store Source Save
description: Save changed per-source raw/std caches to GH Actions cache
runs:
  using: composite
  steps:
    - name: Detect changed sources
      id: detect
      shell: bash
      run: |
        for src in keep igpsport xoss xingzhe garmin garmin_cn strava; do
          changed=false
          for dir in "data/raw/$src" "data/std/$src"; do
            if [ -d "$dir" ]; then
              (cd "$dir" && if [ ! -f SHA256SUMS ] || ! sha256sum -c SHA256SUMS --quiet 2>/dev/null; then
                changed=true
              fi)
            fi
          done
          if [ "$changed" = "true" ]; then
            echo "  $src: CHANGED" >&2
            echo "changed_${src}=true"
          else
            echo "  $src: unchanged" >&2
            echo "changed_${src}=false"
          fi
        done >> "$GITHUB_OUTPUT"

    - name: Save — keep
      uses: actions/cache/save@v4
      if: steps.detect.outputs.changed_keep == 'true'
      with:
        path: |
          data/raw/keep/
          data/std/keep/
        key: raw-std-v1-keep-${{ github.run_id }}

    - name: Save — igpsport
      uses: actions/cache/save@v4
      if: steps.detect.outputs.changed_igpsport == 'true'
      with:
        path: |
          data/raw/igpsport/
          data/std/igpsport/
        key: raw-std-v1-igpsport-${{ github.run_id }}

    - name: Save — xoss
      uses: actions/cache/save@v4
      if: steps.detect.outputs.changed_xoss == 'true'
      with:
        path: |
          data/raw/xoss/
          data/std/xoss/
        key: raw-std-v1-xoss-${{ github.run_id }}

    - name: Save — xingzhe
      uses: actions/cache/save@v4
      if: steps.detect.outputs.changed_xingzhe == 'true'
      with:
        path: |
          data/raw/xingzhe/
          data/std/xingzhe/
        key: raw-std-v1-xingzhe-${{ github.run_id }}

    - name: Save — garmin
      uses: actions/cache/save@v4
      if: steps.detect.outputs.changed_garmin == 'true'
      with:
        path: |
          data/raw/garmin/
          data/std/garmin/
        key: raw-std-v1-garmin-${{ github.run_id }}

    - name: Save — garmin_cn
      uses: actions/cache/save@v4
      if: steps.detect.outputs.changed_garmin_cn == 'true'
      with:
        path: |
          data/raw/garmin_cn/
          data/std/garmin_cn/
        key: raw-std-v1-garmin_cn-${{ github.run_id }}

    - name: Save — strava
      uses: actions/cache/save@v4
      if: steps.detect.outputs.changed_strava == 'true'
      with:
        path: |
          data/raw/strava/
          data/std/strava/
        key: raw-std-v1-strava-${{ github.run_id }}

    - name: Source cache summary
      if: always()
      shell: bash
      run: |
        echo "=== Source digests after sync ==="
        for src in keep igpsport xoss xingzhe garmin garmin_cn strava; do
          raw_ck="data/raw/$src/SHA256SUMS"
          std_ck="data/std/$src/SHA256SUMS"
          raw_digest="$(sha256sum "$raw_ck" 2>/dev/null | cut -d' ' -f1 || echo 'none')"
          std_digest="$(sha256sum "$std_ck" 2>/dev/null | cut -d' ' -f1 || echo 'none')"
          echo "  $src: raw=$raw_digest std=$std_digest"
        done
