name: Data Store Source Restore
description: Restore per-source raw/std caches from GH Actions cache
runs:
  using: composite
  steps:
    - uses: actions/cache/restore@v4
      with:
        path: |
          data/raw/keep/
          data/std/keep/
        key: raw-std-v1-keep-${{ github.run_id }}
        restore-keys: raw-std-v1-keep-

    - uses: actions/cache/restore@v4
      with:
        path: |
          data/raw/igpsport/
          data/std/igpsport/
        key: raw-std-v1-igpsport-${{ github.run_id }}
        restore-keys: raw-std-v1-igpsport-

    - uses: actions/cache/restore@v4
      with:
        path: |
          data/raw/xoss/
          data/std/xoss/
        key: raw-std-v1-xoss-${{ github.run_id }}
        restore-keys: raw-std-v1-xoss-

    - uses: actions/cache/restore@v4
      with:
        path: |
          data/raw/xingzhe/
          data/std/xingzhe/
        key: raw-std-v1-xingzhe-${{ github.run_id }}
        restore-keys: raw-std-v1-xingzhe-

    - uses: actions/cache/restore@v4
      with:
        path: |
          data/raw/garmin/
          data/std/garmin/
        key: raw-std-v1-garmin-${{ github.run_id }}
        restore-keys: raw-std-v1-garmin-

    - uses: actions/cache/restore@v4
      with:
        path: |
          data/raw/garmin_cn/
          data/std/garmin_cn/
        key: raw-std-v1-garmin_cn-${{ github.run_id }}
        restore-keys: raw-std-v1-garmin_cn-

    - uses: actions/cache/restore@v4
      with:
        path: |
          data/raw/strava/
          data/std/strava/
        key: raw-std-v1-strava-${{ github.run_id }}
        restore-keys: raw-std-v1-strava-

    - name: Generate SHA256SUMS files
      shell: bash
      run: |
        for src in keep igpsport xoss xingzhe garmin garmin_cn strava; do
          bash scripts/generate-checksums.sh \
            "data/raw/$src" "data/std/$src"
          echo "  $src: done" >&2
        done
