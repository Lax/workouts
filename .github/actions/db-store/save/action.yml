name: DB Store Save
description: Save DB to cache and/or git with SHA256SUMS, skip if unchanged
inputs:
  path:
    required: false
    default: data/workouts.db
  key-prefix:
    required: false
    default: db
  db-schema-hash:
    required: false
    default: ""
  shall-commit-db:
    required: false
    default: 'false'
  git-branch:
    required: false
    default: _/db
  commit-author-name:
    required: false
    default: "git-fit-bot"
  commit-author-email:
    required: false
    default: "bot@git-fit"
outputs:
  db-changed:
    description: "Whether the DB changed and needs saving"
    value: ${{ steps.check.outputs.db-changed }}
  saved:
    description: "Whether the DB was actually saved (cache or git)"
    value: ${{ steps.check.outputs.db-changed }}
runs:
  using: composite
  steps:
    - name: Check DB changed
      id: check
      shell: bash
      run: |
        db="${{ inputs.path }}"
        ck="${db}.SHA256SUMS"
        if [ ! -f "$db" ]; then
          echo "db-changed=false" >> $GITHUB_OUTPUT
          exit 0
        fi
        if [ -f "$ck" ] && sha256sum -c "$ck" --quiet >/dev/null 2>&1; then
          echo "db-changed=false" >> $GITHUB_OUTPUT
        else
          echo "db-changed=true" >> $GITHUB_OUTPUT
        fi

    - name: Generate DB SHA256SUMS
      if: steps.check.outputs.db-changed == 'true'
      shell: bash
      run: |
        db="${{ inputs.path }}"
        sha256sum "$db" > "${db}.SHA256SUMS"
        for f in "${db}-wal" "${db}-shm"; do
          if [ -f "$f" ]; then
            sha256sum "$f" >> "${db}.SHA256SUMS"
          fi
        done

    - name: Save DB git
      if: inputs.shall-commit-db == 'true' && steps.check.outputs.db-changed == 'true'
      shell: bash
      run: |
        BRANCH="${{ inputs.git-branch }}"
        DB="${{ inputs.path }}"
        CK="${DB}.SHA256SUMS"
        TEMP_INDEX=".git/cache-index-$$"
        cleanup() { rm -f "$TEMP_INDEX"; }
        trap cleanup EXIT
        if ! git fetch origin "$BRANCH" 2>/dev/null; then
          echo "Git fetch failed for $BRANCH, skipping git save" >&2
          exit 0
        fi
        GIT_INDEX_FILE="$TEMP_INDEX" git read-tree --empty
        GIT_INDEX_FILE="$TEMP_INDEX" git add -f "$DB" "$CK"
        for ext in wal shm; do
          f="${DB}-${ext}"
          [ -f "$f" ] && GIT_INDEX_FILE="$TEMP_INDEX" git add -f "$f"
        done
        GIT_INDEX_FILE="$TEMP_INDEX" git diff-index --cached --quiet "origin/$BRANCH" 2>/dev/null && {
          echo "No changes to $BRANCH" >&2
          exit 0
        }
        TREE=$(GIT_INDEX_FILE="$TEMP_INDEX" git write-tree)
        if git rev-parse --verify "origin/$BRANCH" >/dev/null 2>&1; then
          PARENT=$(git rev-parse "origin/$BRANCH")
          COMMIT=$(git -c user.name="${{ inputs.commit-author-name }}" -c user.email="${{ inputs.commit-author-email }}" \
            commit-tree -p "$PARENT" -m "store($BRANCH): $(date -u +%Y%m%d-%H%M%S)" "$TREE")
        else
          COMMIT=$(git -c user.name="${{ inputs.commit-author-name }}" -c user.email="${{ inputs.commit-author-email }}" \
            commit-tree -m "store($BRANCH): $(date -u +%Y%m%d-%H%M%S)" "$TREE")
        fi
        git push origin "$COMMIT:refs/heads/$BRANCH"

    - name: Build cache key
      id: ck
      shell: bash
      run: |
        mhash="${{ inputs.db-schema-hash }}"
        [[ -n "$mhash" ]] && mhash="-${mhash}"
        attempt_suffix=""
        [ "${{ github.run_attempt }}" -gt 1 ] && attempt_suffix="-${{ github.run_attempt }}"
        echo "key=${{ inputs.key-prefix }}-v1${mhash}-${{ github.run_id }}${attempt_suffix}" >> $GITHUB_OUTPUT

    - name: Save DB cache
      uses: actions/cache/save@v4
      if: steps.check.outputs.db-changed == 'true'
      with:
        path: |-
          ${{ inputs.path }}
          ${{ inputs.path }}.SHA256SUMS
          ${{ inputs.path }}-wal
          ${{ inputs.path }}-shm
        key: ${{ steps.ck.outputs.key }}
