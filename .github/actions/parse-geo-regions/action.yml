name: Parse Geo Regions
description: >
  Restore geo point cache, run region detection, save cache.
  Cache key auto-invalidated by action file hash.
  Set geo-cache-dir to empty string to disable cache writes and GHA cache.

inputs:
  geo-cache-dir:
    description: >
      Geo cache directory. Per-provider files (amap-points.jsonl, nominatim-points.jsonl)
      written under this dir. Empty string disables cache writes and GHA cache.
    required: false
    default: data/cache
  cache-key:
    description: Cache key (hash of this file appended automatically)
    required: false
    default: workouts-geo-v1-${{ hashFiles('.github/actions/parse-geo-regions/action.yml') }}
  amap-key:
    description: Amap API key
    required: true
  db-path:
    description: SQLite database path
    required: false
    default: data/db/workouts.db
  detect-limit:
    description: Max activities to process
    required: false
    default: '200'
  detect-batch:
    description: Batch size
    required: false
    default: '20'
  detect-strategy:
    description: Sampling strategy
    required: false
    default: proportional
  detect-time:
    description: Time budget in seconds
    required: false
    default: '300'

outputs:
  cache-hit:
    description: Whether the cache was hit
    value: ${{ steps.restore.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Restore geo cache
      if: ${{ inputs.geo-cache-dir != '' }}
      id: restore
      uses: actions/cache@v6.1.0
      with:
        path: |
          ${{ inputs.geo-cache-dir }}/amap-points.jsonl
          ${{ inputs.geo-cache-dir }}/nominatim-points.jsonl
          ${{ inputs.geo-cache-dir }}/SHA256SUMS
        key: ${{ inputs.cache-key }}
        restore-keys: workouts-geo-v1-

    - name: Geo region detection
      shell: bash
      env:
        AMAP_API_KEY: ${{ inputs.amap-key }}
        GIT_FIT_DATABASE_PATH: ${{ inputs.db-path }}
      run: |
        CACHE_DIR_FLAG=""
        if [ "${{ inputs.geo-cache-dir }}" != "" ]; then
          CACHE_DIR_FLAG="--cache-dir ${{ inputs.geo-cache-dir }}"
        fi
        bundle exec git fit geo detect \
          --limit ${{ inputs.detect-limit }} \
          --batch ${{ inputs.detect-batch }} \
          --strategy ${{ inputs.detect-strategy }} \
          --time ${{ inputs.detect-time }} \
          $CACHE_DIR_FLAG

    - name: Generate geo cache SHA256SUMS
      if: always() && ${{ inputs.geo-cache-dir != '' }}
      shell: bash
      env:
        GEO_CACHE_DIR: ${{ inputs.geo-cache-dir }}
      run: |
        if [ -d "$GEO_CACHE_DIR" ]; then
          pushd "$GEO_CACHE_DIR" > /dev/null
          sha256sum amap-points.jsonl nominatim-points.jsonl 2>/dev/null > SHA256SUMS || true
          popd > /dev/null
        fi
